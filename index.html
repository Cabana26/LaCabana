function modalPasarInventario(e){
  let fotos = [];
  openModal(`

    <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="btnPasarInv" disabled>Pasar al inventario</button></div>`, 'lg');
  const pintar = ()=>{
    document.getElementById('piVista').innerHTML = fotos.map((f,i)=>`<div class="photo-preview"><img src="${URL.createObjectURL(f)}" alt=""><button type="button" data-i="${i}">${icon('x')}</button></div>`).join('');
    document.querySelectorAll('#piVista button').forEach(b=>b.addEventListener('click', ()=>{ fotos.splice(Number(b.dataset.i),1); pintar(); }));
    document.getElementById('btnPasarInv').disabled = fotos.length === 0;
  };
  const agregar = ev=>{ fotos.push(...[...ev.target.files].slice(0, 5 - fotos.length)); ev.target.value=''; pintar(); };
  document.getElementById('piCamara').addEventListener('click', ()=>document.getElementById('piInputCamara').click());
  document.getElementById('piGaleria').addEventListener('click', ()=>document.getElementById('piInputGaleria').click());
  document.getElementById('piInputCamara').addEventListener('change', agregar);
  document.getElementById('piInputGaleria').addEventListener('change', agregar);
  // si el extra ya tenía foto, se usa como primera
  if(e.foto_url){ fetch(e.foto_url).then(r=>r.blob()).then(b=>{ fotos.unshift(new File([b], 'foto.jpg', { type:b.type||'image/jpeg' })); pintar(); }).catch(()=>{}); }
  document.getElementById('btnPasarInv').addEventListener('click', async ev=>{

    toast('Ya está en el inventario','success'); closeModal(); await refresh();
  });
}

// Elegir productos para una caja (nueva o ya abierta), cada uno con su precio para ella.
function selectorProductosCaja(){
  const disp = DB.state.extras.filter(e=>e.estado==='disponible').sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre),'es'));
  return `<input id="cnBuscar" type="search" placeholder="Buscar producto…" autocomplete="off" style="margin-bottom:10px;">
    <div class="cn-lista" id="cnLista">${disp.length ? disp.map(e=>`<label class="cn-fila" data-q="${escHtml(normalizar(e.nombre+' '+e.codigo+' '+(e.categoria||'')))}">
      <input type="checkbox" class="cn-chk" value="${e.id}">
      <span class="cn-nom">${escHtml(e.nombre)}<small>${escHtml(e.codigo)} · Normal ${money(e.precio_venta)}</small></span>
      <input type="number" inputmode="decimal" step="0.01" min="0" class="cn-precio" value="${e.precio_externa || e.precio_venta}" aria-label="Precio para ella">
    </label>`).join('') : `<div class="text-faint text-center" style="padding:24px 0;">No hay productos extras disponibles</div>`}</div>`;
}
function enlazarSelectorProductosCaja(alCambiar){
  const lista = document.getElementById('cnLista');
  document.getElementById('cnBuscar').addEventListener('input', ev=>{
    const q = normalizar(ev.target.value).trim();
    lista.querySelectorAll('.cn-fila').forEach(f=>{ f.hidden = !!q && !f.dataset.q.includes(q); });
  });
  lista.addEventListener('input', alCambiar); lista.addEventListener('change', alCambiar);
}
function itemsElegidosCaja(){
  return [...document.querySelectorAll('#cnLista .cn-fila')].filter(f=>f.querySelector('.cn-chk').checked)
    .map(f=>({ producto_id:f.querySelector('.cn-chk').value, precio_externa:Number(f.querySelector('.cn-precio').value) }));
}
function modalCajaNueva(externaId){

  if(!DB.state.extras.some(e=>e.estado==='disponible')){ toast('No hay productos extras disponibles','danger'); navigate('a-extras'); return; }
  openModal(`
    <div class="modal-head"><div class="modal-title">Nueva caja de entrega</div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="form-group"><label>¿Para quién?</label><select id="cnExterna">${DB.state.externas.filter(x=>x.activa).map(x=>`<option value="${x.id}"${x.id===externaId?' selected':''}>${escHtml(x.nombre)} (${TIPOS_EXTERNA[x.tipo]})</option>`).join('')}</select></div>
      <label style="font-weight:700;display:block;margin-bottom:6px;">Productos que se lleva</label>

// La caja: qué se llevó, qué vendió, qué devolvió, cuánto pagó y cuánto debe.
function modalCajaExt(c){
  const x = DB.state.externas.find(e=>e.id===c.externa_id) || { nombre:'—', tipo:'individual' };
  const r = DB.resumenCaja(c.id), abierta = c.estado === 'abierta';
  const listo = abierta && r.tiene === 0 && r.saldo <= 0 && r.items.length > 0;
  const motivo = !abierta ? '' : r.tiene > 0 ? 'Marca qué pasó con cada producto para poder cerrarla.' : r.saldo > 0 ? `Falta cobrar ${money(r.saldo)}.` : '';
  const filaItem = it=>{
    const seg = abierta && it.estado !== 'devuelto'
      ? `<div class="seg" data-item="${it.id}"><button type="button" data-v="entregado" class="${it.estado==='entregado'?'on':''}">La tiene</button><button type="button" data-v="vendido" class="${it.estado==='vendido'?'on verde':''}">Vendió</button><button type="button" data-v="devuelto">Devolvió</button></div>`
      : `<span class="badge ${it.estado==='vendido'?'badge-success':it.estado==='devuelto'?'badge-neutral':'badge-warning'}">${it.estado==='vendido'?'Vendió':it.estado==='devuelto'?'Devolvió':'La tiene'}</span>`;
    return `<div class="caja-item"><div class="ci-top"><div class="ci-nom">${escHtml(it.nombre)}<small>${escHtml(it.codigo||'')}</small></div><div class="ci-precio">${money(it.precio_externa)}</div></div>${seg}</div>`;
  };
  openModal(`
    <div class="modal-head"><div><div class="modal-title">${escHtml(x.nombre)}</div><div class="text-muted" style="font-size:12.5px;">${escHtml(c.codigo)} · ${fechaCorta(c.creada_en)} · ${TIPOS_EXTERNA[x.tipo]}${abierta?'':' · Cerrada'}</div></div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="resumen-caja">
        <div><b>${money(r.vendido)}</b><span>Vendió</span></div>
        <div><b>${money(r.pagado)}</b><span>Pagó</span></div>
        <div class="${r.saldo>0?'debe':'ok'}"><b>${money(Math.max(r.saldo,0))}</b><span>Debe</span></div>
      </div>
      <div class="caja-acciones"><button class="btn btn-secondary btn-sm" id="cjComprobante">${icon('receipt')} Comprobante</button>${abierta?`<button class="btn btn-secondary btn-sm" id="cjAgregar">${icon('plus')} Agregar</button>`:''}</div>
      <div class="caja-items">${r.items.map(filaItem).join('') || '<div class="text-faint">Sin productos</div>'}</div>
      ${r.pagos.length?`<div class="mas-seccion" style="margin-top:16px;">Pagos</div>${r.pagos.map(p=>`<div class="venta-item"><div class="vi-main"><div class="vi-nombre">${fechaCorta(p.fecha)}</div>${p.nota?`<div class="vi-sub">${escHtml(p.nota)}</div>`:''}</div><div class="vi-monto">${money(p.monto)}</div></div>`).join('')}`:''}
      ${c.notas?`<p class="text-muted" style="margin-top:14px;">Nota: ${escHtml(c.notas)}</p>`:''}
      ${motivo?`<p class="text-muted" style="margin-top:14px;">${motivo}</p>`:''}
    </div>
    ${abierta?`<div class="modal-foot caja-foot">
        <button class="btn btn-secondary btn-sm" id="cjPago"${r.saldo>0?'':' disabled'}>Registrar pago</button>
        <button class="btn btn-secondary btn-sm" id="cjPagoTodo"${r.tiene+r.saldo>0?'':' disabled'}>Pagó todo</button>
        <button class="btn btn-primary btn-sm" id="cjCerrar"${listo?'':' disabled'}>Cerrar caja</button>
      </div>`:''}`, 'lg');
  const recargar = async ()=>{ await DB.fetchAll(); if(currentPage) navigate(currentPage); modalCajaExt(DB.state.cajas_ext.find(k=>k.id===c.id)); };
  document.querySelectorAll('.caja-item .seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.addEventListener('click', async ()=>{
    const itemId = seg.dataset.item, nuevo = b.dataset.v;
    const actual = DB.state.extras_items.find(i=>i.id===itemId);
    if(actual && actual.estado === nuevo) return;
    if(nuevo === 'devuelto' && !confirm('¿Devolvió este producto? Vuelve a Productos extras.')) return;
    const res = await DB.cambiarItemCaja(itemId, nuevo);
    if(!res.ok) return toast(mensajeErrorExtras(res.error),'danger');
    recargar();
  })));
  document.getElementById('cjComprobante').addEventListener('click', ()=>modalComprobanteCaja(c));
  if(abierta){
    document.getElementById('cjAgregar').addEventListener('click', ()=>modalAgregarACaja(c));
    document.getElementById('cjPago').addEventListener('click', ()=>modalPagoCaja(c));
    document.getElementById('cjPagoTodo').addEventListener('click', async ()=>{
      const fresco = DB.resumenCaja(c.id);
      const total = fresco.saldo + DB.itemsDeCaja(c.id).filter(i=>i.estado==='entregado').reduce((s,i)=>s+Number(i.precio_externa),0);
      if(!confirm('Se marca todo como vendido y se registra el pago de '+money(total)+'. ¿Seguir?')) return;
      const res = await DB.pagarTodoCaja(c.id);
      if(!res.ok) return toast(mensajeErrorExtras(res.error),'danger');
      toast('Pago registrado','success'); recargar();
    });
    document.getElementById('cjCerrar').addEventListener('click', async ()=>{
      if(!confirm('¿Cerrar la caja? Lo que vendió se quita de Productos extras.')) return;
      const res = await DB.cerrarCajaExterna(c.id);
      if(!res.ok) return toast(mensajeErrorExtras(res.error),'danger');
      toast('Caja cerrada','success'); closeModal(); await refresh();
    });
  }
}
function modalPagoCaja(c){
  const r = DB.resumenCaja(c.id);
  openModal(`
    <div class="modal-head"><div class="modal-title">Registrar pago</div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="text-muted" style="margin-bottom:12px;">Debe ${money(r.saldo)}</div>
      <div class="form-group"><label>Monto que pagó (${DB.state.configuracion.moneda_simbolo})</label><input type="number" inputmode="decimal" step="0.01" min="0" id="pgMonto" value="${r.saldo}"></div>
      <div class="form-group"><label>Nota (opcional)</label><input id="pgNota" autocomplete="off"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" id="pgVolver">Volver</button><button class="btn btn-primary" id="pgGuardar">Guardar pago</button></div>`);
  document.getElementById('pgVolver').addEventListener('click', ()=>modalCajaExt(DB.state.cajas_ext.find(k=>k.id===c.id)));
  document.getElementById('pgGuardar').addEventListener('click', async ev=>{
    const monto = Number(document.getElementById('pgMonto').value);
    if(!(monto > 0)) return toast('Escribe el monto','danger');
    ev.target.closest('button').disabled = true;
    const res = await DB.pagarCaja(c.id, monto, document.getElementById('pgNota').value);

    toast('Pago guardado','success'); await DB.fetchAll(); if(currentPage) navigate(currentPage);
    modalCajaExt(DB.state.cajas_ext.find(k=>k.id===c.id));
  });
}

/* ---------------------------------------------------------------- Comprobante (imagen) */
function ajustarTexto(ctx, texto, ancho){
  if(ctx.measureText(texto).width <= ancho) return texto;
  let t = texto;
  while(t.length > 1 && ctx.measureText(t + '…').width > ancho) t = t.slice(0, -1);
  return t.trim() + '…';
}
function dibujarComprobante(canvas, d){
  const W = 1080, M = 64, FILA = 80, cuenta = d.modo === 'cuenta';
  const cs = getComputedStyle(document.documentElement);
  const acento = (cs.getPropertyValue('--color-accent') || '').trim() || '#BE8A8A';
  const FUENTE = '"Fira Sans", "Helvetica Neue", Arial, sans-serif';
  const pasada = ctx=>{
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#FFFDF9'; ctx.fillRect(0, 0, W, 6000);
    ctx.fillStyle = acento; ctx.fillRect(0, 0, W, 250);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    ctx.font = `800 64px ${FUENTE}`; ctx.fillText(ajustarTexto(ctx, d.negocio, W - M*2), M, 112);
    ctx.font = `600 38px ${FUENTE}`; ctx.fillText(cuenta ? 'Estado de cuenta' : 'Comprobante de entrega', M, 172);
    ctx.font = `500 30px ${FUENTE}`; ctx.globalAlpha = .92; ctx.fillText(d.caja.codigo + '  ·  ' + d.fecha, M, 220); ctx.globalAlpha = 1;
    let y = 330;
    ctx.fillStyle = '#2A1D15'; ctx.font = `800 46px ${FUENTE}`; ctx.fillText(ajustarTexto(ctx, d.externa.nombre, W - M*2), M, y);
    y += 48; ctx.fillStyle = '#8A7364'; ctx.font = `500 30px ${FUENTE}`;
    ctx.fillText(TIPOS_EXTERNA[d.externa.tipo] + (d.externa.telefono ? '  ·  ' + d.externa.telefono : ''), M, y);
    y += 40; ctx.fillStyle = '#E8DDD3'; ctx.fillRect(M, y, W - M*2, 3);
    y += 54; ctx.fillStyle = '#8A7364'; ctx.font = `700 26px ${FUENTE}`;
    ctx.fillText('PRODUCTO', M, y); ctx.textAlign = 'right'; ctx.fillText('PRECIO', W - M, y); ctx.textAlign = 'left';
    y += 24;
    d.items.forEach((it, i)=>{
      if(i % 2 === 0){ ctx.fillStyle = '#F6EFE8'; ctx.fillRect(M - 20, y, W - M*2 + 40, FILA); }
      const base = y + FILA/2 + 12;
      ctx.fillStyle = '#2A1D15'; ctx.font = `600 34px ${FUENTE}`; ctx.textAlign = 'left';
      ctx.fillText(ajustarTexto(ctx, it.nombre, cuenta ? 520 : 700), M, base);
      if(cuenta){
        ctx.font = `700 27px ${FUENTE}`; ctx.textAlign = 'right';
        ctx.fillStyle = it.estado==='vendido' ? '#2F7D4F' : it.estado==='devuelto' ? '#8A7364' : '#B8741A';
        ctx.fillText(it.estado==='vendido' ? 'Vendió' : it.estado==='devuelto' ? 'Devolvió' : 'La tiene', W - M - 200, base);
      }
      ctx.fillStyle = it.estado==='devuelto' && cuenta ? '#B5A89C' : '#2A1D15'; ctx.font = `800 34px ${FUENTE}`; ctx.textAlign = 'right';
      ctx.fillText(money(it.precio), W - M, base);
      y += FILA;
    });
    y += 34; ctx.fillStyle = '#E8DDD3'; ctx.fillRect(M, y, W - M*2, 3); y += 20;
    const linea = (txt, valor, color, grande)=>{
      y += grande ? 78 : 64;
      ctx.textAlign = 'left'; ctx.fillStyle = '#6B5A4D'; ctx.font = `600 ${grande?40:34}px ${FUENTE}`; ctx.fillText(txt, M, y);
      ctx.textAlign = 'right'; ctx.fillStyle = color || '#2A1D15'; ctx.font = `800 ${grande?52:36}px ${FUENTE}`; ctx.fillText(valor, W - M, y);
    };
    if(!cuenta){
      linea('Total (' + d.items.length + ' producto' + (d.items.length===1?'':'s') + ')', money(d.total), acento, true);
    } else {
      linea('Se llevó', money(d.total));
      linea('Vendió', money(d.vendido), '#2F7D4F');
      linea('Pagó', money(d.pagado));
      linea(d.saldo > 0 ? 'Debe' : 'Al día', d.saldo > 0 ? money(d.saldo) : money(0), d.saldo > 0 ? '#B3261E' : '#2F7D4F', true);
      if(d.pagos.length){
        y += 56; ctx.textAlign = 'left'; ctx.fillStyle = '#8A7364'; ctx.font = `700 26px ${FUENTE}`; ctx.fillText('PAGOS', M, y);
        d.pagos.forEach(p=>{
          y += 54; ctx.textAlign = 'left'; ctx.fillStyle = '#6B5A4D'; ctx.font = `500 30px ${FUENTE}`;
          ctx.fillText(p.fecha + (p.nota ? '  ·  ' + ajustarTexto(ctx, p.nota, 480) : ''), M, y);
          ctx.textAlign = 'right'; ctx.fillStyle = '#2A1D15'; ctx.font = `700 32px ${FUENTE}`; ctx.fillText(money(p.monto), W - M, y);
        });
      }
    }
    y += 90; ctx.textAlign = 'center'; ctx.fillStyle = '#8A7364'; ctx.font = `500 28px ${FUENTE}`; ctx.fillText('Gracias', W/2, y);
    return y + 70;
  };
  const medir = document.createElement('canvas'); medir.width = W; medir.height = 6000;
  const alto = pasada(medir.getContext('2d'));
  canvas.width = W; canvas.height = alto;
  pasada(canvas.getContext('2d'));
}
function datosComprobante(c, modo){
  const x = DB.state.externas.find(e=>e.id===c.externa_id) || { nombre:'—', tipo:'individual', telefono:'' };
  const r = DB.resumenCaja(c.id);
  return {
    modo, negocio: document.querySelector('.login-logo .name')?.textContent || 'La Cabaña', externa:x, caja:c,
    fecha: fechaCorta(c.creada_en),
    items: r.items.map(i=>({ nombre:i.nombre, precio:Number(i.precio_externa), estado:i.estado })),
    total: r.total, vendido: r.vendido, pagado: r.pagado, saldo: Math.max(r.saldo, 0),
    pagos: r.pagos.map(p=>({ fecha:fechaCorta(p.fecha), monto:Number(p.monto), nota:p.nota||'' }))
  };
}
async function modalComprobanteCaja(c){
  const r0 = DB.resumenCaja(c.id);
  let modo = (r0.vendidos || r0.devueltos || r0.pagos.length || c.estado==='cerrada') ? 'cuenta' : 'entrega', blob = null;
  openModal(`
    <div class="modal-head"><div class="modal-title">Comprobante</div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body" style="text-align:center;">
      <div class="seg seg-grande" id="cpModo" style="margin-bottom:14px;"><button type="button" data-v="entrega" class="${modo==='entrega'?'on':''}">Lo que se llevó</button><button type="button" data-v="cuenta" class="${modo==='cuenta'?'on':''}">Estado de cuenta</button></div>
      <div id="cpCargando" class="text-muted" style="padding:40px 0;">Generando imagen…</div>
      <canvas id="cpCanvas" style="max-width:100%;max-height:56vh;border-radius:12px;box-shadow:var(--shadow-lg);" hidden></canvas>
      <div id="cpBotones" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;" hidden></div>
    </div>`, 'lg');
  try{ await document.fonts.load('800 60px "Fira Sans"'); await document.fonts.ready; }catch(e){}
  const canvas = document.getElementById('cpCanvas'), botones = document.getElementById('cpBotones');
  const nombreArchivo = ()=>`comprobante-${c.codigo}-${modo}.png`;
  const generar = async ()=>{
    dibujarComprobante(canvas, datosComprobante(DB.state.cajas_ext.find(k=>k.id===c.id) || c, modo));
    blob = await new Promise(res=>canvas.toBlob(res, 'image/png'));
    document.getElementById('cpCargando').hidden = true; canvas.hidden = false; botones.hidden = false;
  };
  botones.innerHTML = `<button class="btn btn-secondary btn-sm" id="cpDescargar">${icon('download')} Descargar imagen</button>`;
  document.getElementById('cpDescargar').addEventListener('click', ()=>{
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombreArchivo(); a.click();
  });
  if(navigator.canShare && navigator.canShare({ files:[new File([new Blob(['x'])], 'x.png', { type:'image/png' })] })){
    const b = document.createElement('button'); b.className = 'btn btn-primary btn-sm'; b.innerHTML = `${icon('whatsapp')} Compartir`;
    b.addEventListener('click', async ()=>{
      try{ await navigator.share({ files:[new File([blob], nombreArchivo(), { type:'image/png' })], title:'Comprobante ' + c.codigo }); }catch(e){}
    });
    botones.appendChild(b);
  }
  document.querySelectorAll('#cpModo button').forEach(b=>b.addEventListener('click', async ()=>{
    modo = b.dataset.v; document.querySelectorAll('#cpModo button').forEach(o=>o.classList.toggle('on', o===b)); await generar();
  }));
  await generar();
}

/* ---------------------------------------------------------------- Bodega */
function productosEnUbicacion(id){
  return {
    prods: DB.state.productos.filter(p=>p.ubicacion_id===id && !p.archivado),
    extras: DB.state.extras.filter(e=>e.ubicacion_id===id)
  };
}
PAGES['a-bodega'] = () => {
  const l = DB.state.ubicaciones || [];
  return `
    <div class="toolbar"><button class="btn btn-primary btn-sm" id="btnNuevaUbicacion" style="flex:1 1 100%;">${icon('plus')} Nuevo lugar</button></div>
    <div class="ubi-grid">${l.length ? l.map(u=>{
      const { prods, extras } = productosEnUbicacion(u.id), n = prods.length + extras.length;
      return `<div class="ubi-card" data-action="ver-ubicacion" data-id="${u.id}">
        <div class="ubi-foto">${u.foto_url ? imgMini(u.foto_url, escHtml(u.nombre)) : `<div class="sf-sinfoto">${icon('pin')}<span>Sin foto</span></div>`}</div>
        <div class="ubi-info"><div class="ubi-nombre">${escHtml(u.nombre)}</div>
          ${u.descripcion?`<div class="ubi-desc">${escHtml(u.descripcion)}</div>`:''}
          <div class="ubi-n">${n} producto${n===1?'':'s'}</div></div></div>`;
    }).join('') : `<div class="text-faint text-center" style="grid-column:1/-1;padding:40px 10px;">Aún no hay lugares. Crea uno: Estantería 1, Bodega, o el nombre de la persona que tiene productos.</div>`}</div>`;
};
function modalUbicacionForm(u){
  const edit = !!u; let foto = null;
  openModal(`
    <div class="modal-head"><div class="modal-title">${edit?'Editar lugar':'Nuevo lugar'}</div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Nombre *</label><input id="ubNombre" value="${edit?escHtml(u.nombre):''}" placeholder="Ej: Estantería 1" autocomplete="off"></div>
      <div class="form-group"><label>Descripción</label><input id="ubDesc" value="${edit?escHtml(u.descripcion||''):''}" placeholder="Ej: Al fondo, junto a la puerta" autocomplete="off"></div>
      <div class="form-group"><label>Foto</label>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="res-thumb" id="ubFotoVista" style="width:72px;height:72px;">${edit&&u.foto_url?imgMini(u.foto_url,''):icon('image')}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;"><button type="button" class="btn btn-secondary btn-sm" id="ubCamara">${icon('image')} Tomar foto</button><button type="button" class="btn btn-secondary btn-sm" id="ubGaleria">${icon('upload')} Galería</button></div>
          <input type="file" id="ubInputCamara" accept="image/*" capture="environment" hidden><input type="file" id="ubInputGaleria" accept="image/*" hidden>
        </div></div>
    </div>
    <div class="modal-foot">${edit?`<button class="btn btn-ghost" id="ubEliminar" style="margin-right:auto;color:var(--red-700);">Eliminar</button>`:''}<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="ubGuardar">${edit?'Guardar':'Crear'}</button></div>`);
  const elegir = ev=>{ foto = ev.target.files[0] || null; if(foto) document.getElementById('ubFotoVista').innerHTML = `<img src="${URL.createObjectURL(foto)}" alt="">`; };
  document.getElementById('ubCamara').addEventListener('click', ()=>document.getElementById('ubInputCamara').click());
  document.getElementById('ubGaleria').addEventListener('click', ()=>document.getElementById('ubInputGaleria').click());
  document.getElementById('ubInputCamara').addEventListener('change', elegir);
  document.getElementById('ubInputGaleria').addEventListener('change', elegir);
  document.getElementById('ubGuardar').addEventListener('click', async ev=>{
    ev.target.closest('button').disabled = true;
    const r = await DB.guardarUbicacion(edit?u.id:null, { nombre:document.getElementById('ubNombre').value, descripcion:document.getElementById('ubDesc').value }, foto);
    if(!r.ok){ ev.target.closest('button').disabled = false; return toast(mensajeErrorExtras(r.error),'danger'); }
    toast(r.aviso || 'Guardado', r.aviso?'':'success'); closeModal(); await refresh();
  });
  if(edit) document.getElementById('ubEliminar').addEventListener('click', async ()=>{
    if(!confirm('¿Eliminar este lugar? Los productos quedan sin lugar.')) return;
    const r = await DB.eliminarUbicacion(u.id);
    if(!r.ok) return toast('No se pudo eliminar','danger');
    toast('Eliminado','success'); closeModal(); await refresh();
  });
}
function modalUbicacion(u){
  const { prods, extras } = productosEnUbicacion(u.id);
  const fila = (nombre, sub, tipo, id)=>`<div class="venta-item"><div class="vi-main"><div class="vi-nombre">${escHtml(nombre)}</div><div class="vi-sub">${escHtml(sub)}</div></div>
    <button type="button" class="btn btn-ghost btn-sm" data-quitar="${tipo}:${id}">Quitar</button></div>`;
  openModal(`
    <div class="modal-head"><div class="modal-title">${escHtml(u.nombre)}</div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      ${u.foto_url?`<img src="${u.foto_url}" alt="" class="ubi-foto-grande" id="ubFotoGrande">`:''}
      ${u.descripcion?`<p class="text-muted" style="margin:10px 0 0;">${escHtml(u.descripcion)}</p>`:''}
      <div class="mas-seccion" style="margin-top:16px;">Aquí hay ${prods.length+extras.length} producto${prods.length+extras.length===1?'':'s'}</div>
      ${prods.map(p=>fila(p.nombre, p.codigo, 'p', p.id)).join('')}
      ${extras.map(e=>fila(e.nombre, e.codigo + ' · Extra', 'e', e.id)).join('')}
      ${prods.length+extras.length?'':'<div class="text-faint" style="padding:10px 0;">Todavía no hay productos aquí</div>'}
    </div>
    <div class="modal-foot"><button class="btn btn-secondary btn-sm" id="ubEditar">${icon('edit')} Editar</button><button class="btn btn-primary btn-sm" id="ubAgregar">${icon('plus')} Agregar productos</button></div>`, 'lg');
  document.getElementById('ubFotoGrande')?.addEventListener('click', ()=>openLightbox([u.foto_url], 0));
  document.getElementById('ubEditar').addEventListener('click', ()=>modalUbicacionForm(u));
  document.getElementById('ubAgregar').addEventListener('click', ()=>modalAsignarUbicacion(u));
  document.querySelectorAll('[data-quitar]').forEach(b=>b.addEventListener('click', async ()=>{
    const [tipo, id] = b.dataset.quitar.split(':');
    b.disabled = true;
    const r = await DB.asignarUbicacion(null, tipo==='p'?[id]:[], tipo==='e'?[id]:[]);
    if(!r.ok) return toast('No se pudo quitar','danger');
    await DB.fetchAll(); if(currentPage) navigate(currentPage); modalUbicacion(DB.ubicacionDe(u.id));
  }));
}
function modalAsignarUbicacion(u){
  const items = [
    ...DB.state.productos.filter(p=>!p.archivado && p.ubicacion_id!==u.id).map(p=>({ t:'p', id:p.id, nombre:p.nombre, sub:p.codigo, ubi:p.ubicacion_id })),
    ...DB.state.extras.filter(e=>e.ubicacion_id!==u.id).map(e=>({ t:'e', id:e.id, nombre:e.nombre, sub:e.codigo+' · Extra', ubi:e.ubicacion_id }))
  ].sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  openModal(`
    <div class="modal-head"><div class="modal-title">Agregar a ${escHtml(u.nombre)}</div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <input id="cnBuscar" type="search" placeholder="Buscar producto…" autocomplete="off" style="margin-bottom:10px;">
      <div class="cn-lista" id="cnLista">${items.map(i=>{
        const otra = DB.ubicacionDe(i.ubi);
        return `<label class="cn-fila" data-q="${escHtml(normalizar(i.nombre+' '+i.sub))}"><input type="checkbox" class="cn-chk" value="${i.t}:${i.id}"><span class="cn-nom">${escHtml(i.nombre)}<small>${escHtml(i.sub)}${otra?' · Ahora en '+escHtml(otra.nombre):''}</small></span></label>`;
      }).join('') || '<div class="text-faint text-center" style="padding:24px 0;">No hay más productos</div>'}</div>
    </div>
    <div class="modal-foot"><div class="cn-resumen" id="cnResumen">0 elegidos</div><button class="btn btn-primary" id="btnAsignarUbi" disabled>Guardar aquí</button></div>`, 'lg');
  const elegidos = ()=>[...document.querySelectorAll('#cnLista .cn-chk:checked')].map(c=>c.value.split(':'));
  document.getElementById('cnBuscar').addEventListener('input', ev=>{
    const q = normalizar(ev.target.value).trim();
    document.querySelectorAll('#cnLista .cn-fila').forEach(f=>{ f.hidden = !!q && !f.dataset.q.includes(q); });
  });
  document.getElementById('cnLista').addEventListener('change', ()=>{
    const n = elegidos().length; document.getElementById('cnResumen').textContent = n + ' elegido' + (n===1?'':'s'); document.getElementById('btnAsignarUbi').disabled = n === 0;
  });
  document.getElementById('btnAsignarUbi').addEventListener('click', async ev=>{
    ev.target.closest('button').disabled = true;
    const e = elegidos();
    const r = await DB.asignarUbicacion(u.id, e.filter(x=>x[0]==='p').map(x=>x[1]), e.filter(x=>x[0]==='e').map(x=>x[1]));
    if(!r.ok){ ev.target.closest('button').disabled = false; return toast('No se pudo guardar','danger'); }
    toast('Guardado','success'); await DB.fetchAll(); if(currentPage) navigate(currentPage); modalUbicacion(DB.ubicacionDe(u.id));
  });
}

   EVENTOS POR PÁGINA (delegación central abajo se encarga de [data-action])
===================================================================== */
function bindPageEvents(page){
  if(page==='a-dashboard') document.getElementById('btnBorrarBitacoraDash')?.addEventListener('click', modalConfirmarBorrarBitacora);
  if(page==='a-usuarios') document.getElementById('btnNuevoUsuario')?.addEventListener('click', modalNuevoUsuario);
  if(page==='a-bitacora') document.getElementById('btnBorrarBitacora')?.addEventListener('click', modalConfirmarBorrarBitacora);
  if(page==='a-nuevo'){
    enlazarClasificacionNueva('npCategoria','npCategoriaNueva');
    let fotosBuffer = [];
    const agregar = e=>{
      fotosBuffer.push(...[...e.target.files].slice(0, 5-fotosBuffer.length));
      e.target.value = '';
      renderPreview();
    };
    document.getElementById('npBtnCamara').addEventListener('click', ()=>document.getElementById('npFotoCamara').click());
    document.getElementById('npBtnGaleria').addEventListener('click', ()=>document.getElementById('npFotos').click());
    document.getElementById('npFotoCamara').addEventListener('change', agregar);
    document.getElementById('npFotos').addEventListener('change', agregar);
    function renderPreview(){
      document.getElementById('npPreview').innerHTML = fotosBuffer.map((f,i)=>`<div class="photo-preview"><img src="${URL.createObjectURL(f)}"><button type="button" data-i="${i}">${icon('x')}</button></div>`).join('');
      document.querySelectorAll('#npPreview button').forEach(b=>b.addEventListener('click', ()=>{ fotosBuffer.splice(Number(b.dataset.i),1); renderPreview(); }));
      document.getElementById('npFotosHint').textContent = fotosBuffer.length ? fotosBuffer.length+' de 5 fotos' : 'Hasta 5 fotos. Se guardan livianas para que el sistema siga rápido.';
    }
    document.getElementById('formNuevoProducto').addEventListener('submit', async e=>{
      e.preventDefault();
      const nombre = document.getElementById('npNombre').value.trim();
      const precio = document.getElementById('npPrecio').value;
      if(!nombre || !precio) return toast('Escribe el nombre y el precio','danger');
      const btn = e.target.querySelector('button[type=submit]');
      const btnHtml = btn.innerHTML;
      btn.disabled = true; btn.textContent = 'Guardando...';
      const urlVideo = await resolverVideoUrl(document.getElementById('npVideo').value);
      const gastosPredefinidos = [...document.querySelectorAll('.np-gasto-check:checked')].map(chk=>chk.value);
      const res = await DB.crearProducto({
        nombre, categoria: await leerClasificacion('npCategoria','npCategoriaNueva'), ubicacion_id: document.getElementById('npUbicacion').value||null, caja_id: document.getElementById('npCaja').value||null,
        descripcion: document.getElementById('npDescripcion').value, costo: document.getElementById('npCosto').value || 0, precio_venta: precio,
        porcentaje_ganancia: document.getElementById('npPorcentaje').value, url_video: urlVideo,
        etiquetas: document.getElementById('npEtiquetas').value, gastos_predefinidos: gastosPredefinidos
      }, []);
      if(res.ok){ modalProductoCreado(res.data, fotosBuffer); }
      else { toast('No se pudo crear: '+res.error,'danger'); btn.disabled = false; btn.innerHTML = btnHtml; }
    });
  }
  if(page==='v-catalogo' || page==='a-inventario') document.getElementById('btnCompartirCatalogo')?.addEventListener('click', modalCompartirCatalogo);
  if(page==='v-catalogo'){
    const search = document.getElementById('catalogoSearch');
    const dibujar = ()=>{ document.getElementById('catalogoLista').innerHTML = catalogoContenido(); };
    document.getElementById('swFotos').addEventListener('change', e=>{ verFotos = e.target.checked; guardarVerFotos(verFotos); dibujar(); });
    search.addEventListener('input', ()=>{ busquedaCat.q = search.value; dibujar(); });
    enlazarChipsCategoria('catalogoChips', busquedaCat, dibujar);
  }
  if(page==='a-inventario'){
    const search = document.getElementById('invSearch');
    document.getElementById('swFotos').addEventListener('change', e=>{ verFotos = e.target.checked; guardarVerFotos(verFotos); dibujarInventario(); });
    centrarTabActiva();
    search.addEventListener('input', ()=>{ busquedaInv.q = search.value; dibujarInventario(); });
    enlazarChipsCategoria('invChips', busquedaInv, dibujarInventario);
    document.getElementById('btnArchivar').addEventListener('click', accionArchivarVendidos);
    document.getElementById('btnImportarCSV').addEventListener('click', modalImportarCSV);
    document.getElementById('btnInvMas').addEventListener('click', ()=>hojaAcciones('Más acciones', '', [
      { icono: icon('trash'), texto: 'Archivar vendidos<br><small class="text-faint">Borra las fotos de lo vendido hace '+DB.state.configuracion.dias_archivo_productos_vendidos+' días o más</small>', hacer: accionArchivarVendidos },
      { icono: icon('upload'), texto: 'Importar CSV', hacer: modalImportarCSV }
    ]));
  }
  if(page==='a-cajas') document.getElementById('btnNuevaCaja').addEventListener('click', modalNuevaCaja);
  if(page==='a-categorias') document.getElementById('btnNuevaCategoria').addEventListener('click', ()=>modalCategoria(null));
  if(page==='a-clientes' || page==='v-clientes') document.getElementById('btnNuevoCliente').addEventListener('click', ()=>modalCliente(null));
  if(page==='a-clientes' || page==='v-clientes') enlazarBusquedaClientes();
  if(page==='a-extras') enlazarExtras();
  if(page==='a-externas') document.getElementById('btnNuevaExterna').addEventListener('click', ()=>modalExterna(null));
  if(page==='a-cajas-ext') document.getElementById('btnNuevaCajaExt').addEventListener('click', ()=>modalCajaNueva());
  if(page==='a-bodega') document.getElementById('btnNuevaUbicacion').addEventListener('click', ()=>modalUbicacionForm(null));
  if(page==='a-gastos') document.getElementById('btnNuevoGasto').addEventListener('click', ()=>modalGasto(null));
  if(page==='a-config'){
    document.getElementById('btnBackupCompleto').addEventListener('click', exportBackupCompleto);
    document.getElementById('formConfig').addEventListener('submit', async e=>{
      e.preventDefault();
      const res = await DB.guardarConfiguracion({
        moneda_simbolo: document.getElementById('cfMoneda').value || 'Q',
        dias_archivo_productos_vendidos: (v=>Number.isNaN(v)||v<0?3:v)(parseInt(document.getElementById('cfDias').value,10)),
        dias_eliminacion_productos_archivados: Number(document.getElementById('cfDiasEliminar').value)||30,
        comision_default_porcentaje: Number(document.getElementById('cfComision').value)||10,
        permitir_auto_liberacion: document.getElementById('cfAutoLib').checked,
        tiempo_auto_liberacion_horas: Number(document.getElementById('cfHoras').value)||24,
        dias_eliminar_notificaciones: Number(document.getElementById('cfDiasNotif').value)||30,
        dias_deuda_vencida: Number(document.getElementById('cfDiasDeuda').value)||14
      });
      if(res.ok){
        const n = DB.state.configuracion.dias_archivo_productos_vendidos;
        toast('Guardado. Lo vendido se archiva '+(n===0?'apenas se vende':n===1?'al día siguiente':'a los '+n+' días'),'success');
      } else toast('No se pudo guardar: '+res.error,'danger');
    });
  }
  if(page==='a-reportes'){
    document.getElementById('btnExportExcel').addEventListener('click', exportReporteExcel);
    document.getElementById('btnExportPDF').addEventListener('click', exportReportePDF);
    document.querySelectorAll('#reporteRangoTabs .pill-tab').forEach(btn=>btn.addEventListener('click', ()=>{
      reporteRangoDias = Number(btn.dataset.dias);
      navigate('a-reportes');
    }));
  }
}

// Todas las exportaciones del panel salen en Excel (.xlsx), no CSV.
function exportReporteExcel(){
  const rows = DB.state.venta_historial.map(v=>{
    const u = DB.state.usuarios.find(x=>x.id===v.vendedor_id);
    return {
      'Producto': v.producto_nombre, 'Código': v.producto_codigo, 'Categoría': v.categoria||'',
      'Vendedor': u?u.nombre:'', 'Fecha': fmtDateShort(v.fecha_venta),
      'Costo': v.costo, 'Precio': v.precio_venta, 'Gastos': v.gastos_aplicados,
      'Ganancia': v.ganancia_neta, 'Comisión': v.comision_monto, 'Estado': v.estado_venta
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Ventas');
  XLSX.writeFile(wb, 'reporte_ventas.xlsx');
}

// PDF: usa el diálogo de impresión nativo del navegador ("Guardar como PDF")
// sobre un contenido armado aparte — así el PDF muestra SOLO los datos del
// reporte (sin sidebar, botones ni el resto del panel), con mejor calidad
// que capturar la pantalla como imagen.
function exportReportePDF(){
  // iOS: la app instalada desde el ícono corre en modo "standalone", y ahí
  // Safari/WebKit no tiene diálogo de impresión — es una limitación del
  // sistema, no se puede activar por JS. Se abre la misma página en Safari
  // (fuera del modo standalone), donde sí existe, y ahí se imprime sola.
  if(window.navigator.standalone === true){
    window.open(location.pathname + '?autoprint=reporte&dias=' + reporteRangoDias, '_blank');
    return;
  }
  const r = datosReporte(reporteRangoDias);
  const fecha = new Date().toLocaleDateString('es-GT', { day:'2-digit', month:'long', year:'numeric' });
  const area = document.getElementById('reportePrintArea');
  area.innerHTML = `
    <div class="print-header">
      <h1>La Cabaña — Reporte de Ventas</h1>
      <div class="print-sub">Generado el ${fecha} · Tendencia de los últimos ${reporteRangoDias} días</div>
    </div>
    <div class="print-kpis">
      <div><span>Ingresos Totales</span><strong>${money(r.totalIngresos)}</strong></div>
      <div><span>Costos Totales</span><strong>${money(r.totalCostos)}</strong></div>
      <div><span>Gastos Aplicados</span><strong>${money(r.totalGastos)}</strong></div>
      <div><span>Ganancia Neta</span><strong>${money(r.totalGanancia)}</strong></div>
      <div><span>Comisiones Totales</span><strong>${money(r.totalComisiones)}</strong></div>
    </div>
    <h2>Ganancia neta — últimos ${reporteRangoDias} días</h2>
    ${svgLineaTendencia(r.porDia, r.etiquetasDias)}
    <h2>Ventas por vendedora</h2>
    <table class="print-table"><thead><tr><th>Vendedora</th><th>Ventas</th><th>Monto</th><th>Comisión</th></tr></thead><tbody>
      ${r.vendEntries.length ? r.vendEntries.map(v=>`<tr><td>${v.nombre}</td><td>${v.count}</td><td>${money(v.monto)}</td><td>${money(v.comision)}</td></tr>`).join('') : `<tr><td colspan="4">Sin datos</td></tr>`}
    </tbody></table>
    <h2>Ganancia por categoría</h2>
    <table class="print-table"><thead><tr><th>Clasificación</th><th>Ganancia</th></tr></thead><tbody>
      ${r.catEntries.length ? r.catEntries.map(([c,v])=>`<tr><td>${c}</td><td>${money(v)}</td></tr>`).join('') : `<tr><td colspan="2">Sin datos</td></tr>`}
    </tbody></table>`;
  setTimeout(()=>window.print(), 50);
}

// Backup completo del sistema en un solo Excel, una hoja por tabla — para
// tener una copia fuera de Supabase por si acaso (no reemplaza los backups
// automáticos de Supabase, es un respaldo adicional a mano cuando quieras).
function exportBackupCompleto(){
  const wb = XLSX.utils.book_new();
  const addSheet = (nombre, rows) => {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ '(sin datos)':'' }]);
    XLSX.utils.book_append_sheet(wb, ws, nombre.slice(0,31));
  };
  addSheet('Productos', DB.state.productos.map(p=>({
    'Código':p.codigo, 'Nombre':p.nombre, 'Categoría':p.categoria||'', 'Etiquetas':(p.etiquetas||[]).join(', '),
    'Costo':p.costo, 'Precio':p.precio_venta, '% Comisión':p.porcentaje_ganancia, 'Estado':p.estado,
    'Archivado':p.archivado?'Sí':'No', 'Creado':fmtDateShort(p.created_at)
  })));
  addSheet('Ventas', DB.state.venta_historial.map(v=>{
    const u = DB.state.usuarios.find(x=>x.id===v.vendedor_id);
    return { 'Producto':v.producto_nombre, 'Código':v.producto_codigo, 'Categoría':v.categoria||'', 'Vendedor':u?u.nombre:'',
      'Fecha':fmtDateShort(v.fecha_venta), 'Costo':v.costo, 'Precio':v.precio_venta, 'Gastos':v.gastos_aplicados,
      'Ganancia':v.ganancia_neta, 'Comisión':v.comision_monto, 'Estado comisión':v.comision_estado, 'Estado':v.estado_venta };
  }));
  addSheet('Comisiones Pagadas', DB.state.pagos_comision.map(p=>{
    const u = DB.state.usuarios.find(x=>x.id===p.vendedor_id);
    return { 'Vendedora':u?u.nombre:'', 'Monto':p.monto_total, 'Fecha':fmtDateShort(p.fecha_pago), 'Notas':p.notas||'' };
  }));
  addSheet('Cajas', DB.state.cajas.map(c=>({ 'Nombre':c.nombre, 'Costo Pagado':c.costo_total_pagado, 'Estado':c.estado, 'Apertura':fmtDateShort(c.fecha_apertura), 'Cierre':c.fecha_cierre?fmtDateShort(c.fecha_cierre):'' })));
  addSheet('Clasificaciones', DB.state.categorias.map(c=>({ 'Nombre':c.nombre, 'Productos':DB.contarProductosPorCategoria(c.nombre) })));
  addSheet('Productos extras', (DB.state.extras||[]).map(e=>({ 'Código':e.codigo, 'Nombre':e.nombre, 'Clasificación':e.categoria||'', 'Precio normal':e.precio_venta, 'Precio externas':e.precio_externa, 'Estado':e.estado==='en_caja'?'En caja':'Disponible' })));
  addSheet('Cajas de entrega', (DB.state.cajas_ext||[]).map(c=>{ const x = DB.state.externas.find(k=>k.id===c.externa_id), r = DB.resumenCaja(c.id); return { 'Código':c.codigo, 'Vendedora':x?x.nombre:'', 'Tipo':x?TIPOS_EXTERNA[x.tipo]:'', 'Fecha':fechaCorta(c.creada_en), 'Estado':c.estado==='abierta'?'Abierta':'Cerrada', 'Vendió':r.vendido, 'Pagó':r.pagado, 'Debe':Math.max(r.saldo,0) }; }));
  addSheet('Bodega', (DB.state.ubicaciones||[]).map(u=>({ 'Lugar':u.nombre, 'Descripción':u.descripcion||'', 'Productos':productosEnUbicacion(u.id).prods.length + productosEnUbicacion(u.id).extras.length })));
  addSheet('Gastos', DB.state.gastos.map(g=>({ 'Nombre':g.nombre, 'Monto':g.monto_default, 'Tipo':g.tipo, 'Activo':g.activo?'Sí':'No' })));
  addSheet('Devoluciones', DB.state.devoluciones.map(d=>{
    const v = DB.state.venta_historial.find(x=>x.id===d.venta_historial_id);
    return { 'Producto':v?v.producto_nombre:'', 'Razón':d.razon, 'Estado':d.estado, 'Fecha':fmtDateShort(d.fecha_solicitud) };
  }));
  addSheet('Usuarios', DB.state.usuarios.map(u=>({ 'Nombre':u.nombre, 'Email':u.email||'', 'Rol':DB.rolLabel(u), '% Comisión':u.porcentaje_comision_default||'', 'Activo':u.activo?'Sí':'No' })));
  addSheet('Bitácora', DB.state.bitacora.map(b=>{
    const u = DB.state.usuarios.find(x=>x.id===b.usuario_id);
    return { 'Fecha':fmtDate(b.created_at), 'Usuario':u?u.nombre:'Sistema', 'Acción':b.tipo_cambio, 'Tabla':b.tabla_afectada, 'Descripción':b.descripcion||'' };
  }));
  addSheet('Configuración', Object.entries(DB.state.configuracion).map(([k,v])=>({ 'Clave':k, 'Valor':String(v) })));
  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, 'backup_la_cabana_'+fecha+'.xlsx');
  DB.guardarConfiguracion({ ultimo_backup: new Date().toISOString() }); // si falta la migración 16, simplemente no se anota
}

document.getElementById('mainContent').addEventListener('click', e=>{
  const btn = e.target.closest('[data-action]'); if(btn) ejecutarAccion(btn);

// Hoja inferior "···" de un producto: lista las mismas acciones de su fila de
// íconos, pero con nombre y a tamaño de dedo.
function hojaAcciones(titulo, subtitulo, filas){
  openModal(`<div class="modal-head"><div><div class="modal-title">${titulo}</div>${subtitulo?`<div class="text-muted" style="font-size:12.5px;">${subtitulo}</div>`:''}</div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body" style="padding-top:0;">${filas.map((f,i)=> f.href
      ? `<a class="mas-item${f.peligro?' peligro':''}" href="${f.href}" target="_blank" rel="noopener">${f.icono}<span>${f.texto}</span>${icon('chevron')}</a>`
      : `<button type="button" class="mas-item${f.peligro?' peligro':''}" data-fila="${i}">${f.icono}<span>${f.texto}</span>${icon('chevron')}</button>`).join('')}
    </div>`, 'sheet');
  document.querySelectorAll('#modalOverlay [data-fila]').forEach(b=>b.addEventListener('click', ()=>{
    const f = filas[Number(b.dataset.fila)]; closeModal(); f.hacer();
  }));
}
async function ejecutarAccion(btn){
  const action = btn.dataset.action, id = btn.dataset.id;
  const p = () => DB.state.productos.find(x=>x.id===id);
  if(action==='apartar'){ const r=await DB.apartarProducto(id); if(r.ok) toast('Producto apartado','success'); else toast(r.error==='PRODUCTO_NO_DISPONIBLE'?'Ya no está disponible':'No se pudo apartar: '+r.error,'danger'); await refresh(); }
  else if(action==='liberar'){ const r=await DB.liberarProducto(id); if(r.ok) toast('Reserva liberada','success'); else toast('No se pudo liberar: '+r.error,'danger'); await refresh(); }
  else if(action==='vender'){ const prod=p(); if(prod) modalVender(prod); }
  else if(action==='ver'){ const prod=p(); if(prod) modalVerFicha(prod); }
  else if(action==='editar'){ const prod=p(); if(prod) modalEditarProducto(prod); }
  else if(action==='duplicar'){ const r=await DB.duplicarProducto(id); if(r.ok){ toast('Producto duplicado — edítalo para ajustarlo','success'); await refresh(); modalEditarProducto(DB.state.productos.find(x=>x.id===r.data.id)); } else toast('No se pudo duplicar: '+r.error,'danger'); }
  else if(action==='eliminar'){ if(confirm('¿Eliminar este producto?')){ const r=await DB.eliminarProducto(id); if(r.ok){ toast('Producto eliminado','success'); await refresh(); } else toast('No se pudo eliminar: '+r.error,'danger'); } }
  else if(action==='reingresar'){ const r=await DB.reingresarProducto(id); if(r.ok){ toast('Producto reingresado a inventario','success'); await refresh(); } }
  else if(action==='qr'){ const prod=p(); if(prod) modalQR(prod); }
  else if(action==='estado-nuevo'){ const prod=p(); if(prod) modalEstadoWhatsApp(prod, 'nuevo'); }
  else if(action==='estado-vendido'){ const prod=p(); if(prod) modalEstadoWhatsApp(prod, 'vendido'); }
  else if(action==='toggle-entrega'){ const v=DB.state.venta_historial.find(x=>x.id===id); if(v){ const nuevo = v.entregado===false; const r=await DB.marcarEntregado(id, nuevo); if(r.ok){ toast(nuevo?'Marcado como entregado':'Marcado como pendiente de entrega','success'); await refresh(); } else toast('No se pudo: '+r.error,'danger'); } }
  else if(action==='cerrar-caja'){ if(confirm('¿Cerrar esta caja?')){ const r=await DB.cerrarCaja(id); if(r.ok){ toast('Caja cerrada','success'); await refresh(); } else toast('No se pudo cerrar: '+r.error,'danger'); } }
  else if(action==='editar-categoria'){ modalCategoria(DB.state.categorias.find(c=>c.id===id)); }
  else if(action==='eliminar-categoria'){ if(confirm('¿Eliminar esta categoría? Los productos que la usan conservan el nombre.')){ const r=await DB.eliminarCategoria(id); if(r.ok){ toast('Categoría eliminada','success'); await refresh(); } else toast('No se pudo eliminar: '+r.error,'danger'); } }
  else if(action==='editar-gasto'){ modalGasto(DB.state.gastos.find(g=>g.id===id)); }
  else if(action==='eliminar-gasto'){ if(confirm('¿Eliminar este gasto?')){ const r=await DB.eliminarGasto(id); if(r.ok){ toast('Gasto eliminado','success'); await refresh(); } else toast('No se pudo eliminar: '+r.error,'danger'); } }
  else if(action==='editar-usuario'){ modalUsuario(DB.state.usuarios.find(u=>u.id===id)); }
  else if(action==='reset-password'){ const u = DB.state.usuarios.find(x=>x.id===id); if(u) modalCambiarPassword(u); }
  else if(action==='eliminar-usuario'){
    const u = DB.state.usuarios.find(x=>x.id===id);
    if(confirm('¿Eliminar a '+u.nombre+'? No podrá iniciar sesión ni se le podrán asignar productos nuevos, pero sus ventas y comisiones ya generadas se conservan intactas en Reportes.')){
      const r = await DB.editarUsuario(id, { activo:false });
      if(r.ok){ toast(u.nombre+' fue eliminada del panel (su historial se conserva)','success'); await refresh(); }
      else toast('No se pudo desactivar: '+r.error,'danger');
    }
  }
  else if(action==='reactivar-usuario'){
    const u = DB.state.usuarios.find(x=>x.id===id);
    const r = await DB.editarUsuario(id, { activo:true });
    if(r.ok){ toast(u.nombre+' fue reactivada','success'); await refresh(); }
    else toast('No se pudo reactivar: '+r.error,'danger');
  }
  else if(action==='solicitar-devolucion'){ modalDevolucion(id, false); }
  else if(action==='registrar-devolucion-admin'){ modalDevolucion(id, true); }
  else if(action==='pagar-comision'){ modalPagarComision(id); }
  else if(action==='aprobar-dev'){ const r=await DB.resolverDevolucion(id,true); if(r.ok){ toast('Devolución aprobada','success'); await refresh(); } else toast('No se pudo: '+r.error,'danger'); }
  else if(action==='rechazar-dev'){ const r=await DB.resolverDevolucion(id,false); if(r.ok){ toast('Devolución rechazada'); await refresh(); } else toast('No se pudo: '+r.error,'danger'); }
  else if(action==='marcar-pago-cliente'){ modalAbonar(id); }
  else if(action==='editar-cliente'){ modalCliente(DB.state.clientes.find(c=>c.id===id)); }
  else if(action==='eliminar-cliente'){ if(confirm('¿Eliminar este cliente? Su historial de compras se conserva, solo deja de aparecer en el catálogo.')){ const r=await DB.eliminarCliente(id); if(r.ok){ toast('Cliente eliminado','success'); await refresh(); } else toast('No se pudo eliminar: '+r.error,'danger'); } }
  else if(action==='ver-historial-cliente'){ modalHistorialCliente(DB.state.clientes.find(c=>c.id===id)); }
  else if(action==='toggle-seccion'){ const key=btn.dataset.key; inventarioSeccionAbierta = (inventarioSeccionAbierta===key) ? null : key; navigate(currentPage); }
  else if(action==='inv-estado'){ inventarioSeccionAbierta = btn.dataset.key; dibujarInventario(); }
  else if(action==='limpiar-busqueda-inv'){ busquedaInv = { q:'', cat:'' }; navigate(currentPage); }
  else if(action==='limpiar-busqueda-cat'){ busquedaCat = { q:'', cat:'' }; navigate(currentPage); }
  else if(action==='extras-estado'){ busquedaExtras.estado = btn.dataset.key; dibujarExtras(); }
  else if(action==='limpiar-busqueda-extras'){ busquedaExtras.q = ''; navigate(currentPage); }
  else if(action==='mas-extra'){
    const e = DB.state.extras.find(x=>x.id===id); if(!e) return;
    if(e.estado === 'en_caja'){ const { caja } = extraDeCaja(e); if(caja) modalCajaExt(caja); return; }
    hojaAcciones(escHtml(e.nombre), escHtml(e.codigo), [
      { icono: icon('edit'), texto: 'Editar', hacer: ()=>modalExtra(e) },
      { icono: icon('box'), texto: 'Pasar al inventario', hacer: ()=>modalPasarInventario(e) },
      { icono: icon('trash'), texto: 'Eliminar', peligro:true, hacer: async ()=>{
        if(!confirm('¿Eliminar este producto extra?')) return;
        const r = await DB.eliminarExtra(e.id);
        if(r.ok){ toast('Eliminado','success'); await refresh(); } else toast(mensajeErrorExtras(r.error),'danger');
      } }
    ]);
  }
  else if(action==='externas-tipo'){ filtroExternas.tipo = btn.dataset.key; dibujarExternas(); }
  else if(action==='editar-externa'){ const x = DB.state.externas.find(k=>k.id===id); if(x) modalExterna(x); }
  else if(action==='mas-externa'){
    const x = DB.state.externas.find(k=>k.id===id); if(!x) return;
    hojaAcciones(escHtml(x.nombre), TIPOS_EXTERNA[x.tipo], [
      { icono: icon('edit'), texto: 'Editar', hacer: ()=>modalExterna(x) },
      { icono: icon('trash'), texto: 'Quitar vendedora', peligro:true, hacer: async ()=>{
        if(!confirm('¿Quitar a ' + x.nombre + '?')) return;
        const r = await DB.quitarExterna(x.id);
        if(r.ok){ toast('Listo','success'); await refresh(); } else toast(r.error==='TIENE_CAJAS_ABIERTAS' ? 'Tiene cajas abiertas: ciérralas primero' : mensajeErrorExtras(r.error),'danger');
      } }
    ]);
  }
  else if(action==='caja-para-externa'){ modalCajaNueva(id); }
  else if(action==='abrir-externa'){
    const x = DB.state.externas.find(k=>k.id===id); if(!x) return;
    const cs = DB.state.cajas_ext.filter(c=>c.externa_id===id && c.estado==='abierta');
    if(cs.length === 1) modalCajaExt(cs[0]);
    else if(cs.length > 1) hojaAcciones(escHtml(x.nombre), 'Cajas abiertas', cs.map(c=>({ icono: icon('crate'), texto: escHtml(c.codigo) + ' · ' + fechaCorta(c.creada_en) + (DB.resumenCaja(c.id).saldo>0 ? '<br><small class="text-faint">Debe ' + money(DB.resumenCaja(c.id).saldo) + '</small>' : ''), hacer: ()=>modalCajaExt(c) })));
    else modalCajaNueva(id);
  }
  else if(action==='cajaext-estado'){ filtroCajasExt.estado = btn.dataset.key; dibujarCajasExt(); }
  else if(action==='cajaext-tipo'){ filtroCajasExt.tipo = btn.dataset.key; dibujarCajasExt(); }
  else if(action==='ver-caja-ext'){ const c = DB.state.cajas_ext.find(k=>k.id===id); if(c) modalCajaExt(c); }
  else if(action==='ver-ubicacion'){ const u = DB.ubicacionDe(id); if(u) modalUbicacion(u); }
  else if(action==='mas-producto'){
    const prod = p(); const card = btn.closest('.product-card, .product-row'); if(!prod || !card) return;
    const filas = [...card.querySelectorAll('.icon-actions-row [data-action]')].map(b=>({
      icono: b.innerHTML.includes('<svg') ? b.innerHTML.match(/<svg[\s\S]*?<\/svg>/)[0] : icon('chevron'),
      texto: (b.dataset.tip||'Acción').replace(/click para/i,'toca para'),
      peligro: b.classList.contains('delete'),
      hacer: ()=>ejecutarAccion(b)
    }));
    hojaAcciones(escHtml(prod.nombre), escHtml(prod.codigo)+' · '+money(prod.precio_venta), filas);
  }
  else if(action==='mas-cliente'){
    const c = DB.state.clientes.find(x=>x.id===id); if(!c) return;
    const r = DB.resumenCliente(c.id);
    const filas = [
      { icono: icon('file'), texto: 'Ver historial y deudas', hacer: ()=>modalHistorialCliente(c) },
      { icono: icon('edit'), texto: 'Editar cliente', hacer: ()=>modalCliente(c) }
    ];
    if(r.deuda>0 && telefonoInternacional(c.telefono)) filas.push({ icono: icon('receipt'), texto: 'Enviar estado de cuenta por WhatsApp', href: hrefEstadoCuentaWhatsApp(c) });
    if(DB.isAdmin()) filas.push({ icono: icon('trash'), texto: 'Eliminar cliente', peligro:true, hacer: ()=>ejecutarAccion({ dataset:{ action:'eliminar-cliente', id:c.id } }) });
    hojaAcciones(escHtml(c.nombre), escHtml(c.telefono||'Sin teléfono'), filas);
  }
}

// Cuenta lo que necesita revisión del admin: devoluciones pendientes + reservas
// por vencer pronto (≤6h) + productos archivados que se eliminarán pronto (≤5 días).
function contarPendientes(){
  if(!DB.state || !DB.isAdmin()) return 0;
  const devs = DB.state.devoluciones.filter(d=>d.estado==='pendiente').length;
  const deudas = DB.ventasPendientesDeCobro().length;
  const entregasPend = DB.state.venta_historial.filter(v=>v.entregado===false && v.estado_venta==='vendido').length;
  const reservasUrgentes = DB.state.productos.filter(p=>{ const h=horasParaLiberar(p); return h!==null && h<=6; }).length;
  const archivadosUrgentes = DB.state.productos.filter(p=>{ const d=DB.diasParaEliminar(p); return d!==null && d<=5; }).length;
  return devs + deudas + entregasPend + reservasUrgentes + archivadosUrgentes;
}
function refreshBadges(){
  const cur = DB.currentUser(); if(!cur) return;
  const sinLeer = DB.state.notificaciones.filter(n=>n.usuario_id===cur.id && !n.leida);
  document.getElementById('bellDot').hidden = sinLeer.length===0;
  const navBtn = document.querySelector('.nav-item[data-page="a-pendientes"]');
  if(navBtn){
    const n = contarPendientes();
    let badge = navBtn.querySelector('.nav-badge');
    if(n>0){
      if(!badge){ badge = document.createElement('span'); badge.className='nav-badge'; navBtn.appendChild(badge); }
      badge.textContent = n;
    } else if(badge) badge.remove();
  }
}

async function renderPublicPage(codigo){
  document.getElementById('loginScreen').hidden = true;
  document.getElementById('appShell').hidden = true;
  const root = document.getElementById('publicPage');
  root.hidden = false;
  root.innerHTML = `<div class="text-center text-faint" style="padding:60px 0;">Cargando…</div>`;
  const { data:p } = await sb.from('vista_producto_publico').select('*').eq('codigo', codigo).maybeSingle();
  sb.from('escaneos_qr').insert({ producto_codigo: codigo, dispositivo: /Mobi/i.test(navigator.userAgent)?'mobile':'desktop' });
  if(!p){
    root.innerHTML = `<div class="public-card"><div class="public-body text-center">
      <h2>Producto no disponible</h2><p class="text-muted mt-8">Este producto ya no está en el catálogo (fue vendido y archivado, o el código no existe).</p>
    </div></div>`;
    return;
  }
  const fotos = p.fotos || [];
  const info = estadoInfo(p.estado);
  // El nombre/teléfono de contacto vienen del link mismo (quien lo compartió
  // los agregó desde "Mi cuenta") — la ficha pública nunca consulta un
  // directorio de teléfonos, solo lee lo que ya trae esta URL específica.
  const params = new URLSearchParams(location.search);
  const vendedorNombre = params.get('v');
  const vendedorTel = params.get('tel');
  const negocio = document.querySelector('.login-logo .name')?.textContent || 'La Cabaña';
  document.title = p.nombre + ' · ' + negocio;
  const resto = (vendedorNombre?'&v='+encodeURIComponent(vendedorNombre):'') + (vendedorTel?'&tel='+encodeURIComponent(vendedorTel):'');
  root.innerHTML = `<div class="sf-ficha-top"><img src="icon-192.png" alt="" onerror="this.style.display='none'"><b>${escHtml(negocio)}</b><a href="${location.pathname}?catalogo=1${resto}">Ver todo el catálogo</a></div>
  <div class="public-card">
    ${fotos.length?`<div class="public-gallery">${fotos.map((url,i)=>`<img src="${url}" class="ficha-foto" data-i="${i}" alt="${escHtml(p.nombre)}">`).join('')}</div>`:''}
    <div class="public-body">
      ${p.categoria?`<span class="sf-d-cat">${escHtml(p.categoria)}</span>`:''}
      <div class="flex-between" style="align-items:flex-start;gap:10px;"><div class="sf-d-nombre" style="margin-top:10px;">${escHtml(p.nombre)}</div>${p.estado!=='en_inventario'?`<span class="badge ${info.cls}" style="margin-top:12px;">${info.label}</span>`:''}</div>
      <div class="sf-d-precio">Q ${Number(p.precio_venta).toFixed(2)}</div>
      ${p.descripcion?`<div class="sf-d-desc">${escHtml(p.descripcion)}</div>`:''}
      ${renderVideoEmbed(p.url_video)}
      ${vendedorTel ? `<a class="sf-cta" href="https://wa.me/${vendedorTel}?text=${encodeURIComponent('Hola'+(vendedorNombre?' '+vendedorNombre:'')+', me interesa este producto: '+p.nombre)}" target="_blank" rel="noopener">${icon('whatsapp')} Me interesa por WhatsApp</a>` : ''}
    </div>
  </div>`;
  document.querySelectorAll('.ficha-foto').forEach(img=>img.addEventListener('click', ()=>openLightbox(fotos, Number(img.dataset.i))));
}

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ showLogin(); return; }
  DB.authUserId = session.user.id;
  await DB.fetchAll();
  const cur = DB.currentUser();
  if(!cur || !cur.activo){ await sb.auth.signOut(); DB.authUserId = null; showLogin(); return; }
  if(DB.isAdmin(cur)){
    // OJO: fn_avisar_deudas_vencidas() NO se llama aquí a propósito — crea una
    // notificación cada vez que se invoca (sin control de "ya avisé hoy"), así
    // que llamarla en cada login/refresh spamearía notificaciones. Solo corre
    // una vez al día vía el cron programado en la migración 09.
    await Promise.all([DB.liberarReservasVencidas(), DB.archivarVendidos(), DB.eliminarArchivadosVencidos(), DB.eliminarNotificacionesVencidas()]);
    await DB.fetchAll();
  }
  showApp(DB.currentUser());
  irDesdeAviso(new URLSearchParams(location.search).get('ir'));
}
function showLogin(){
  detenerRealtime();
  document.getElementById('loginScreen').hidden = false;
  document.getElementById('appShell').hidden = true;
  document.getElementById('loginError').hidden = true;
}
function showApp(user){
  document.getElementById('loginScreen').hidden = true;
  document.getElementById('appShell').hidden = false;
  applyUserTheme(user);
  document.getElementById('userAvatar').textContent = user.nombre.charAt(0).toUpperCase();
  document.getElementById('userName').textContent = user.nombre;
  document.getElementById('userRole').textContent = DB.rolLabel(user);
  buildSidebar();
  buildBottomNav();
  iniciarBotonAtras();
  refreshBadges();
  iniciarRealtime();
  sincronizarPush();
  // Si venimos del "abrir en Safari" que dispara exportReportePDF() cuando la
  // app instalada en iOS no puede imprimir (ver ahí el porqué): al cargar acá
  // (ya en Safari normal, con la sesión ya iniciada) vamos directo a Reportes
  // y disparamos la impresión sola.
  const params = new URLSearchParams(location.search);
  if(params.get('autoprint')==='reporte' && user.rol==='administrador'){
    reporteRangoDias = Number(params.get('dias')) || 14;
    history.replaceState(null, '', location.pathname);
    navigate('a-reportes');
    setTimeout(exportReportePDF, 300);
  } else {
    navigate(user.rol==='administrador' ? 'a-dashboard' : 'v-dashboard');
  }
}

document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Ingresando...';
  document.getElementById('loginError').hidden = true;
  const r = await DB.login(document.getElementById('loginEmail').value.trim(), document.getElementById('loginPassword').value);
  btn.disabled = false; btn.textContent = 'Ingresar';
  if(r.ok) showApp(r.data);
  else { const el=document.getElementById('loginError'); el.textContent=r.error; el.hidden=false; }
});
function setDropdownOpen(el, open){ el.classList.toggle('open', open); }
function setSidebarOpen(open){
  document.getElementById('sidebar').classList.toggle('open', open);
  document.getElementById('sidebarScrim').classList.toggle('open', open);
}
document.getElementById('menuToggle').addEventListener('click', ()=>setSidebarOpen(!document.getElementById('sidebar').classList.contains('open')));
document.getElementById('searchBtn').addEventListener('click', modalBuscar);
document.getElementById('ayudaBtn').addEventListener('click', modalAyuda);
document.getElementById('temaOscuroBtn').addEventListener('click', ()=>{
  const actual = document.documentElement.getAttribute('data-theme');
  aplicarTemaOscuro(actual !== 'dark');
});
document.getElementById('sidebarScrim').addEventListener('click', ()=>setSidebarOpen(false));
document.getElementById('notifBtn').addEventListener('click', e=>{
  e.stopPropagation();
  const dd = document.getElementById('notifDropdown');
  setDropdownOpen(document.getElementById('userDropdown'), false);
  const willOpen = !dd.classList.contains('open');
  if(willOpen) buildNotifDropdown();
  setDropdownOpen(dd, willOpen);
});
document.getElementById('userChip').addEventListener('click', e=>{
  e.stopPropagation();
  const dd = document.getElementById('userDropdown');
  setDropdownOpen(document.getElementById('notifDropdown'), false);
  const willOpen = !dd.classList.contains('open');
  if(willOpen) buildUserDropdown();
  setDropdownOpen(dd, willOpen);
});
document.addEventListener('click', ()=>{ setDropdownOpen(document.getElementById('notifDropdown'), false); setDropdownOpen(document.getElementById('userDropdown'), false); });

// Buscador rápido global: Cmd/Ctrl+K desde cualquier parte del panel.
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
    if(document.getElementById('appShell').hidden) return;
    e.preventDefault();
    if(document.getElementById('modalOverlay')) return; // ya hay un modal abierto
    modalBuscar();
  }
});

// Sincronización entre personas conectadas: cada 60s se refrescan los datos
// (y, si eres admin, se corren las tareas de mantenimiento) para reflejar
// apartados/ventas de otras. OJO: nunca repinta una página con un formulario
// que puedas estar llenando (perderías lo escrito) — solo actualiza badges.
const PAGINAS_CON_FORMULARIO = new Set(['a-nuevo','a-config']);
// ---------------------------------------------------------------------
// Actualización en vivo (Supabase Realtime). Cuando alguien aparta, vende,
// sube fotos, abona, etc., todas las pantallas abiertas se actualizan solas.
// El refresco de 60s de abajo queda como respaldo por si se corta la conexión
// (por ejemplo, el celular dormido). Nunca repinta mientras escribes en un
// campo ni en las páginas con formulario largo.
// ---------------------------------------------------------------------
let realtimeCanal = null, realtimeTimer = null, sincronizando = false;
function sincronizarRealtime(){
  clearTimeout(realtimeTimer);
  realtimeTimer = setTimeout(sincronizarAhora, 700);   // junta ráfagas de cambios
}
async function sincronizarAhora(){
  if(sincronizando || document.getElementById('appShell').hidden || !DB.state) return;
  sincronizando = true;
  try{
    await DB.fetchAll();
    refreshBadges();
    const enc = document.activeElement;
    const escribiendo = enc && /^(INPUT|TEXTAREA|SELECT)$/.test(enc.tagName) && document.getElementById('mainContent').contains(enc);
    if(currentPage && !PAGINAS_CON_FORMULARIO.has(currentPage) && !escribiendo){
      const y = window.scrollY;
      navigate(currentPage);
      window.scrollTo(0, y);
    }
  } finally { sincronizando = false; }
}
function iniciarRealtime(){
  if(realtimeCanal) return;
  realtimeCanal = sb.channel('panel-cambios');
  ['productos','fotos_producto','venta_historial','abonos','devoluciones','notificaciones'].forEach(t=>
    realtimeCanal.on('postgres_changes', { event:'*', schema:'public', table:t }, sincronizarRealtime));
  realtimeCanal.subscribe();
}
function detenerRealtime(){
  if(realtimeCanal){ sb.removeChannel(realtimeCanal); realtimeCanal = null; }
}
// Al volver a la app (celular que estuvo dormido), ponerse al día de inmediato.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && realtimeCanal) sincronizarRealtime(); });
setInterval(async ()=>{
  if(document.getElementById('appShell').hidden) return;
  if(DB.isAdmin()){
    await DB.liberarReservasVencidas();
    await DB.archivarVendidos();
    await DB.eliminarArchivadosVencidos();
    await DB.eliminarNotificacionesVencidas();
  }
  await DB.fetchAll();
  refreshBadges();
  if(currentPage && !PAGINAS_CON_FORMULARIO.has(currentPage)) navigate(currentPage);
}, 60000);
sb.auth.onAuthStateChange((event)=>{
  if(event==='SIGNED_OUT' && !document.getElementById('appShell').hidden){ showLogin(); }
});

// Entrada: ¿es una ficha pública (QR / link compartido) o el panel normal?
const params = new URLSearchParams(location.search);
if(params.get('p')){
  renderPublicPage(params.get('p'));
} else if(params.get('catalogo')){
  renderCatalogoPublico();
} else {
  boot();
}
</script>
