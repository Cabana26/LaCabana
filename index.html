// Horas que le quedan a una reserva antes de liberarse sola (según la
// configuración de auto-liberación). Null si no aplica o está deshabilitado.
function horasParaLiberar(p){
  if(!p || p.estado!=='en_reserva' || !p.reservado_en) return null;
  const cfg = DB.state && DB.state.configuracion;
  if(!cfg || cfg.permitir_auto_liberacion===false) return null;
  const horasLimite = Number(cfg.tiempo_auto_liberacion_horas)||24;
  const transcurridas = (Date.now() - new Date(p.reservado_en).getTime()) / 3600000;
  return Math.max(0, horasLimite - transcurridas);
}
function fmtHoras(h){
  if(h < 1) return Math.max(1,Math.round(h*60))+' min';
  return Math.round(h)+' h';
}
// Pinta un badge de cuenta regresiva para una reserva; null si no aplica.
function reservaCountdownBadge(p){
  const h = horasParaLiberar(p);
  if(h===null) return '';
  const urgente = h <= 1, medio = h <= 6;
  const cls = urgente ? 'badge-danger' : medio ? 'badge-warning' : 'badge-neutral';
  return `<span class="badge ${cls}" data-tip="Se libera sola si nadie vende">${icon('clock')} vence en ${fmtHoras(h)}</span>`;
}
// Lo que falta pagar de una venta (precio menos lo ya abonado) — nunca negativo.
function saldoPendiente(v){ return Math.max(0, v.precio_venta - (v.monto_pagado||0)); }
// Cuánto lleva pendiente una cuenta por cobrar, coloreado contra el umbral
// configurable de "deuda vencida" (mismo campo que revisa el aviso automático).
function deudaBadge(venta){
  const dias = Math.floor((Date.now() - new Date(venta.fecha_venta).getTime()) / 86400000);
  const umbral = Number(DB.state.configuracion.dias_deuda_vencida) || 14;
  const cls = dias >= umbral ? 'badge-danger' : dias >= umbral*0.5 ? 'badge-warning' : 'badge-neutral';
  return `<span class="badge ${cls}" data-tip="Días desde la venta sin que el cliente pague">${dias} día${dias===1?'':'s'}</span>`;
}
function parseVideoUrl(url){
  if(!url) return null;
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
  if(yt) return { plataforma:'youtube', embedUrl:'https://www.youtube.com/embed/'+yt[1], originalUrl:url };
  const tt = url.match(/tiktok\.com\/@[\w.-]+\/video\/(\d+)/);
  if(tt) return { plataforma:'tiktok', embedUrl:'https://www.tiktok.com/embed/v2/'+tt[1], originalUrl:url };
  return { plataforma:'desconocido', embedUrl:null, originalUrl:url };
}
function renderVideoEmbed(url){
  const info = parseVideoUrl(url);
  if(!info) return '';
  if(info.plataforma==='youtube' || info.plataforma==='tiktok'){
    const esTikTok = info.plataforma==='tiktok';
    return `<div class="video-embed${esTikTok?' tiktok':''}"><iframe src="${info.embedUrl}" loading="lazy" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
      <a href="${info.originalUrl}" target="_blank" rel="noopener" class="text-muted" style="font-size:12px;display:inline-block;margin:-8px 0 12px;">Abrir en ${esTikTok?'TikTok':'YouTube'} ↗</a>`;
  }
  return `<div class="text-muted" style="font-size:12px;margin-bottom:12px;"><a href="${info.originalUrl}" target="_blank" rel="noopener">Ver video de referencia ↗</a></div>`;
}
// Los links cortos de TikTok (vm.tiktok.com, tiktok.com/t/..., vt.tiktok.com)
// no traen el ID del video, así que no se pueden incrustar directo. Se
// resuelven UNA vez (al guardar el producto, no cada vez que alguien lo ve)
// usando el oEmbed público de TikTok, que sí acepta el link corto y devuelve
// el video real. Si algo falla (sin internet, TikTok caído), se guarda tal
// cual como vino y queda como "Ver video de referencia" en vez de romperse.
async function resolverVideoUrl(url){
  url = (url||'').trim();
  if(!url) return url;
  const esCorta = /vm\.tiktok\.com\/|tiktok\.com\/t\/|vt\.tiktok\.com\//i.test(url);
  if(!esCorta) return url;
  try{
    const r = await fetch('https://www.tiktok.com/oembed?url=' + encodeURIComponent(url));
    if(!r.ok) return url;
    const data = await r.json();
    if(data.author_unique_id && data.embed_product_id){
      return 'https://www.tiktok.com/@' + data.author_unique_id + '/video/' + data.embed_product_id;
    }
    return url;
  }catch(e){ return url; }
}

function darkenHex(hex, amount=0.16){
  const n = hex.replace('#','');
  const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
  const r = clamp(parseInt(n.substr(0,2),16)*(1-amount));
  const g = clamp(parseInt(n.substr(2,2),16)*(1-amount));
  const b = clamp(parseInt(n.substr(4,2),16)*(1-amount));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function idealTextOn(hex){
  const n = hex.replace('#','');
  const r=parseInt(n.substr(0,2),16), g=parseInt(n.substr(2,2),16), b=parseInt(n.substr(4,2),16);
  const lum = (0.299*r+0.587*g+0.114*b)/255;
  return lum > 0.6 ? '#2A1D15' : '#FFFDF9';
}
function applyUserTheme(user){
  const root = document.documentElement.style;
  const t = user && user.color_tema;
  if(t && t.base){
    root.setProperty('--color-accent', t.base);
    root.setProperty('--color-accent-dark', t.dark || darkenHex(t.base));
    root.setProperty('--sidebar-active-bg', t.base);
    root.setProperty('--sidebar-active-text', idealTextOn(t.base));
  } else {
    root.removeProperty('--color-accent');
    root.removeProperty('--color-accent-dark');
    root.removeProperty('--sidebar-active-bg');
    root.removeProperty('--sidebar-active-text');
  }
}

// Modo oscuro real: se recuerda por dispositivo (localStorage), no por
// cuenta — es una preferencia de pantalla, no de marca (eso ya lo cubre el
// color personalizado de arriba). Se aplica ANTES del login para que la
// pantalla de entrada también respete lo último elegido en este navegador.
function aplicarTemaOscuro(oscuro){
  document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light');
  try{ localStorage.setItem('lc_tema_oscuro', oscuro ? '1' : '0'); }catch(e){}
  const btn = document.getElementById('temaOscuroBtn');
  if(btn){ btn.innerHTML = icon(oscuro?'sun':'moon'); btn.dataset.tip = oscuro ? 'Modo claro' : 'Modo oscuro'; }
  // La barra de estado de Android se pinta con esto — si no sigue al tema
  // se ve una franja de color que no calza arriba de la pantalla.
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', oscuro ? '#241C17' : '#FFFDF9');
}
(function(){
  let guardado = null;
  try{ guardado = localStorage.getItem('lc_tema_oscuro'); }catch(e){}
  if(guardado === '1') aplicarTemaOscuro(true);
})();

function nivelZoomPanel(){
  if(zoomNivelActual===null){ try{ zoomNivelActual = Number(localStorage.getItem('lc_zoom_panel'))||0; }catch(e){ zoomNivelActual = 0; } }
  return zoomNivelActual;
}
function aplicarZoomPanel(nivel){
  zoomNivelActual = nivel;
  document.documentElement.classList.remove('zoom-1','zoom-2');
  if(nivel>0) document.documentElement.classList.add('zoom-'+nivel);
  try{ localStorage.setItem('lc_zoom_panel', String(nivel)); }catch(e){}
}

function marcarBarraInferior(page){
  const botones = [...document.querySelectorAll('#bottomNav button')];
  const enBarra = botones.some(b=>b.dataset.page===page);
  botones.forEach(b=>b.classList.toggle('active', b.dataset.page===page || (!enBarra && !!b.dataset.mas)));
}

  document.querySelectorAll('#modalOverlay [data-mas-act]').forEach(b=>b.addEventListener('click', async ()=>{
    const a = b.dataset.masAct;

  }));

// Botón Atrás del celular: cierra lo que esté abierto (ventana, menú, foto) o
// regresa a la pantalla anterior. En la pantalla de inicio pide presionar dos
// veces para salir, así no se cierra la app por accidente.
let atrasIniciado = false, salidaArmada = false;
function iniciarBotonAtras(){
  if(atrasIniciado) return; atrasIniciado = true;
  history.replaceState({ lc:'base' }, '');
  history.pushState({ lc:'guarda' }, '');
  window.addEventListener('popstate', ()=>{
    const lightbox = document.querySelector('.lightbox-overlay.open .lightbox-close');
    if(lightbox) lightbox.click();
    else if(document.getElementById('modalOverlay')) closeModal();
    else if(document.getElementById('sidebar').classList.contains('open')) setSidebarOpen(false);
    else if(pilaPaginas.length) navigate(pilaPaginas.pop(), { atras:true });
    else if(!salidaArmada){
      salidaArmada = true; toast('Presiona atrás otra vez para salir');
      setTimeout(()=>{ salidaArmada = false; }, 2500);
    } else { history.back(); return; }
    history.pushState({ lc:'guarda' }, '');
  });
}

const VAPID_PUBLIC_KEY = 'BLAdtc1ura8Lkl71urdrKK0YV8sJcA0poTSDw1sITXgefrqN2NX-UpDGZDbo0yVuLds3fr67V89a4G8-FXBYd90';
function pushSoportado(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && /^https?:$/.test(location.protocol); }
function esIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function esAppInstalada(){ return window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
// En iPhone los avisos solo existen si la app está agregada a la pantalla de inicio.
function pushDisponibleAqui(){ return pushSoportado() && !(esIOS() && !esAppInstalada()); }
function urlBase64ToUint8Array(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function registrarServiceWorker(){
  if(!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return null;
  try{ return await navigator.serviceWorker.register('sw.js'); }catch(e){ return null; }
}
async function suscripcionPushActual(){
  if(!pushSoportado()) return null;
  try{
    const reg = (await navigator.serviceWorker.getRegistration()) || (await registrarServiceWorker());
    return reg ? await reg.pushManager.getSubscription() : null;
  }catch(e){ return null; }
}
async function activarPush(){
  if(!pushDisponibleAqui()) return { ok:false, error:'NO_SOPORTADO' };
  const permiso = await Notification.requestPermission();
  if(permiso !== 'granted') return { ok:false, error: permiso==='denied' ? 'BLOQUEADO' : 'CERRADO' };
  const reg = await registrarServiceWorker(); if(!reg) return { ok:false, error:'SIN_SW' };
  await navigator.serviceWorker.ready;
  try{
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
    return await DB.guardarSuscripcionPush(sub);
  }catch(e){ return { ok:false, error: e.message || 'ERROR' }; }
}
async function desactivarPush(){
  const sub = await suscripcionPushActual();
  if(sub){ await DB.borrarSuscripcionPush(sub.endpoint); await sub.unsubscribe(); }
  return { ok:true };
}
// Al abrir el panel: si este teléfono ya tiene avisos, se liga a la persona que entró.
async function sincronizarPush(){
  if(!pushDisponibleAqui() || Notification.permission !== 'granted') return;
  const sub = await suscripcionPushActual();
  if(sub) await DB.guardarSuscripcionPush(sub);
}
// Al tocar un aviso se abre (o se cambia a) la pantalla que corresponde, solo si es de su rol.

  if(!pagina || !PAGES[pagina] || document.getElementById('appShell').hidden) return;
  const admin = DB.isAdmin();
  if((admin && !pagina.startsWith('a-')) || (!admin && !pagina.startsWith('v-'))) return;
  navigate(pagina);
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', e=>{ if(e.data && e.data.tipo==='ir') irDesdeAviso(e.data.ir); });
  window.addEventListener('load', ()=>{ registrarServiceWorker(); });
}

// "Qué hacer hoy": lo pendiente, con un toque para ir directo a resolverlo.
function panelQueHacer(){
  const admin = DB.isAdmin(), cur = DB.currentUser();
  const ventas = DB.state.venta_historial.filter(v=>v.estado_venta==='vendido' && (admin || v.vendedor_id===cur.id));
  const porCobrar = ventas.filter(v=>v.estado_pago==='pendiente');
  const porEntregar = ventas.filter(v=>v.entregado===false);
  const filas = [];
  if(porCobrar.length) filas.push({ n:porCobrar.length, txt:'por cobrar', sub:'Falta cobrar '+money(porCobrar.reduce((t,v)=>t+saldoPendiente(v),0)), ir: admin?"navigate('a-clientes')":"navigate('v-clientes')" });
  if(porEntregar.length) filas.push({ rojo:true, n:porEntregar.length, txt:'por entregar', sub:'Ya vendidos, falta entregarlos al cliente', ir: admin?"navigate('a-pendientes')":"navigate('v-ventas')" });
  if(admin){
    const devs = DB.state.devoluciones.filter(d=>d.estado==='pendiente').length;
    if(devs) filas.push({ n:devs, txt:'devolución por revisar', sub:'Una vendedora pidió devolver un producto', ir:"navigate('a-devoluciones')" });
    const res = DB.state.productos.filter(p=>{ const h=horasParaLiberar(p); return h!==null && h<=6; }).length;
    if(res) filas.push({ n:res, txt:'reserva por vencer', sub:'Se liberan solas en menos de 6 horas', ir:"irAInventario('en_reserva')" });
    const c = DB.state.configuracion;
    if(c.ultimo_backup !== undefined){
      const dias = c.ultimo_backup ? Math.floor((Date.now()-new Date(c.ultimo_backup).getTime())/86400000) : null;
      if(dias===null || dias>=30) filas.push({ n:'!', txt:'descarga tu respaldo', sub: dias===null ? 'Todavía no has descargado ninguno' : 'Hace '+dias+' días del último', ir:"navigate('a-config')" });
    }
  }
  if(admin){
    const conSaldo = DB.state.cajas_ext.filter(c=>c.estado==='abierta' && DB.resumenCaja(c.id).saldo > 0);
    if(conSaldo.length) filas.push({ n:conSaldo.length, txt:conSaldo.length===1?'caja con saldo':'cajas con saldo', sub:'Te deben '+money(conSaldo.reduce((t,c)=>t+DB.resumenCaja(c.id).saldo,0)), ir:"navigate('a-cajas-ext')" });
  }
  if(pushDisponibleAqui() && Notification.permission === 'default') filas.push({ n:icon('bell'), txt:'activa los avisos', sub:'Entérate de ventas y pagos aunque la app esté cerrada', ir:'modalPersonalizarColor()' });
  if(instalarEvt) filas.push({ n:'+', txt:'instala la app en tu celular', sub:'Se abre como cualquier app, sin buscar el link', ir:'instalarApp()' });
  return `<div class="panel">
    <div class="panel-title" style="margin-bottom:6px;">Qué hacer hoy</div>
    ${filas.length ? filas.map(f=>`<button type="button" class="qh-row" onclick="${f.ir}"><span class="qh-n${f.rojo?' rojo':''}">${f.n}</span><span class="qh-txt">${f.txt}<small>${f.sub}</small></span>${icon('chevron')}</button>`).join('')
      : `<div class="qh-row" style="cursor:default;"><span class="qh-n ok">${icon('check')}</span><span class="qh-txt">Todo al día<small>No hay nada pendiente por ahora</small></span></div>`}
  </div>`;
}

const pilaPaginas = [];
function navigate(page, opts){
  const cambia = currentPage && currentPage !== page;
  if(cambia && !(opts && opts.atras)){ pilaPaginas.push(currentPage); if(pilaPaginas.length > 30) pilaPaginas.shift(); }
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.page===page));
  marcarBarraInferior(page);
  const [title,sub] = PAGE_TITLES[page] || [page,''];
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageSub').textContent = sub;
  document.getElementById('mainContent').innerHTML = renderPage(page);
  bindPageEvents(page);
  if(cambia) window.scrollTo(0, 0);
}

// Área + línea suave para una tendencia en el tiempo (ganancia neta por día).
function svgLineaTendencia(puntos, etiquetas){
  const w = 700, h = 150, padX = 6, padY = 10;
  const max = Math.max(1, ...puntos);
  const min = Math.min(0, ...puntos);
  const rango = (max - min) || 1;
  const stepX = puntos.length>1 ? (w - padX*2) / (puntos.length-1) : 0;
  const coords = puntos.map((v,i)=>({ x: padX + i*stepX, y: h - padY - ((v-min)/rango)*(h-padY*2) }));
  const linePath = coords.map((c,i)=> (i===0?'M':'L') + c.x.toFixed(1) + ' ' + c.y.toFixed(1)).join(' ');
  const areaPath = coords.length ? `${linePath} L ${coords[coords.length-1].x.toFixed(1)} ${h-padY} L ${coords[0].x.toFixed(1)} ${h-padY} Z` : '';
  const puntosSvg = coords.map((c,i)=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" fill="var(--color-accent)">
    <title>${etiquetas[i]}: ${money(puntos[i])}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:150px;display:block;" preserveAspectRatio="none">
    <defs><linearGradient id="gradTendencia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--color-accent)" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="var(--color-accent)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#gradTendencia)" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${puntosSvg}
  </svg>
  <div class="bar-chart-labels">${etiquetas.map((e,i)=> i%Math.ceil(etiquetas.length/10||1)===0 ? `<span>${e}</span>` : '<span></span>').join('')}</div>`;
}

// Donut de proporción (≤6 categorías se ven bien; con más, sigue siendo legible
// gracias a la leyenda con montos — el detalle exacto además vive en la tabla de abajo).
function svgDonut(data){
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  const r = 52, cx = 62, cy = 62, grosor = 22;
  const circunferencia = 2*Math.PI*r;
  let acumulado = 0;
  const segmentos = data.map(d=>{
    const frac = d.value/total;
    const largo = Math.max(frac*circunferencia, frac>0?1:0);
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${grosor}"
      stroke-dasharray="${largo.toFixed(1)} ${(circunferencia-largo).toFixed(1)}" stroke-dashoffset="${(-acumulado).toFixed(1)}"
      transform="rotate(-90 ${cx} ${cy})"><title>${d.label}: ${money(d.value)} (${(frac*100).toFixed(0)}%)</title></circle>`;
    acumulado += largo;
    return el;
  }).join('');
  return `<svg viewBox="0 0 124 124" style="width:124px;height:124px;flex-shrink:0;">${segmentos}</svg>`;
}

// Barras horizontales para comparar/rankear (ventas por vendedora).
function horizontalBars(data){
  const max = Math.max(1, ...data.map(d=>d.value));
  return data.map(d=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <div style="width:88px;font-size:11.5px;color:var(--color-text-muted);flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${d.label}</div>
      <div style="flex:1;background:var(--color-surface-alt);border-radius:6px;overflow:hidden;height:18px;">
        <div style="width:${Math.max(3,(d.value/max)*100)}%;height:100%;background:var(--color-accent);border-radius:6px;transition:width 300ms var(--ease-out);" data-tip="${money(d.value)}"></div>
      </div>
      <div style="width:74px;font-size:11.5px;font-weight:700;flex-shrink:0;">${money(d.value)}</div>

}

// Búsqueda: sin importar mayúsculas ni acentos ("camara" encuentra "Cámara"),
// varias palabras a la vez ("bolsa negra" = las dos), y busca en nombre, código,
// descripción, categoría, etiquetas y precio.

function normalizar(t){ return String(t==null?'':t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function coincideProducto(p, q, cat){
  if(cat && p.categoria!==cat) return false;
  const tokens = normalizar(q).split(/\s+/).filter(Boolean);
  if(!tokens.length) return true;
  const ubi = DB.isAdmin() && p.ubicacion_id ? (DB.ubicacionDe(p.ubicacion_id) || {}).nombre : '';
  const pajar = normalizar([p.nombre, p.codigo, p.descripcion, p.categoria, ubi, (p.etiquetas||[]).join(' '), p.precio_venta].join(' '));
  return tokens.every(t=>pajar.includes(t));
}

// Casi todos los números de clientes son de Guatemala: si no trae ya un
// código de país (con "+" al inicio), se le antepone +502 automáticamente.
function telefonoInternacional(telefono){
  if(!telefono) return null;
  let limpio = telefono.replace(/[^\d+]/g, '');
  if(!limpio) return null;
  if(limpio.startsWith('+')) return limpio;
  if(limpio.startsWith('502') && limpio.length>8) return '+'+limpio;
  return '+502'+limpio;
}
// Mismo número para ambos: uno abre WhatsApp, el otro marca directo.
function botonesContacto(telefono){
  const tel = telefonoInternacional(telefono);

  return `<a href="https://wa.me/${tel.slice(1)}" target="_blank" rel="noopener" class="icon-btn confirm" data-tip="WhatsApp">${icon('whatsapp')}</a>
    <a href="tel:${tel}" class="icon-btn info" data-tip="Llamar">${icon('phone')}</a>`;
}

// filtrar nada acá (ver migracion_11_clientes_por_vendedora.sql).
// ---------------------------------------------------------------------
// Clientes: tarjetas en vez de tabla (se leen bien en el celular), con
// buscador (nombre o teléfono), filtros "Con deuda / Al día" y orden por deuda.
// ---------------------------------------------------------------------
function clientesFiltrados(){
  const { q, filtro, vend } = busquedaClientes;
  const tokens = normalizar(q).split(/\s+/).filter(Boolean);
  const qDig = q.replace(/\D/g,'');
  return DB.state.clientes.map(c=>({ c, r: DB.resumenCliente(c.id) }))
    .filter(({c,r})=>{
      if(vend && c.created_by!==vend) return false;
      if(filtro==='deuda' && !(r.deuda>0)) return false;
      if(filtro==='aldia' && r.deuda>0) return false;
      if(!tokens.length) return true;
      if(tokens.every(t=>normalizar(c.nombre+' '+(c.telefono||'')).includes(t))) return true;
      return qDig.length>=3 && (c.telefono||'').replace(/\D/g,'').includes(qDig);
    })
    .sort((a,b)=> b.r.deuda-a.r.deuda || a.c.nombre.localeCompare(b.c.nombre,'es'));
}

// Estados del inventario como pestañas (una lista a la vez, con contador),
// en vez de secciones gigantes desplegables.
function estadosInventario(){
  const cfg = DB.state.configuracion;
  const todos = DB.state.productos.filter(p=>!busquedaInv.cat || p.categoria===busquedaInv.cat);
  const lista = [
    { k:'en_inventario', t:'Disponibles', c:'var(--forest-600)', f:p=>p.estado==='en_inventario', vacio:'No hay productos disponibles' },
    { k:'en_reserva', t:'Reservados', c:'var(--amber-500)', f:p=>p.estado==='en_reserva',
      vacio:'No hay productos reservados' },
    { k:'vendido', t:'Vendidos', c:'var(--sage-600)', f:p=>p.estado==='vendido' && !p.archivado,
      nota:`Las fotos se borran solas a los ${cfg.dias_archivo_productos_vendidos} días.`, vacio:'No hay productos vendidos' },
    { k:'archivado', t:'Archivados', c:'var(--coffee-400)', f:p=>p.archivado, solo:true,
      vacio:'No hay archivados' },
    { k:'devuelto', t:'Por revisar', c:'var(--red-600)', f:p=>p.estado==='devuelto', solo:true,
      vacio:'No hay devoluciones por revisar' }
  ].map(e=>({ ...e, items: todos.filter(e.f) }));
  return lista.filter(e=>!e.solo || e.items.length);
}
function estadoInventarioActual(){
  const est = estadosInventario();
  return est.find(e=>e.k===inventarioSeccionAbierta) || est[0];
}
function invEstadosHtml(){
  if(busquedaInv.q.trim()) return '';
  const act = estadoInventarioActual();
  return `<div class="chips-scroll estado-tabs">${estadosInventario().map(e=>
    `<button type="button" class="estado-tab${e.k===act.k?' active':''}" data-action="inv-estado" data-key="${e.k}"><span class="dot" style="background:${e.c}"></span>${e.t}<span class="n">${e.items.length}</span></button>`).join('')}</div>`;
}
function inventarioContenido(){
  const { q, cat } = busquedaInv;
  if(q.trim()){
    const r = DB.state.productos.filter(p=>coincideProducto(p, q, cat));
    return `<div class="res-head"><span>${r.length} resultado${r.length===1?'':'s'} en todo el inventario</span><button type="button" class="btn btn-secondary btn-sm" data-action="limpiar-busqueda-inv">Limpiar</button></div>
      ${r.length ? productosHtml(r, 'admin') : `<div class="text-faint text-center" style="padding:30px;">No hay productos con esa búsqueda</div>`}`;
  }
  const e = estadoInventarioActual();
  return `${e.nota?`<div class="estado-nota">${e.nota}</div>`:''}
    ${e.items.length ? productosHtml(e.items, 'admin') : `<div class="text-faint text-center" style="padding:30px;">${e.vacio}</div>`}`;
}
// Si la pestaña activa queda fuera de la pantalla (barra deslizable), la centra.
function centrarTabActiva(){
  const cont = document.querySelector('#invEstados .estado-tabs'), act = cont && cont.querySelector('.estado-tab.active');
  if(act) cont.scrollLeft = act.offsetLeft - (cont.clientWidth - act.offsetWidth) / 2;
}
function dibujarInventario(){
  const t = document.getElementById('invEstados'), w = document.getElementById('kanbanWrap');
  if(t) t.innerHTML = invEstadosHtml();
  if(w) w.innerHTML = inventarioContenido();
  centrarTabActiva();
}

// Calcula todos los agregados de Reportes para una ventana de N días — la
// usan tanto el render de la página como los exportadores (Excel/PDF), así
// nunca se desincronizan.
function datosReporte(dias){
  const ventas = DB.state.venta_historial.filter(v=>v.estado_venta==='vendido');
  const totalIngresos = ventas.reduce((s,v)=>s+v.precio_venta,0);
  const totalCostos = ventas.reduce((s,v)=>s+v.costo,0);
  const totalGastos = ventas.reduce((s,v)=>s+v.gastos_aplicados,0);
  const totalGanancia = ventas.reduce((s,v)=>s+v.ganancia_neta,0);
  const totalComisiones = ventas.reduce((s,v)=>s+v.comision_monto,0);

  const porVendedor = {};
  ventas.forEach(v=>{ porVendedor[v.vendedor_id] = porVendedor[v.vendedor_id] || {count:0,monto:0,comision:0}; porVendedor[v.vendedor_id].count++; porVendedor[v.vendedor_id].monto+=v.precio_venta; porVendedor[v.vendedor_id].comision+=v.comision_monto; });
  const vendEntries = Object.entries(porVendedor).map(([id,d])=>({ id, nombre:(DB.state.usuarios.find(u=>u.id===id)||{}).nombre||'—', ...d })).sort((a,b)=>b.monto-a.monto);

  const porCategoria = {};
  ventas.forEach(v=>{ const c=v.categoria||'Sin clasificación'; porCategoria[c]=(porCategoria[c]||0)+v.ganancia_neta; });
  const catEntries = Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]);

  const diasArr = [...Array(dias)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(dias-1-i)); d.setHours(0,0,0,0); return d; });
  const porDia = diasArr.map(d=>{ const next=new Date(d); next.setDate(next.getDate()+1); return ventas.filter(v=>{const f=new Date(v.fecha_venta); return f>=d && f<next;}).reduce((s,v)=>s+v.ganancia_neta,0); });
  const etiquetasDias = diasArr.map(d=>d.toLocaleDateString('es-GT',{day:'2-digit',month:'2-digit'}));

  return { ventas, totalIngresos, totalCostos, totalGastos, totalGanancia, totalComisiones, vendEntries, catEntries, diasArr, porDia, etiquetasDias };
}

function openModal(html, size){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay ${size==='sheet'?'sheet-b':''}" id="modalOverlay"><div class="modal ${size==='lg'?'modal-lg':''} ${size==='sheet'?'modal-sheet':''}">${html}</div></div>`;
  const overlay = document.getElementById('modalOverlay');
  overlay.addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.addEventListener('keydown', onModalEscape);
  // doble rAF: deja pintar el estado inicial (opacity:0, scale:.96) antes de
  // animar hacia 'open', si no el navegador junta ambos frames y no se ve transición
  requestAnimationFrame(()=>requestAnimationFrame(()=>overlay.classList.add('open')));
}
function onModalEscape(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){
  const overlay = document.getElementById('modalOverlay');
  document.removeEventListener('keydown', onModalEscape);
  if(!overlay){ document.getElementById('modalRoot').innerHTML=''; return; }
  overlay.classList.remove('open');
  // Solo se limpia si la ventana que se está cerrando sigue siendo la que está
  // en pantalla: si mientras tanto se abrió otra (ej. "Más" → "Compartir
  // catálogo"), no hay que borrarla.
  setTimeout(()=>{
    const root = document.getElementById('modalRoot');
    if(root.contains(overlay)) root.innerHTML = '';
  }, overlay.classList.contains('sheet-b') ? 300 : 180);
}

// Zoom de fotos: clic en cualquier imagen de una galería la abre en grande,
// con flechas (o ← →) para pasar a la siguiente si hay más de una.
function openLightbox(urls, startIndex){
  let i = startIndex || 0;
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.innerHTML = `
    <button class="lightbox-close" aria-label="Cerrar">${icon('x')}</button>
    ${urls.length>1?`<button class="lightbox-nav prev" aria-label="Anterior">‹</button><button class="lightbox-nav next" aria-label="Siguiente">›</button>`:''}
    <img class="lightbox-img" src="${urls[i]}">
    ${urls.length>1?`<div class="lightbox-count">${i+1} / ${urls.length}</div>`:''}`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>requestAnimationFrame(()=>overlay.classList.add('open')));
  const update = () => {
    overlay.querySelector('.lightbox-img').src = urls[i];
    const count = overlay.querySelector('.lightbox-count'); if(count) count.textContent = (i+1)+' / '+urls.length;
  };
  const onKey = e => {
    if(e.key==='Escape') close();
    else if(e.key==='ArrowLeft' && urls.length>1){ i=(i-1+urls.length)%urls.length; update(); }
    else if(e.key==='ArrowRight' && urls.length>1){ i=(i+1)%urls.length; update(); }
  };
  const close = () => {
    overlay.classList.remove('open');
    document.removeEventListener('keydown', onKey);
    setTimeout(()=>overlay.remove(), 200);
  };
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  overlay.querySelector('.lightbox-close').addEventListener('click', close);
  overlay.querySelector('.lightbox-nav.prev')?.addEventListener('click', ()=>{ i=(i-1+urls.length)%urls.length; update(); });
  overlay.querySelector('.lightbox-nav.next')?.addEventListener('click', ()=>{ i=(i+1)%urls.length; update(); });
}

        <div class="calc-row comision"><span>Comisión (${p.porcentaje_ganancia}%)</span><span>${money(Math.max(p.precio_venta-p.costo,0)*p.porcentaje_ganancia/100)}</span></div>
      </div>
      <p class="text-muted mt-16">${p.descripcion||'Sin descripción.'}</p>

// La URL de la ficha lleva el nombre/teléfono de QUIEN comparte (si los
// tiene guardados en "Mi cuenta") codificados en el link mismo — así la
// ficha pública puede ofrecer "Contactar por WhatsApp" sin exponer el
// directorio de teléfonos del equipo a nadie más que a quien recibe ESE link.
function urlFichaProducto(p){
  let url = location.origin + location.pathname + '?p=' + p.codigo;
  const cur = DB.currentUser();
  const tel = cur && telefonoInternacional(cur.telefono);
  if(tel) url += '&v=' + encodeURIComponent(cur.nombre) + '&tel=' + encodeURIComponent(tel.slice(1));
  return url;
}

/* =====================================================================
   ESTADOS DE WHATSAPP — genera una imagen 1080x1920 (formato Estado) con
   canvas, lista para descargar o compartir. No existe forma de publicar
   directo al Estado de WhatsApp desde una web (no hay API pública para
   eso) — esto arma la imagen bonita y el share nativo del teléfono deja
   elegir "WhatsApp > Mi estado" como cualquier otra imagen.
===================================================================== */
function redondearRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function envolverTextoCanvas(ctx, texto, maxWidth){
  const palabras = texto.split(' ');
  const lineas = [];
  let actual = '';
  for(const palabra of palabras){
    const prueba = actual ? actual+' '+palabra : palabra;
    if(actual && ctx.measureText(prueba).width > maxWidth){ lineas.push(actual); actual = palabra; }
    else actual = prueba;
  }
  if(actual) lineas.push(actual);
  return lineas;
}
function cargarImagenCORS(url){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = ()=>resolve(img);
    img.onerror = ()=>reject(new Error('No se pudo cargar la foto'));
    img.src = url;
  });
}
function primeraFotoUrlProducto(producto, faseIdeal){
  const deFase = DB.fotosDe(producto.id, faseIdeal);
  if(deFase.length) return deFase[0].url_foto;
  const cualquiera = DB.fotosDe(producto.id);
  return cualquiera.length ? cualquiera[0].url_foto : null;
}
// Relleno "conforme al borde de la foto": la misma foto estirada a todo el
// lienzo y desenfocada (se achica a miniatura y se vuelve a estirar — así el
// blur funciona igual en Safari, que no soporta bien ctx.filter).
function dibujarFondoDesenfocado(ctx, img, W, H){
  const aspecto = W/H;
  let sw = img.width, sh = img.width/aspecto;
  if(sh > img.height){ sh = img.height; sw = img.height*aspecto; }
  let origen = img, rect = [(img.width-sw)/2, (img.height-sh)/2, sw, sh];
  for(const [cw, ch] of [[24, 43], [96, 171]]){
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high';
    cx.drawImage(origen, rect[0], rect[1], rect[2], rect[3], 0, 0, cw, ch);
    origen = c; rect = [0, 0, cw, ch];
  }
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(origen, 0, 0, W, H);
  ctx.fillStyle = 'rgba(20,14,10,0.18)';
  ctx.fillRect(0, 0, W, H);
}
async function cargarFotoEstado(producto, tipo){
  const url = primeraFotoUrlProducto(producto, tipo==='vendido' ? 'vendido' : 'inventario');
  if(!url) return null;
  try{ return await cargarImagenCORS(url); }catch(e){ return null; }
}
// Dibujo síncrono (la foto ya está cargada) para poder redibujar al instante
// mientras se mueve el control de tamaño. zoom = fracción del ANCHO (0.4 a 1):
// el alto sale proporcional, la foto nunca se deforma.
function dibujarEstado(canvas, img, producto, tipo, zoom){
  const W = canvas.width, H = canvas.height, ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#EAD9C9';
  ctx.fillRect(0, 0, W, H);

  if(img){
    dibujarFondoDesenfocado(ctx, img, W, H);
    const anchoMax = Math.min(W, H*img.width/img.height);
    const fw = anchoMax*zoom, fh = fw*img.height/img.width;
    const fx = (W-fw)/2, fy = (H-fh)/2;
    ctx.save();
    if(zoom < 0.995){
      ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 16;
      redondearRect(ctx, fx, fy, fw, fh, 28);
      ctx.fillStyle = '#000'; ctx.fill();
      ctx.shadowColor = 'transparent';
      redondearRect(ctx, fx, fy, fw, fh, 28);
      ctx.clip();
    }
    ctx.drawImage(img, fx, fy, fw, fh);
    ctx.restore();
  }

  if(tipo==='vendido'){
    ctx.fillStyle = 'rgba(20,14,10,0.45)'; // "opacarlo un poco"
    ctx.fillRect(0, 0, W, H);

    const boxW = W*0.78, boxH = 260, boxX = (W-boxW)/2, boxY = (H-boxH)/2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
    ctx.fillStyle = '#FFFDF9';
    redondearRect(ctx, boxX, boxY, boxW, boxH, 32);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#3B2A1F';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 96px "Fira Sans"';
    try{ ctx.letterSpacing = '2px'; }catch(e){}
    ctx.fillText('Vendido', W/2, boxY + boxH/2 + 4);
  } else {
    const grad = ctx.createLinearGradient(0, H*0.42, 0, H);
    grad.addColorStop(0, 'rgba(26,19,16,0)');
    grad.addColorStop(1, 'rgba(20,14,10,0.92)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.font = '800 30px "Fira Sans"';
    try{ ctx.letterSpacing = '2px'; }catch(e){}
    const etiqueta = 'NUEVO INGRESO';
    const padX = 26, padY = 16;
    const pillW = ctx.measureText(etiqueta).width + padX*2, pillH = 30 + padY*2;
    ctx.fillStyle = '#BE8A8A';
    redondearRect(ctx, 64, 64, pillW, pillH, pillH/2);
    ctx.fill();
    ctx.fillStyle = '#FFFDF9';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(etiqueta, 64+padX, 64+pillH/2+2);

    ctx.font = '800 66px "Fira Sans"';
    try{ ctx.letterSpacing = '0px'; }catch(e){}
    const lineas = envolverTextoCanvas(ctx, producto.nombre, W-128).slice(0, 2);
    ctx.fillStyle = '#FFFDF9';
    ctx.textBaseline = 'alphabetic';
    let y = H - (lineas.length===2 ? 308 : 230);
    lineas.forEach(linea=>{ ctx.fillText(linea, 64, y); y += 78; });

    ctx.font = '800 78px "Fira Sans"';
    ctx.fillStyle = '#EAD9C9';
    ctx.fillText(money(producto.precio_venta), 64, y+20);

    const marca = document.querySelector('.login-logo .name')?.textContent;
    if(marca){
      ctx.font = '600 28px "Fira Sans"';
      ctx.fillStyle = 'rgba(255,253,249,0.75)';
      ctx.fillText(marca, 64, H-64);
    }
  }
}
async function modalEstadoWhatsApp(producto, tipo){
  const yaCompartido = tipo==='vendido' ? producto.estado_wsp_vendido_compartido : producto.estado_wsp_nuevo_compartido;
  openModal(`
    <div class="modal-head"><div class="modal-title">${tipo==='vendido'?'Publicar como vendido':'Estado: nuevo ingreso'}</div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body" style="text-align:center;">
      <div id="estadoWspLoading" class="text-muted" style="padding:60px 0;">Generando imagen...</div>
      <div id="estadoWspControles" hidden>
        <canvas id="estadoWspCanvas" width="1080" height="1920" style="max-width:100%;max-height:52vh;border-radius:12px;box-shadow:var(--shadow-lg);"></canvas>
        <div class="form-group mt-16" style="text-align:left;">
          <label>Tamaño de la foto: <strong id="estadoWspZoomTxt">100%</strong></label>
          <input type="range" id="estadoWspZoom" min="40" max="100" value="100" step="1" style="padding:0;border:none;background:none;accent-color:var(--color-accent);">
          <small class="text-faint" style="font-size:11.5px;display:block;margin-top:4px;">Solo cambia el ancho (la foto nunca se deforma); lo que sobra se rellena con los colores de la misma foto.</small>
        </div>
        ${yaCompartido?`<div class="mb-8"><span class="badge badge-info">Ya compartido</span></div>`:''}
        <p class="text-faint" style="font-size:11.5px;">Se descarga como imagen — la subes tú como Estado de WhatsApp (no hay forma de publicarla ahí directo desde una página web).</p>
        <div id="estadoWspBotones" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;" class="mt-8"></div>
      </div>
    </div>`);
  try{
    try{ await document.fonts.load('800 60px "Fira Sans"'); await document.fonts.ready; }catch(e){}
    const img = await cargarFotoEstado(producto, tipo);
    const canvas = document.getElementById('estadoWspCanvas');
    let zoom = 1, blobActual = null, temporizador = null, yaMarcado = !!yaCompartido;
    const nombreArchivo = `estado-${producto.codigo}-${tipo}.png`;
    const generarBlob = ()=>new Promise(res=>canvas.toBlob(b=>{ blobActual = b; res(b); }, 'image/png'));
    const redibujar = ()=>{ dibujarEstado(canvas, img, producto, tipo, zoom); };
    redibujar();
    await generarBlob();
    document.getElementById('estadoWspLoading').hidden = true;
    document.getElementById('estadoWspControles').hidden = false;

    const slider = document.getElementById('estadoWspZoom');
    slider.addEventListener('input', ()=>{
      zoom = Number(slider.value)/100;
      document.getElementById('estadoWspZoomTxt').textContent = slider.value+'%';
      redibujar();
      clearTimeout(temporizador);
      temporizador = setTimeout(generarBlob, 200);
    });
    if(!img) document.getElementById('estadoWspZoom').closest('.form-group').hidden = true;

    const marcarCompartido = async ()=>{
      if(yaMarcado) return;
      const r = await DB.marcarEstadoCompartido(producto.id, tipo);
      if(r.ok){ yaMarcado = true; toast('Marcado como ya compartido','success'); refresh(); }
    };
    const botones = document.getElementById('estadoWspBotones');
    botones.innerHTML = `<button class="btn btn-secondary btn-sm" id="btnDescargarEstado">${icon('download')} Descargar imagen</button>`;
    document.getElementById('btnDescargarEstado').addEventListener('click', async ()=>{
      clearTimeout(temporizador);
      const blob = await generarBlob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = nombreArchivo; a.click();
      marcarCompartido();
    });
    const probe = new File([blobActual], nombreArchivo, { type:'image/png' });
    if(navigator.canShare && navigator.canShare({ files:[probe] })){
      const btnCompartir = document.createElement('button');
      btnCompartir.className = 'btn btn-primary btn-sm';
      btnCompartir.innerHTML = `${icon('whatsapp')} Compartir`;
      btnCompartir.addEventListener('click', async ()=>{
        // blobActual ya está listo (se regenera 200ms después de mover el control)
        // — así el share nativo corre dentro del gesto del click.
        const file = new File([blobActual], nombreArchivo, { type:'image/png' });
        try{ await navigator.share({ files:[file], title: producto.nombre }); marcarCompartido(); }
        catch(e){ /* canceló el share — no es un error */ }
      });
      botones.appendChild(btnCompartir);
    }
  }catch(e){
    document.getElementById('estadoWspLoading').textContent = 'No se pudo generar la imagen: '+(e.message||e);
  }
}

// Pantalla que sale apenas se guarda un producto nuevo: las fotos se suben
// aquí mismo (con barra de avance) y al terminar ofrece lo que sigue — casi
// siempre, compartirlo al Estado de WhatsApp o seguir con el siguiente.
function modalProductoCreado(prod, fotos){
  const n = fotos.length;
  openModal(`
    <div class="modal-head"><div class="modal-title">Producto guardado</div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body" style="text-align:center;">
      <div style="font-weight:800;font-size:18px;">${prod.nombre}</div>
      <div class="text-muted">${money(prod.precio_venta)} · ${prod.codigo}</div>
      ${n?`<div id="npProgreso" class="mt-16"><div class="progress-bar"><span id="npProgresoBarra"></span></div><div class="text-muted mt-8" id="npProgresoTxt" style="font-size:12.5px;">Subiendo fotos 0 de ${n}…</div></div>`:''}
      <div id="npAcciones" style="display:${n?'none':'flex'};flex-direction:column;gap:10px;margin-top:18px;">
        <button class="btn btn-primary btn-block" id="npaEstado" hidden>${icon('whatsapp')} Compartir al Estado de WhatsApp</button>
        <button class="btn btn-secondary btn-block" id="npaOtro">${icon('plus')} Agregar otro producto</button>
        <button class="btn btn-ghost btn-block" id="npaInventario">Ver inventario</button>
      </div>
    </div>`);
  const conectar = ()=>{
    document.getElementById('npaOtro').addEventListener('click', ()=>{ closeModal(); navigate('a-nuevo'); });
    document.getElementById('npaInventario').addEventListener('click', ()=>{ closeModal(); irAInventario('en_inventario'); });
  };
  conectar();
  if(!n) return;
  (async ()=>{
    const buenas = await DB.subirFotos(prod.id, 'inventario', fotos, (hechas, total)=>{
      const barra = document.getElementById('npProgresoBarra'), txt = document.getElementById('npProgresoTxt');
      if(barra) barra.style.width = Math.round(hechas/total*100)+'%';
      if(txt) txt.textContent = 'Subiendo fotos '+hechas+' de '+total+'…';
    });
    await DB.fetchAll();
    const fresco = DB.state.productos.find(x=>x.id===prod.id) || prod;
    const acciones = document.getElementById('npAcciones');
    if(!acciones){ toast(buenas+' foto(s) subidas — '+prod.nombre,'success'); return; } // cerró la pantalla antes de terminar
    document.getElementById('npProgreso').hidden = true;
    acciones.style.display = 'flex';
    if(buenas){
      const bEstado = document.getElementById('npaEstado');
      bEstado.hidden = false;
      bEstado.addEventListener('click', ()=>{ closeModal(); modalEstadoWhatsApp(fresco, 'nuevo'); });
    } else toast('No se pudo subir ninguna foto — puedes agregarlas editando el producto','danger');
  })();
}

    ${vTel?`<a class="sf-fab" href="https://wa.me/${vTel}?text=${encodeURIComponent(saludoWsp)}" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">${icon('whatsapp')}</a>`:''}`;
  document.getElementById('catBuscar').addEventListener('input', e=>{ q = e.target.value; dibujar(); });
  document.getElementById('catOrden').addEventListener('change', e=>{ orden = e.target.value; dibujar(); });
  enlazarChips();
  dibujar();

  // Abrir el detalle al tocar la tarjeta (menos el botón de WhatsApp, que va directo)
  document.getElementById('catGrid').addEventListener('click', e=>{
    if(e.target.closest('[data-wsp]')) return;
    const card = e.target.closest('.sf-card'); if(!card) return;
    const p = productos.find(x=>x.codigo===card.dataset.codigo);
    if(p) detalleCatalogo(p, { vNombre, vTel, linkResto, mensajeInteres });
  });

  // En vivo: la base avisa por un canal público (sin datos dentro) cuando algo
  // cambia en el inventario; aquí solo se vuelve a leer la vista pública.
  let t = null;
  const actualizar = ()=>{
    clearTimeout(t);
    t = setTimeout(async ()=>{
      const nuevosProductos = await leerProductos();
      if(!nuevosProductos) return;
      productos = nuevosProductos;
      if(cat && !productos.some(p=>p.categoria===cat)) cat = '';
      const chips = document.getElementById('catChips');
      if(chips){ chips.innerHTML = chipsHtml(); enlazarChips(); }
      dibujar();
    }, 600);
  };
  sb.channel('catalogo').on('broadcast', { event:'cambio' }, actualizar).subscribe();
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) actualizar(); });
}

// Detalle de un producto: hoja que sube desde abajo, con galería deslizable.
function detalleCatalogo(p, ctx){
  const fotos = p.fotos || [];
  const urlFicha = location.origin + location.pathname + '?p=' + encodeURIComponent(p.codigo) + ctx.linkResto;
  openModal(`
    <div class="modal-head"><div class="modal-title" style="font-size:15px;">${escHtml(p.codigo)}</div><button class="icon-btn" onclick="closeModal()" aria-label="Cerrar">${icon('x')}</button></div>
    <div class="modal-body" style="padding-top:0;">
      ${fotos.length ? `<div class="sf-gal" id="sfGal">${fotos.map((u,i)=>`<img src="${u}" data-i="${i}" alt="${escHtml(p.nombre)}" ${i?'loading="lazy"':''}>`).join('')}</div>
        ${fotos.length>1?`<div class="sf-dots" id="sfDots">${fotos.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}` : ''}
      ${p.categoria?`<span class="sf-d-cat">${escHtml(p.categoria)}</span>`:''}
      <div class="sf-d-nombre">${escHtml(p.nombre)}</div>
      <div class="sf-d-precio">Q ${Number(p.precio_venta).toFixed(2)}</div>
      ${p.descripcion?`<div class="sf-d-desc">${escHtml(p.descripcion)}</div>`:''}
      ${renderVideoEmbed(p.url_video)}
      <div class="sf-cta-bar">
        ${ctx.vTel?`<a class="sf-cta" href="https://wa.me/${ctx.vTel}?text=${encodeURIComponent(ctx.mensajeInteres(p))}" target="_blank" rel="noopener">${icon('whatsapp')} Me interesa por WhatsApp</a>`:''}
        <button type="button" class="sf-cta sec" id="sfCompartir">${icon('share')} Compartir esta pieza</button>
      </div>
    </div>`, 'sheet');
  const gal = document.getElementById('sfGal');
  gal?.querySelectorAll('img').forEach(img=>img.addEventListener('click', ()=>openLightbox(fotos, Number(img.dataset.i))));
  const dots = document.querySelectorAll('#sfDots i');
  if(gal && dots.length) gal.addEventListener('scroll', ()=>{
    const i = Math.round(gal.scrollLeft / gal.clientWidth);
    dots.forEach((d,k)=>d.classList.toggle('on', k===i));
  }, { passive:true });
  document.getElementById('sfCompartir').addEventListener('click', async ()=>{
    const texto = p.nombre + ' — Q ' + Number(p.precio_venta).toFixed(2);
    try{
      if(navigator.share) await navigator.share({ title:p.nombre, text:texto, url:urlFicha });
      else { await navigator.clipboard.writeText(urlFicha); toast('Enlace copiado'); }
    }catch(e){}
  });
}

}

function modalVender(p){
  const esAdmin = DB.isAdmin();
  const verCosto = esAdmin; // las vendedoras solo ven precio de venta y su comisión, nunca el costo/margen
  const pctComision = esAdmin ? 100 : p.porcentaje_ganancia; // el admin se queda con el 100%: es su propio negocio
  // Los gastos se SUMAN al precio (se cobran aparte al cliente) — nunca
  // reducen la ganancia/comisión. Dos formas de que un gasto se aplique
  // solo, sin casilla que elegir en el momento de la venta:
  //  1) "oculto_vendedoras" (ej. IVA): aplica a TODAS las ventas de TODOS
  //     los productos, y la vendedora nunca ve su nombre/monto individual.
  //  2) Asignado al producto (elegido en el formulario de Nuevo Producto):
  //     aplica solo a ESTE producto, pero sí es visible para la vendedora
  //     (no es un dato que haya que ocultarle, solo ya no lo elige ella).
  const gastosActivos = DB.state.gastos.filter(g=>g.activo);
  const idsDelProducto = p.gastos_predefinidos || [];
  const gastosOcultos = gastosActivos.filter(g=>g.oculto_vendedoras);
  const gastosDelProducto = gastosActivos.filter(g=>!g.oculto_vendedoras && idsDelProducto.includes(g.id));
  const gastosCheckbox = gastosActivos.filter(g=>!g.oculto_vendedoras && !idsDelProducto.includes(g.id));
  const montoAutomatico = g => g.tipo==='porcentaje' ? (p.precio_venta*g.monto_default/100) : Number(g.monto_default);
  const totalAutomaticos = gastosOcultos.reduce((s,g)=>s+montoAutomatico(g),0) + gastosDelProducto.reduce((s,g)=>s+montoAutomatico(g),0);
  const gananciaFija = p.precio_venta - p.costo; // los gastos ya NO la afectan
  const calcTotal = () => {
    let total = totalAutomaticos;
    document.querySelectorAll('.gasto-check').forEach(chk=>{ if(chk.checked) total += Number(document.querySelector(`.gasto-monto[data-id="${chk.dataset.id}"]`).value)||0; });
    document.getElementById('ventaGastosTotal').textContent = '+'+money(total);
    document.getElementById('ventaTotalCobrar').textContent = money(p.precio_venta + total);
  };
  openModal(`
    <div class="modal-head"><div class="modal-title">Vender: ${p.nombre}</div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <p class="text-muted mb-0">Selecciona los gastos que aplican a esta venta (se suman al precio, se cobran aparte al cliente).</p>
      <div class="mt-16">
      ${gastosCheckbox.length ? gastosCheckbox.map(g=>{
        const monto = g.tipo==='porcentaje' ? (p.precio_venta*g.monto_default/100).toFixed(2) : g.monto_default;
        return `<div class="gasto-row"><input type="checkbox" class="gasto-check" data-id="${g.id}" data-nombre="${g.nombre}">
          <span class="g-name">${g.nombre} ${g.tipo==='porcentaje'?`(${g.monto_default}%)`:''}</span>
          <input type="number" class="gasto-monto" data-id="${g.id}" value="${monto}" step="0.01"></div>`;
      }).join('') : `<div class="text-faint">No hay gastos configurados</div>`}
      </div>
      ${gastosDelProducto.length ? `<div class="text-faint mt-8" style="font-size:11px;">Gastos de este producto (aplican siempre, sin elegirlos): ${gastosDelProducto.map(g=>g.nombre+' ('+money(montoAutomatico(g))+')').join(', ')}</div>` : ''}
      ${esAdmin && gastosOcultos.length ? `<div class="text-faint mt-8" style="font-size:11px;">Automáticos a todas las ventas (las vendedoras no los ven por separado): ${gastosOcultos.map(g=>g.nombre+' ('+money(montoAutomatico(g))+')').join(', ')}</div>` : ''}
      <div class="calc-box">
        <div class="calc-row"><span>Precio de venta</span><span>${money(p.precio_venta)}</span></div>
        ${verCosto ? `<div class="calc-row"><span>Costo</span><span>-${money(p.costo)}</span></div>` : ''}
        <div class="calc-row"><span>Gastos aplicados</span><span id="ventaGastosTotal">+${money(totalAutomaticos)}</span></div>
        <div class="calc-row total"><span>Total a cobrar al cliente</span><span id="ventaTotalCobrar">${money(p.precio_venta+totalAutomaticos)}</span></div>
        ${verCosto ? `<div class="calc-row"><span>Ganancia neta</span><span>${money(gananciaFija)}</span></div>` : ''}
        <div class="calc-row comision"><span>${esAdmin?'Tu ganancia (100%)':'Tu comisión ('+pctComision+'%)'}</span><span>${money(Math.max(gananciaFija,0)*pctComision/100)}</span></div>
      </div>
      <div class="form-group mt-16">
        <label>¿Ya pagó?</label>
        <div class="pill-tabs mb-0" id="ventaEstadoPagoTabs">
          <button type="button" class="pill-tab active" data-valor="pagado">Ya pagó</button>
          <button type="button" class="pill-tab" data-valor="pendiente">Pendiente (fiado)</button>
        </div>
      </div>
      <details class="mas-opciones" id="ventaDetalles" style="margin-bottom:0;">
        <summary>Cliente y entrega (opcional)<span class="chev">${icon('chevron')}</span></summary>
      <div class="form-group"><label>Cliente (opcional)</label>
        <select id="ventaCliente">
          <option value="">Sin cliente asignado</option>
          ${DB.state.clientes.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}
          <option value="__nuevo__">+ Crear nuevo cliente…</option>
        </select>
        <div id="ventaNuevoClienteBox" hidden class="form-row mt-8">
          <input id="ventaNuevoClienteNombre" placeholder="Nombre del cliente">
          <input id="ventaNuevoClienteTelefono" placeholder="Teléfono (opcional)">
        </div>
      </div>
      <div class="form-group">
        <label>¿Ya se entregó el producto?</label>
        <div class="pill-tabs mb-0" id="ventaEntregaTabs">
          <button type="button" class="pill-tab active" data-valor="1">Ya se entregó</button>
          <button type="button" class="pill-tab" data-valor="0">Por entregar</button>
        </div>
      </div>
      </details>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="btnConfirmarVenta">${icon('check')} Confirmar Venta</button></div>`);
  document.querySelectorAll('.gasto-check, .gasto-monto').forEach(el=>el.addEventListener('input', calcTotal));
  document.getElementById('ventaCliente').addEventListener('change', e=>{
    document.getElementById('ventaNuevoClienteBox').hidden = e.target.value !== '__nuevo__';
  });
  let estadoPago = 'pagado';
  document.querySelectorAll('#ventaEstadoPagoTabs .pill-tab').forEach(btn=>btn.addEventListener('click', ()=>{
    document.querySelectorAll('#ventaEstadoPagoTabs .pill-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    estadoPago = btn.dataset.valor;
    if(estadoPago==='pendiente') document.getElementById('ventaDetalles').open = true; // fiado: conviene anotar a quién
  }));
  let entregado = true;
  document.querySelectorAll('#ventaEntregaTabs .pill-tab').forEach(btn=>btn.addEventListener('click', ()=>{
    document.querySelectorAll('#ventaEntregaTabs .pill-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    entregado = btn.dataset.valor === '1';
  }));
  document.getElementById('btnConfirmarVenta').addEventListener('click', async ()=>{
    const gastos = [...gastosOcultos, ...gastosDelProducto].map(g=>({ gasto_id:g.id, nombre:g.nombre, monto:montoAutomatico(g) }));
    document.querySelectorAll('.gasto-check').forEach(chk=>{ if(chk.checked) gastos.push({ gasto_id:chk.dataset.id, nombre:chk.dataset.nombre, monto:Number(document.querySelector(`.gasto-monto[data-id="${chk.dataset.id}"]`).value)||0 }); });
    const btnV = document.getElementById('btnConfirmarVenta'); btnV.disabled = true;

    let clienteId = document.getElementById('ventaCliente').value || null;
    if(clienteId === '__nuevo__'){
      const nombreNuevo = document.getElementById('ventaNuevoClienteNombre').value.trim();
      if(!nombreNuevo){ toast('Escribe el nombre del nuevo cliente (o deja "Sin cliente asignado")','danger'); btnV.disabled=false; return; }
      const resCliente = await DB.crearCliente({ nombre:nombreNuevo, telefono:document.getElementById('ventaNuevoClienteTelefono').value.trim() });
      if(!resCliente.ok){ toast('No se pudo crear el cliente: '+resCliente.error,'danger'); btnV.disabled=false; return; }
      clienteId = resCliente.data.id;
    }

    const res = await DB.venderProducto(p.id, gastos, clienteId, estadoPago);
    if(res.ok && !entregado) await DB.marcarEntregado(res.data.id, false);
    if(res.ok){ toast('¡Venta registrada! Ganaste '+money(res.data.comision_monto),'success'); closeModal(); await refresh(); }
    else { toast('No se pudo vender: '+(res.error==='PRODUCTO_NO_DISPONIBLE'?'otra persona ya lo tomó':res.error),'danger'); closeModal(); await refresh(); }
  });
}

/* =====================================================================
   AYUDA — guía general del sistema, editable por el admin desde el
   panel. Vive en configuracion.ayuda_contenido (texto plano con "## " para
   subtítulos y "- " para viñetas); AYUDA_DEFAULT es solo el respaldo por si
   la migración 04 todavía no corrió y esa clave no existe.
===================================================================== */
const AYUDA_DEFAULT = `## Qué es La Cabaña
Panel para administrar el inventario y las ventas de productos únicos (bolsas, relojes, accesorios...) entre una administradora y varias vendedoras. Cada producto es único — no hay existencias ni cantidades, solo estados.

## Roles
- Administradora: control total — crea productos, cajas, clasificaciones y gastos, ve todo el negocio, aprueba devoluciones y paga comisiones.
- Vendedora: aparta y vende productos disponibles, ve su propio catálogo, sus ventas y sus comisiones. Nunca ve el costo ni la ganancia, solo el precio de venta y su % de comisión.

## El ciclo de un producto
- Disponible: cualquiera puede apartarlo o venderlo directo.
- En Reserva: alguien lo apartó; solo esa persona (o la admin) puede venderlo o liberarlo. Si nadie lo vende a tiempo, se libera sola (configurable en Configuración).
- Vendido: ya se vendió — la primera persona en venderlo gana la comisión de ESE producto.
- Devuelto: si se aprueba una devolución, vuelve a este estado y la comisión se reversa; desde Inventario se puede "reingresar" para que vuelva a estar Disponible.

## Comisiones
Cada producto tiene su propio % de comisión. Cuando lo vende una vendedora, gana ese %; cuando lo vende la administradora, se queda con el 100% (es su propio negocio). En "Comisiones" la admin ve cuánto le debe a cada quien y registra los pagos — puede pagar solo una parte y el resto queda pendiente.

## Cajas
Una "caja" es un lote de mercancía que la admin compró. Cada producto puede pertenecer a una caja, y ahí se ve cuánto costó el lote contra cuánto ha generado en ventas.

## Clasificaciones y etiquetas
Las clasificaciones ordenan el catálogo (Termos y Pachones, Detalles de pareja...) y las administra la admin. Las etiquetas son libres — cualquier palabra suelta (Oferta, Nuevo ingreso) que se escribe directo al crear o editar un producto, sin necesidad de crearlas antes.

## Archivar y eliminar
Los productos vendidos se archivan solos después de unos días (se les borran las fotos para ahorrar espacio, pero el producto y su venta quedan en el historial para siempre). Pasado otro tanto de días archivados, se eliminan definitivamente — el historial de ventas nunca se pierde, aunque el producto se borre.

## Buscador y Pendientes
Ctrl/Cmd+K (o la lupa) busca cualquier producto por nombre o código desde cualquier página. "Pendientes" (solo admin) junta en un solo lugar las devoluciones por aprobar, las reservas por vencer y los productos archivados que están por eliminarse.

## Código QR y videos
Cada producto tiene un código QR que abre su ficha pública (sin iniciar sesión) — útil para mostrarlo a un cliente. Se le puede poner un link de YouTube o TikTok (aunque sea un link corto) y se muestra embebido en la ficha.

## Usuarios
Los usuarios NO se crean desde el panel — se dan de alta en Supabase (Authentication > Users), donde solo la administradora tiene acceso. Desde el panel solo se edita su nombre, rol, género, % de comisión, o se desactivan (nunca se borran, para no perder su historial).`;

function renderAyudaHTML(texto){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return (texto||'').split('\n').map(linea=>{
    linea = linea.trim();
    if(!linea) return '<div style="height:10px;"></div>';
    if(linea.startsWith('## ')) return `<h3 style="margin:18px 0 8px;font-size:14.5px;">${esc(linea.slice(3))}</h3>`;
    if(linea.startsWith('- ')) return `<div style="padding-left:14px;margin:3px 0;font-size:13px;">• ${esc(linea.slice(2))}</div>`;
    return `<p class="text-muted" style="margin:4px 0;font-size:13px;">${esc(linea)}</p>`;
  }).join('');
}

function generarPasswordFacil(){
  const letras = 'abcdefghjkmnpqrstuvwxyz', nums = '23456789';
  const pick = (set, n)=>Array.from({length:n}, ()=>set[Math.floor(Math.random()*set.length)]).join('');
  return pick(letras,4) + pick(nums,4);
}
function mensajeErrorUsuario(err){
  if(/EMAIL_YA_EXISTE/.test(err)) return 'Ese correo ya tiene cuenta';
  if(/EMAIL_INVALIDO/.test(err)) return 'El correo no se ve bien (ej. nombre@correo.com)';
  if(/PASSWORD_MUY_CORTA/.test(err)) return 'La contraseña necesita al menos 6 caracteres';
  if(/NOMBRE_VACIO/.test(err)) return 'Escribe el nombre';
  if(/does not exist|schema cache/i.test(err)) return 'falta correr la migración 17 en Supabase';
  return err;
}

// Texto plano para WhatsApp con el desglose de lo que debe (producto por
// producto, con su saldo individual) y el total — sin emojis, usando el
// *negrita* nativo de WhatsApp para que se vea ordenado igual sin HTML.
function mensajeEstadoCuenta(cliente){
  const r = DB.resumenCliente(cliente.id);
  const pendientes = r.compras.filter(v=>v.estado_pago==='pendiente').sort((a,b)=>new Date(a.fecha_venta)-new Date(b.fecha_venta));
  const fecha = new Date().toLocaleDateString('es-GT',{day:'2-digit',month:'2-digit',year:'numeric'});
  const lineas = pendientes.map(v=>`- ${v.producto_nombre}: ${money(saldoPendiente(v))} pendiente`).join('\n');
  return `*Estado de cuenta — La Cabaña*\nCliente: ${cliente.nombre}\n\n${lineas}\n\n*Total pendiente: ${money(r.deuda)}*\n\nGenerado el ${fecha}`;
}
function hrefEstadoCuentaWhatsApp(cliente){
  const tel = telefonoInternacional(cliente.telefono);
  const mensaje = encodeURIComponent(mensajeEstadoCuenta(cliente));
  return tel ? `https://wa.me/${tel.slice(1)}?text=${mensaje}` : `https://wa.me/?text=${mensaje}`;
}

async function modalConfirmarBorrarBitacora(){
  const total = await DB.contarBitacora();
  openModal(`
    <div class="modal-head"><div class="modal-title">${icon('trash')} Borrar toda la Bitácora</div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <p class="text-muted mb-0">Esto elimina <strong>de la base de datos, para siempre</strong>, los ${total} registro(s) de actividad (quién creó, editó o vendió qué, y cuándo) — incluye lo que se ve en "Actividad reciente" del Dashboard. <strong>No se puede deshacer.</strong></p>

      <div class="form-group mt-16"><label>Escribe <strong>BORRAR</strong> para confirmar</label><input id="confirmarBorrarInput" placeholder="BORRAR" autocomplete="off"></div>

  const input = document.getElementById('confirmarBorrarInput');
  const btn = document.getElementById('btnConfirmarBorrarBitacora');
  input.addEventListener('input', ()=>{ btn.disabled = input.value.trim().toUpperCase() !== 'BORRAR'; });

// instant=true (solo admin, desde a-devoluciones): se registra YA aprobada,
// sin pasar por "pendiente" — el producto va directo a Inventario > Revisión.
// instant=false (vendedora, desde Mis Ventas): sigue siendo una solicitud
// que el admin tiene que aprobar/rechazar, porque ella no tiene esa autoridad.
function modalDevolucion(ventaId, instant){
  openModal(`
    <div class="modal-head"><div class="modal-title">${instant?'Registrar Devolución':'Solicitar Devolución'}</div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      ${instant?`<p class="text-muted mb-0">Se marca de una vez como devuelta: se reversa la comisión y el producto pasa a "Devuelto — requiere revisión" en Inventario.</p>`:''}
      <div class="form-group mt-16"><label>Razón *</label><textarea id="devRazon" rows="3" placeholder="Explica el motivo de la devolución"></textarea></div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="btnEnviarDev">${instant?'Registrar devolución':'Enviar solicitud'}</button></div>`);
  document.getElementById('btnEnviarDev').addEventListener('click', async ()=>{
    const razon = document.getElementById('devRazon').value.trim();
    if(!razon) return toast('Escribe una razón','danger');
    const res = instant ? await DB.registrarDevolucionAdmin(ventaId, razon) : await DB.solicitarDevolucion(ventaId, razon);
    if(!res.ok) return toast('No se pudo: '+res.error,'danger');
    closeModal();
    if(instant){ toast('Devolución registrada — revísala en Inventario','success'); await DB.fetchAll(); inventarioSeccionAbierta='devuelto'; navigate('a-inventario'); }
    else { toast('Solicitud enviada','success'); await refresh(); }
  });
}

        <span class="g-name">${v.producto_nombre} <span class="text-faint">· ${fmtDateShort(v.fecha_venta)}</span></span>

  document.querySelectorAll('.venta-check').forEach(el=>el.addEventListener('change', calcTotal));

}

// Importar varios productos de golpe desde un CSV (útil cuando llega una caja
// con muchas piezas nuevas). Parseo 100% en el navegador, sin librerías.
function modalImportarCSV(){
  let filasValidas = [];
  openModal(`
    <div class="modal-head"><div class="modal-title">Importar productos desde CSV</div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <p class="text-muted mb-0">Columnas esperadas: <code>nombre, categoria, descripcion, costo, precio_venta, porcentaje_ganancia, url_video, etiquetas</code>. Solo <strong>nombre, costo y precio_venta</strong> son obligatorias; las demás pueden ir vacías.</p>
      <button class="btn btn-secondary btn-sm mt-16" id="btnPlantillaCSV">${icon('download')} Descargar plantilla</button>
      <div class="photo-drop mt-16" id="csvDropZone">${icon('upload')}<div class="pd-text"><div class="t">Click para elegir el archivo .csv</div></div></div>
      <input type="file" id="csvInput" accept=".csv,text/csv" hidden>
      <div id="csvPreview" class="mt-16"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="btnConfirmarImport" disabled>${icon('upload')} Importar</button></div>`);

  document.getElementById('btnPlantillaCSV').addEventListener('click', ()=>{
    const csv = 'nombre,categoria,descripcion,costo,precio_venta,porcentaje_ganancia,url_video,etiquetas\n"Bolsa de ejemplo","Bolsas","Descripción opcional",250,480,10,,"Oferta, Nuevo ingreso"\n';
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'plantilla_productos.csv'; a.click();
  });

  const dz = document.getElementById('csvDropZone'), input = document.getElementById('csvInput');
  dz.addEventListener('click', ()=>input.click());
  input.addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    const text = await file.text();
    const { productos, errores } = parseCSVProductos(text);
    filasValidas = productos;
    document.getElementById('csvPreview').innerHTML = `
      <div class="calc-box">
        <div class="calc-row"><span>Filas válidas</span><span>${productos.length}</span></div>
        ${errores.length ? `<div class="calc-row" style="color:var(--red-700);"><span>Filas con error (se omiten)</span><span>${errores.length}</span></div>` : ''}
      </div>
      ${errores.length ? `<div class="text-faint mt-8" style="font-size:11.5px;">${errores.slice(0,8).join('<br>')}${errores.length>8?'<br>…':''}</div>` : ''}
      ${productos.length ? `<div class="table-wrap mt-16"><table><thead><tr><th>Nombre</th><th>Clasificación</th><th>Costo</th><th>Precio</th></tr></thead><tbody>
        ${productos.slice(0,10).map(p=>`<tr><td>${p.nombre}</td><td>${p.categoria||'—'}</td><td>${p.costo}</td><td>${p.precio_venta}</td></tr>`).join('')}
      </tbody></table></div>${productos.length>10?`<div class="text-faint mt-8" style="font-size:11.5px;">…y ${productos.length-10} más</div>`:''}` : ''}`;
    document.getElementById('btnConfirmarImport').disabled = productos.length===0;
  });

  document.getElementById('btnConfirmarImport').addEventListener('click', async ()=>{
    const btn = document.getElementById('btnConfirmarImport'); btn.disabled = true; btn.textContent = 'Importando...';
    const res = await DB.importarProductos(filasValidas);
    if(res.ok){ toast(res.data.length+' producto(s) importados','success'); closeModal(); await refresh(); }
    else { toast('No se pudo importar: '+res.error,'danger'); btn.disabled = false; btn.innerHTML = icon('upload')+' Importar'; }
  });

// Buscador rápido global (Cmd/Ctrl+K): filtra por nombre o código sin salir de la página actual.
function modalBuscar(){
  openModal(`
    <div class="modal-head"><div class="modal-title">${icon('search')} Buscar</div><button class="icon-btn" onclick="closeModal()">${icon('x')}</button></div>
    <div class="modal-body">
      <div class="buscador"><input id="buscarInput" type="search" placeholder="Producto, código, cliente o teléfono…" autocomplete="off" enterkeyhint="search">${icon('search')}</div>
      <div id="buscarResultados" class="mt-16"></div>
    </div>`);
  const input = document.getElementById('buscarInput');
  const resultados = document.getElementById('buscarResultados');
  const filaProducto = p=>{
    const info = productBadgeInfo(p);
    const f = DB.fotosDe(p.id)[0];
    return `<button type="button" class="res-item" data-buscar-producto="${p.id}">
      <span class="res-thumb">${f?imgMini(f.url_foto, escHtml(p.nombre)):icon('crate')}</span>
      <span class="res-main"><span class="res-nombre" style="display:block;">${escHtml(p.nombre)}</span><span class="res-sub" style="display:block;">${escHtml(p.codigo)}${p.categoria?' · '+escHtml(p.categoria):''}</span></span>
      <span class="res-right"><span>${money(p.precio_venta)}</span><span class="badge ${info.cls}">${info.label}</span></span></button>`;
  };
  const filaCliente = (c, r)=>`<button type="button" class="res-item" data-buscar-cliente="${c.id}">
      <span class="res-thumb${r.deuda>0?' debe':''}">${escHtml(c.nombre.trim().charAt(0).toUpperCase()||'?')}</span>
      <span class="res-main"><span class="res-nombre" style="display:block;">${escHtml(c.nombre)}</span><span class="res-sub" style="display:block;">${escHtml(c.telefono||'Sin teléfono')} · ${r.compras.length} compra${r.compras.length===1?'':'s'}</span></span>
      <span class="res-right">${r.deuda>0?`<span style="color:var(--red-700);">${money(r.deuda)}</span><span class="text-faint" style="font-weight:500;font-size:11px;">debe</span>`:`<span class="badge badge-success">Al día</span>`}</span></button>`;
  const MAX_P = 12, MAX_C = 8;
  const render = texto=>{
    const q = texto.trim();
    if(!q){
      const deudores = DB.state.clientes.map(c=>({c, r:DB.resumenCliente(c.id)})).filter(x=>x.r.deuda>0).sort((a,b)=>b.r.deuda-a.r.deuda).slice(0,5);
      resultados.innerHTML = deudores.length
        ? `<div class="res-grupo">Clientes con deuda</div>${deudores.map(x=>filaCliente(x.c,x.r)).join('')}<div class="res-mas">O escribe arriba para buscar productos y clientes</div>`
        : `<div class="text-faint text-center" style="padding:20px 0;">Busca por nombre o código de producto, nombre o teléfono de un cliente</div>`;
    } else {
      const tokens = normalizar(q).split(/\s+/).filter(Boolean);
      const qDig = q.replace(/\D/g,'');
      const prods = DB.state.productos.filter(p=>coincideProducto(p, q, ''));
      const clis = DB.state.clientes.filter(c=>tokens.every(t=>normalizar(c.nombre+' '+(c.telefono||'')).includes(t)) || (qDig.length>=3 && (c.telefono||'').replace(/\D/g,'').includes(qDig)))
        .map(c=>({c, r:DB.resumenCliente(c.id)}));
      resultados.innerHTML = (prods.length ? `<div class="res-grupo">Productos (${prods.length})</div>${prods.slice(0,MAX_P).map(filaProducto).join('')}${prods.length>MAX_P?`<div class="res-mas">y ${prods.length-MAX_P} más — escribe más para afinar</div>`:''}` : '')
        + (clis.length ? `<div class="res-grupo">Clientes (${clis.length})</div>${clis.slice(0,MAX_C).map(x=>filaCliente(x.c,x.r)).join('')}${clis.length>MAX_C?`<div class="res-mas">y ${clis.length-MAX_C} más — escribe más para afinar</div>`:''}` : '')
        || `<div class="text-faint text-center" style="padding:20px 0;">Sin resultados para "${escHtml(q)}"</div>`;
    }
  };
  resultados.addEventListener('click', e=>{
    const bp = e.target.closest('[data-buscar-producto]'), bc = e.target.closest('[data-buscar-cliente]');

let filtroCajasExt = { estado:'abierta', tipo:'' };
let filtroExternas = { tipo:'' };

function mensajeErrorExtras(err){
  const e = String(err||'');
  const m = [
    ['PRODUCTO_NO_DISPONIBLE','Alguno de esos productos ya no está disponible'], ['CAJA_VACIA','Elige al menos un producto'],
    ['EXTERNA_INVALIDA','Elige una vendedora'], ['MONTO_MAYOR_AL_SALDO','Ese monto es mayor a lo que debe'],
    ['MONTO_INVALIDO','Escribe un monto válido'], ['YA_PAGADO','Ese producto ya está cubierto por un pago'],
    ['YA_DEVUELTO','Ese producto ya fue devuelto'], ['CAJA_CERRADA','La caja ya está cerrada'],
    ['HAY_PRODUCTOS_SIN_RESOLVER','Falta marcar qué pasó con algunos productos'], ['HAY_SALDO_PENDIENTE','Todavía falta cobrar'],
    ['PRECIO_INVALIDO','Revisa los precios'], ['NOMBRE_VACIO','Escribe un nombre'], ['SOLO_ADMIN','No tienes permiso'],
    ['EN_CAJA','Ese producto está en una caja'], ['TIENE_CAJAS_ABIERTAS','Tiene cajas abiertas'], ['SIN_FOTOS','Agrega al menos una foto']
  ].find(x=>e.includes(x[0]));
  return m ? m[1] : e;
}
function fechaCorta(iso){ return iso ? new Date(iso).toLocaleDateString('es-GT', { day:'2-digit', month:'short', year:'numeric' }) : '—'; }
function inicialDe(t){ return escHtml((t||'?').trim().charAt(0).toUpperCase() || '?'); }

// Clasificaciones: lista para elegir + "Nueva" escribiéndola ahí mismo.
function opcionesClasificacion(sel){
  return `<option value="">Sin clasificación</option>` +
    DB.state.categorias.map(c=>`<option value="${escHtml(c.nombre)}"${sel===c.nombre?' selected':''}>${escHtml(c.nombre)}</option>`).join('') +
    `<option value="__nueva__">+ Nueva clasificación…</option>`;
}
function enlazarClasificacionNueva(selId, inpId){
  const s = document.getElementById(selId), i = document.getElementById(inpId); if(!s || !i) return;
  s.addEventListener('change', ()=>{ i.hidden = s.value !== '__nueva__'; if(!i.hidden) i.focus(); });
}
async function leerClasificacion(selId, inpId){
  const s = document.getElementById(selId); if(!s) return '';
  if(s.value !== '__nueva__') return s.value;
  const nombre = (document.getElementById(inpId).value || '').trim();
  if(!nombre) return '';
  const r = await DB.crearCategoria(nombre);
  if(r.ok) await DB.fetchAll();
  return nombre;
}
function opcionesUbicacion(sel){
  return `<option value="">Sin lugar</option>` + (DB.state.ubicaciones||[]).map(u=>`<option value="${u.id}"${sel===u.id?' selected':''}>${escHtml(u.nombre)}</option>`).join('');
}
// Agrupa por clasificación (vista sin fotos): título con cantidad y filas debajo.
function listaAgrupadaHtml(items, getCat, filaFn){
  const grupos = new Map();
  items.forEach(it=>{ const c = getCat(it) || 'Sin clasificación'; if(!grupos.has(c)) grupos.set(c, []); grupos.get(c).push(it); });
  const orden = [...grupos.keys()].sort((a,b)=> a==='Sin clasificación' ? 1 : b==='Sin clasificación' ? -1 : a.localeCompare(b,'es'));
  return orden.map(c=>`<div class="grupo-head"><span>${escHtml(c)}</span><b>${grupos.get(c).length}</b></div>
    <div class="lista-filas">${grupos.get(c).slice().sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre),'es')).map(filaFn).join('')}</div>`).join('');
}

/* ---------------------------------------------------------------- Productos extras */
function extraDeCaja(e){
  const it = DB.state.extras_items.find(i=>i.producto_id===e.id && DB.state.cajas_ext.some(c=>c.id===i.caja_id && c.estado==='abierta'));
  const caja = it ? DB.state.cajas_ext.find(c=>c.id===it.caja_id) : null;
  return { caja, externa: caja ? DB.state.externas.find(x=>x.id===caja.externa_id) : null };
}
function extraFila(e){
  const enCaja = e.estado === 'en_caja';
  const { caja, externa } = enCaja ? extraDeCaja(e) : {};
  const ubi = DB.ubicacionDe(e.ubicacion_id);
  return `<div class="extra-row" data-action="mas-extra" data-id="${e.id}">
    <div class="res-thumb">${e.foto_url ? imgMini(e.foto_url, escHtml(e.nombre)) : icon('crate')}</div>
    <div class="res-main">
      <div class="res-nombre">${escHtml(e.nombre)}</div>
      <div class="res-sub">${escHtml(e.codigo)} · Normal ${money(e.precio_venta)} · Externas ${money(e.precio_externa)}</div>
      ${externa ? `<div class="res-sub">Con ${escHtml(externa.nombre)} · ${escHtml(caja.codigo)}</div>` : (ubi ? `<div class="res-sub">${icon('pin')} ${escHtml(ubi.nombre)}</div>` : '')}
    </div>
    <div class="res-right"><span class="badge ${enCaja?'badge-warning':'badge-success'}">${enCaja?'En caja':'Disponible'}</span></div>
  </div>`;
}
function extrasFiltrados(){
  const tokens = normalizar(busquedaExtras.q).split(/\s+/).filter(Boolean);
  const buscando = tokens.length > 0;
  return DB.state.extras.filter(e=>{
    if(!buscando && e.estado !== (busquedaExtras.estado==='en_caja' ? 'en_caja' : 'disponible')) return false;
    if(!buscando) return true;
    const ubi = DB.ubicacionDe(e.ubicacion_id);
    const pajar = normalizar([e.nombre, e.codigo, e.descripcion, e.categoria, ubi?ubi.nombre:'', e.precio_venta, e.precio_externa].join(' '));
    return tokens.every(t=>pajar.includes(t));
  });
}
function extrasEstadosHtml(){
  if(busquedaExtras.q.trim()) return '';
  const nd = DB.state.extras.filter(e=>e.estado==='disponible').length, nc = DB.state.extras.length - nd;
  const t = (k, txt, n, color)=>`<button type="button" class="estado-tab${busquedaExtras.estado===k?' active':''}" data-action="extras-estado" data-key="${k}"><span class="dot" style="background:${color}"></span>${txt}<span class="n">${n}</span></button>`;
  return `<div class="chips-scroll estado-tabs">${t('disponible','Disponibles',nd,'var(--forest-600)')}${t('en_caja','En cajas',nc,'var(--amber-500)')}</div>`;
}
function extrasContenido(){
  const lista = extrasFiltrados();
  const buscando = busquedaExtras.q.trim();
  if(!lista.length) return `<div class="text-faint text-center" style="padding:36px 10px;">${buscando?'No hay productos con esa búsqueda':(DB.state.extras.length?'No hay productos aquí':'Aún no hay productos extras')}</div>`;
  return `${buscando?`<div class="res-head"><span>${lista.length} resultado${lista.length===1?'':'s'}</span><button type="button" class="btn btn-secondary btn-sm" data-action="limpiar-busqueda-extras">Limpiar</button></div>`:''}
    ${listaAgrupadaHtml(lista, e=>e.categoria, extraFila)}`;
}
function dibujarExtras(){
  const t = document.getElementById('extrasEstados'), l = document.getElementById('extrasLista');
  if(t) t.innerHTML = extrasEstadosHtml();
  if(l) l.innerHTML = extrasContenido();
}
