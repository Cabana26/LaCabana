<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>La Cabaña · Panel de Inventario</title>
<!-- PWA: solo hace instalable el sitio (ícono en pantalla de inicio, se abre
     sin barra del navegador). No cambia nada del diseño/HTML/CSS de la app.
     Sin service worker a propósito: así SIEMPRE carga la versión más
     reciente publicada, igual que abrir la página normal — cualquier
     cambio futuro que subas se refleja de inmediato, sin caché que limpiar. -->
<link rel="manifest" href="manifest.json">
<!-- Igual al --color-surface claro (topbar/fondo) — en Android, esto es lo que
     pinta la barra de estado del sistema; si no calza con lo que hay debajo se
     ve una franja de color distinto arriba (aplicarTemaOscuro la actualiza
     cuando cambia a oscuro, para que siga calzando). -->
<meta name="theme-color" content="#FFFDF9">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- "black-translucent" hace que iOS ponga una franja traslúcida ENCIMA del
     contenido bajo la barra de estado — eso es el "borroso" que se veía
     arriba, permanente, no una animación. "default" deja la barra de estado
     normal (opaca) y el contenido empieza debajo, sin overlay ni blur. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="La Cabaña">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Fira+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha512-r22gChDnGvBylk90+2e/ycr3RVrDi8DIOkIGNhJlKfuyQM4tIRAI062MaV8sfjQKYVGjOBaZBOA87z+IhZE9DA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  /* Paleta "French Café" — crema + malva + café oscuro + taupe/tostado (referencia de la usuaria) */
  --coffee-900:#2A1D15;--coffee-800:#3B2A1F;--coffee-700:#5C4433;--coffee-600:#8C7565;
  --coffee-400:#B7A69B;--coffee-200:#EAD9C9;--coffee-100:#F3E9DD;--coffee-50:#FAF3EA;
  --mauve-700:#A5716F;--mauve-600:#BE8A8A;--mauve-100:#F3E2DE;
  --tan-600:#C9A575;
  /* Los siguientes son solo semánticos de estado (disponible/reserva/vendido/devuelto) —
     nunca son el acento de marca, así se distinguen del malva a simple vista */
  --forest-700:#5B6E52;--forest-600:#7C8F73;--forest-100:#E7EBE3;
  --amber-700:#8A5A20;--amber-500:#B5762A;--amber-100:#F3E3CB;
  --sage-700:#4A5A5C;--sage-600:#657B7D;--sage-100:#E4EAEA;
  --red-700:#8C2F24;--red-600:#B7412F;--red-100:#F4DED8;

  --color-primary:var(--coffee-700);--color-primary-dark:var(--coffee-800);
  --color-accent:var(--mauve-600);--color-accent-dark:var(--mauve-700);
  --color-success:var(--forest-600);--color-danger:var(--red-600);
  --color-warning:var(--amber-500);--color-info:var(--sage-600);

  --color-bg:var(--coffee-50);--color-surface:#FFFDF9;--color-surface-alt:var(--coffee-100);
  --color-border:var(--coffee-200);
  --color-text:var(--coffee-900);--color-text-muted:var(--coffee-600);--color-text-faint:var(--coffee-400);

  --sidebar-bg-1:var(--coffee-800);--sidebar-bg-2:var(--coffee-900);--sidebar-text:#FFFDF9;
  --sidebar-text-muted:rgba(255,253,249,.68);--sidebar-text-faint:rgba(255,253,249,.42);
  --sidebar-border:rgba(255,253,249,.14);--sidebar-active-bg:var(--mauve-600);--sidebar-active-text:var(--coffee-900);

  --shadow:0 1px 3px rgba(36,23,18,.12);--shadow-lg:0 12px 28px rgba(36,23,18,.18);
  --font-body:'Fira Sans','Segoe UI',sans-serif;--font-mono:'Fira Code',ui-monospace,monospace;
  --radius:14px;

  /* Curvas con más carácter que el ease/ease-out por defecto del navegador */
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
}
/* Modo oscuro real — se activa con [data-theme="dark"] en <html> (botón en
   la topbar, se recuerda por dispositivo). Solo cambia fondo/superficie/texto;
   el acento personalizado de cada quien (applyUserTheme) sigue funcionando igual. */
:root[data-theme="dark"]{
  --color-bg:#1C1512;--color-surface:#241C17;--color-surface-alt:#2F251F;
  --color-border:#453830;
  --color-text:#F3E9DD;--color-text-muted:#B7A69B;--color-text-faint:#8C7565;
  --shadow:0 1px 3px rgba(0,0,0,.35);--shadow-lg:0 12px 28px rgba(0,0,0,.5);
}
*:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;}
}
/* Android (a diferencia de iOS Safari) deja ver el fondo blanco por default
   de <html> en los bordes cuando 100vh no calza exacto con lo visible (barra
   de direcciones dinámica) — sin esto se ve una franja sin color abajo. */
html{background:var(--color-bg);}
body{font-family:var(--font-body);background:var(--color-bg);color:var(--color-text);line-height:1.5;font-size:14px;transition:background 200ms var(--ease-out),color 200ms var(--ease-out);}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
input,select,textarea{background:var(--color-surface-alt);border:1px solid var(--color-border);border-radius:10px;padding:10px 12px;width:100%;
  transition:border-color 150ms var(--ease-out),box-shadow 150ms var(--ease-out);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 3px rgba(190,138,138,.15);}
label{display:block;font-size:12.5px;font-weight:600;color:var(--color-text-muted);margin-bottom:6px;}
.form-group{margin-bottom:16px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
a{color:var(--color-accent);}
h1,h2,h3{font-weight:700;}
[hidden]{display:none!important;}

/* ---------- layout ---------- */
.app-shell{display:flex;min-height:100vh;min-height:100dvh;}
.sidebar{width:260px;flex-shrink:0;background:linear-gradient(160deg,var(--sidebar-bg-1),var(--sidebar-bg-2));
  color:var(--sidebar-text);padding:22px 16px;display:flex;flex-direction:column;}
.sidebar-footer-art{margin-top:auto;padding-top:26px;display:flex;justify-content:center;opacity:.85;}
.sidebar-footer-art img{width:104px;height:104px;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.28));}
.sidebar-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.sidebar-brand .emblem{width:36px;height:36px;border-radius:10px;background:linear-gradient(160deg,var(--color-accent),var(--coffee-800));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sidebar-brand .emblem svg{width:18px;height:18px;stroke:#fff;}
.sidebar-brand-text .name{font-weight:700;font-size:16px;}
.sidebar-brand-text .role{font-size:11px;color:var(--sidebar-text-faint);}
.sidebar-divider{height:1px;background:var(--sidebar-border);margin:16px 0;}
.nav-section-title{color:var(--sidebar-text-faint);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  font-weight:700;margin:18px 6px 8px;}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 14px;border:none;background:none;
  color:var(--sidebar-text-muted);border-radius:10px;cursor:pointer;margin-bottom:2px;transition:background .15s,color .15s;}
.nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;flex-shrink:0;}
.nav-item:hover{background:rgba(248,250,252,.08);color:var(--sidebar-text);}
.nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text);font-weight:600;}
.nav-badge{margin-left:auto;background:var(--red-600);color:#fff;font-size:10px;font-weight:700;border-radius:999px;
  padding:1px 6px;min-width:16px;text-align:center;}

.content{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:calc(14px + env(safe-area-inset-top)) 26px 14px;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-title{font-size:19px;font-weight:700;}
.topbar-sub{font-size:12px;color:var(--color-text-muted);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.main{flex:1;padding:24px 26px 60px;max-width:1400px;width:100%;}
button.menu-toggle{display:none;}
.sidebar-scrim{position:fixed;inset:0;background:rgba(24,17,10,.45);z-index:299;
  opacity:0;pointer-events:none;transition:opacity 220ms var(--ease-out);}
.sidebar-scrim.open{opacity:1;pointer-events:auto;}
@media (max-width:980px){
  .sidebar{position:fixed;top:0;left:0;height:100vh;height:100dvh;z-index:300;
    width:min(82vw,300px);transform:translateX(-100%);transition:transform 280ms var(--ease-drawer);
    padding-top:calc(22px + env(safe-area-inset-top));padding-bottom:calc(22px + env(safe-area-inset-bottom));}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg);}
  button.menu-toggle{display:inline-flex;}
  .form-row{grid-template-columns:1fr;}
}

/* ---------- buttons / icon buttons ---------- */
.btn{padding:10px 18px;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:13.5px;
  display:inline-flex;align-items:center;gap:8px;
  transition:background 150ms var(--ease-out),transform 120ms var(--ease-out),filter 150ms var(--ease-out),box-shadow 150ms var(--ease-out);}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--color-accent);color:#fff;}
.btn-primary:hover{background:var(--color-accent-dark);}
.btn-secondary{background:var(--color-surface-alt);color:var(--color-text);border:1px solid var(--color-border);}
.btn-secondary:hover{background:var(--coffee-200);}
.btn-danger{background:var(--red-600);color:#fff;}
.btn-danger:hover{filter:brightness(.92);}
.btn-ghost{background:transparent;color:var(--color-text-muted);}
.btn-ghost:hover{background:var(--color-surface-alt);}
.btn-block{width:100%;justify-content:center;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn:disabled:active{transform:none;}
.btn-sm{padding:6px 12px;font-size:12.5px;}

.icon-btn{--bg:var(--coffee-100);--fg:var(--coffee-700);width:34px;height:34px;border-radius:50%;border:none;
  background:var(--bg);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform 150ms var(--ease-out),filter 150ms var(--ease-out);position:relative;}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;}
@media (hover:hover) and (pointer:fine){
  .icon-btn:hover{transform:translateY(-1px);filter:brightness(1.05);}
}
.icon-btn:active{transform:scale(.93);}
.icon-btn.view{--bg:var(--coffee-200);--fg:var(--coffee-700);}
.icon-btn.edit{--bg:var(--amber-100);--fg:var(--amber-700);}
.icon-btn.delete{--bg:var(--red-100);--fg:var(--red-700);}
.icon-btn.confirm{--bg:var(--forest-100);--fg:var(--forest-700);}
.icon-btn.info{--bg:var(--sage-100);--fg:var(--sage-700);}
.icon-btn.compartido{--bg:#DCE7F3;--fg:#2F5C8A;}
/* Zoom opcional del panel completo (menú de usuario > Tamaño) */
html.zoom-1{zoom:1.12;}
html.zoom-2{zoom:1.25;}
[data-tip]{position:relative;}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;
  transform:translateX(-50%) translateY(3px) scale(.94);transform-origin:bottom center;
  background:var(--coffee-900);color:#fff;font-size:11px;padding:4px 9px;border-radius:6px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity 140ms var(--ease-out),transform 140ms var(--ease-out);z-index:20;}
[data-tip]:hover::after{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}

/* ---------- cards / kpis ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px;}
.kpi-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:18px;}
.kpi-card.clickable{cursor:pointer;transition:transform 120ms var(--ease-out),box-shadow 120ms var(--ease-out),border-color 120ms var(--ease-out);}
.kpi-card.clickable:hover{border-color:var(--color-accent);box-shadow:var(--shadow);}
.kpi-card.clickable:active{transform:scale(0.97);}
.kpi-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.kpi-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.kpi-icon.icon-success{background:var(--forest-100);color:var(--forest-700);}
.kpi-icon.icon-warn{background:var(--amber-100);color:var(--amber-700);}
.kpi-icon.icon-info{background:var(--sage-100);color:var(--sage-700);}
.kpi-icon.icon-danger{background:var(--red-100);color:var(--red-700);}
.kpi-icon.icon-neutral{background:var(--coffee-100);color:var(--coffee-700);}
.kpi-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;}
.kpi-label{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--color-text-faint);}
.kpi-value{font-size:24px;font-weight:700;}
.kpi-sub{font-size:11.5px;color:var(--color-text-muted);margin-top:4px;}

.panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:20px;margin-bottom:22px;}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.panel-title{font-size:16px;font-weight:700;}
.panel-actions{display:flex;gap:10px;flex-wrap:wrap;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.toolbar input,.toolbar select{width:auto;min-width:170px;}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:10px 12px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--color-text-faint);border-bottom:1px solid var(--color-border);white-space:nowrap;}
td{padding:12px;border-bottom:1px solid var(--color-border);font-size:13.5px;vertical-align:middle;}
tbody tr:hover{background:var(--color-surface-alt);}
.empty-row td{text-align:center;color:var(--color-text-faint);padding:30px;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;}
.badge-success{background:var(--forest-100);color:var(--forest-700);}
.badge-warning{background:var(--amber-100);color:var(--amber-700);}
.badge-info{background:var(--sage-100);color:var(--sage-700);}
.badge-danger{background:var(--red-100);color:var(--red-700);}
.badge-neutral{background:var(--coffee-100);color:var(--coffee-600);}

/* ---------- kanban ---------- */
/* Cada fase es una sección de ancho completo (no 3 columnas apretadas), con las
   tarjetas en una cuadrícula. Es un acordeón: solo una fase (Disponible, En
   Reserva, etc.) muestra sus tarjetas a la vez — clic en el encabezado
   despliega esa y encoge las demás. Pensado para verse bien en el teléfono. */
.kanban{display:flex;flex-direction:column;gap:12px;}
.kanban-col{background:var(--color-surface-alt);border-radius:var(--radius);overflow:hidden;}
.kanban-col-head{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;cursor:pointer;}
.kanban-col-head .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;}
.kanban-col-title{font-weight:700;font-size:14px;display:flex;align-items:center;}
.kanban-count{background:var(--color-surface);border:1px solid var(--color-border);border-radius:999px;padding:1px 9px;font-size:11px;font-weight:700;color:var(--color-text-muted);margin-left:8px;}
.kanban-chevron svg{width:18px;height:18px;stroke:var(--color-text-muted);transition:transform 160ms var(--ease-out);}
.kanban-col.open .kanban-chevron svg{transform:rotate(180deg);}
.kanban-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding:0 16px 16px;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}

.product-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:12px;overflow:hidden;
  transition:border-color 150ms var(--ease-out),box-shadow 150ms var(--ease-out);}
.product-card .pc-info{padding:11px 12px;cursor:pointer;transition:background 120ms var(--ease-out);}
@media (hover:hover) and (pointer:fine){
  .product-card .pc-info:hover{background:var(--color-surface-alt);}
  .product-card:has(.pc-info:hover){border-color:var(--coffee-400);}
}
.product-card .pc-info:active{background:var(--coffee-100);}
.pc-video-flag{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--coffee-800);color:#fff;vertical-align:middle;}
.pc-video-flag svg{width:8px;height:8px;stroke:currentColor;fill:currentColor;}
.product-card .body{padding:0 12px 12px;}
.product-card .name{font-weight:700;font-size:13.5px;margin-bottom:2px;}
.product-card .cat{font-size:11px;color:var(--color-text-faint);margin-bottom:8px;}
.product-card .price-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
.product-card .price{font-weight:700;font-size:15px;}
.product-card .pct{font-size:11px;color:var(--forest-700);font-weight:700;}
.product-card .who{font-size:11px;color:var(--color-text-muted);margin-top:6px;}
.who.archived-countdown{display:flex;align-items:center;gap:4px;color:var(--red-700);font-weight:600;}
.who.archived-countdown svg{width:11px;height:11px;stroke:currentColor;fill:none;flex-shrink:0;}
.product-card .actions{display:flex;gap:6px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--color-border);}
.icon-actions-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;width:100%;}
.tag-row{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 8px;}
.tag-chip{background:var(--mauve-100);color:var(--mauve-700);font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;}
.who .badge{font-size:10px;padding:2px 7px;margin-left:4px;vertical-align:middle;}
.who .badge svg{width:10px;height:10px;}

/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;opacity:0;transition:opacity 200ms var(--ease-out);}
.modal-overlay.open{opacity:1;}
.modal{background:var(--color-surface);border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);
  transform:scale(.96) translateY(4px);opacity:0;transition:transform 200ms var(--ease-out),opacity 200ms var(--ease-out);}
.modal-overlay.open .modal{transform:scale(1) translateY(0);opacity:1;}
.modal.modal-lg{max-width:800px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--color-border);position:sticky;top:0;background:var(--color-surface);z-index:2;}
.modal-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
.modal-title svg{width:18px;height:18px;stroke:currentColor;flex-shrink:0;}
.modal-body{padding:22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--color-border);position:sticky;bottom:0;background:var(--color-surface);z-index:2;}

/* ---------- login ---------- */
.login-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 15%,rgba(190,138,138,.12),transparent 45%) , var(--color-bg);padding:20px;}
.login-box{background:var(--color-surface);border:1px solid var(--color-border);border-radius:20px;padding:42px 36px;width:100%;max-width:400px;box-shadow:var(--shadow-lg);}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:26px;}
.login-logo .emblem{width:52px;height:52px;border-radius:14px;background:linear-gradient(160deg,var(--color-accent),var(--coffee-800));display:flex;align-items:center;justify-content:center;}
.login-logo .emblem svg{width:26px;height:26px;stroke:#fff;}
.login-logo .name{font-size:22px;font-weight:800;}
.login-logo .sub{font-size:12.5px;color:var(--color-text-muted);}
.login-error{background:var(--red-100);color:var(--red-700);padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;}

/* ---------- user menu / notifications ---------- */
.user-chip{display:flex;align-items:center;gap:9px;background:var(--color-surface-alt);border:1px solid var(--color-border);border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer;}
.user-chip .avatar{width:30px;height:30px;border-radius:50%;background:var(--color-accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.user-chip .info{line-height:1.2;}
.user-chip .info .n{font-weight:600;font-size:12.5px;}
.user-chip .info .r{font-size:10.5px;color:var(--color-text-muted);}
.dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:12px;box-shadow:var(--shadow-lg);min-width:230px;z-index:120;overflow:hidden;
  transform-origin:top right;opacity:0;transform:scale(.95) translateY(-4px);pointer-events:none;
  transition:opacity 150ms var(--ease-out),transform 150ms var(--ease-out);}
.dropdown.open{opacity:1;transform:scale(1) translateY(0);pointer-events:auto;}
.dropdown-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;background:none;border:none;text-align:left;cursor:pointer;font-size:13px;transition:background 120ms var(--ease-out);}
.dropdown-item:hover{background:var(--color-surface-alt);}
.dropdown-item svg{width:15px;height:15px;stroke:currentColor;fill:none;}
.dropdown-sep{height:1px;background:var(--color-border);}
.dropdown-label{padding:9px 14px 4px;font-size:10.5px;color:var(--color-text-faint);text-transform:uppercase;font-weight:700;}
.notif-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--color-border);cursor:pointer;}
.notif-item:hover{background:var(--color-surface-alt);}
.notif-item.unread{background:rgba(190,138,138,.05);}
.notif-item .dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);flex-shrink:0;margin-top:5px;}
.notif-item .txt .t{font-weight:600;font-size:12.5px;}
.notif-item .txt .d{font-size:12px;color:var(--color-text-muted);}
.notif-item .txt .ts{font-size:10.5px;color:var(--color-text-faint);margin-top:2px;}
.pos-rel{position:relative;}
.bell-dot{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--red-600);border:2px solid var(--color-surface);}

/* ---------- misc ---------- */
.toast-stack{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--coffee-900);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:10px;
  opacity:0;transform:translateY(8px) scale(.96);
  transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out);}
.toast.open{opacity:1;transform:translateY(0) scale(1);}
.toast.success{background:var(--forest-700);}
.toast.danger{background:var(--red-700);}
.pc-photo{width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--coffee-100);margin-bottom:10px;}
.pc-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.np-panel{max-width:620px;}
.np-photo-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.np-photo-actions .btn{padding:16px 10px;font-size:15px;justify-content:center;}
.np-panel .photo-preview-grid{grid-template-columns:repeat(5,1fr);}
.np-panel #npNombre,.np-panel #npPrecio{font-size:17px;padding:14px;}
.np-guardar{padding:16px;font-size:16px;margin-top:6px;}
.mas-opciones{border:1px solid var(--color-border);border-radius:12px;padding:0 14px;margin:4px 0 18px;background:var(--color-surface-alt);}
.mas-opciones summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;}
.mas-opciones summary::-webkit-details-marker{display:none;}
.mas-opciones[open] summary{border-bottom:1px solid var(--color-border);margin-bottom:14px;}
.mas-opciones .chev svg{width:18px;height:18px;stroke:var(--color-text-muted);transition:transform 160ms var(--ease-out);}
.mas-opciones[open] .chev svg{transform:rotate(180deg);}
.progress-bar{height:8px;background:var(--color-surface-alt);border-radius:99px;overflow:hidden;}
.progress-bar>span{display:block;height:100%;width:0;background:var(--color-accent);transition:width 200ms var(--ease-out);}
.photo-drop{border:1.5px dashed var(--color-border);border-radius:10px;padding:10px 12px;text-align:center;cursor:pointer;background:var(--color-surface-alt);
  display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color 150ms var(--ease-out);}
.photo-drop:hover{border-color:var(--color-accent);}
.photo-drop svg{width:16px;height:16px;stroke:var(--color-text-faint);flex-shrink:0;}
.photo-drop .pd-text{text-align:left;line-height:1.3;}
.photo-drop .pd-text .t{font-size:12.5px;font-weight:600;}
.photo-drop .pd-text .s{font-size:10.5px;color:var(--color-text-faint);}
.photo-preview-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;}
.photo-preview{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--coffee-100);}
.photo-preview img{width:100%;height:100%;object-fit:cover;}
.photo-preview button{position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;background:rgba(15,23,42,.75);color:#fff;border:none;cursor:pointer;font-size:11px;line-height:1;}
.gasto-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--color-border);}
.gasto-row input[type=checkbox]{width:auto;}
.gasto-row .g-name{flex:1;font-size:13px;}
.gasto-row input[type=number]{width:90px;}
.calc-box{background:var(--color-surface-alt);border-radius:12px;padding:14px 16px;margin-top:14px;}
.calc-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
.calc-row.total{font-weight:700;font-size:15px;border-top:1px dashed var(--color-border);margin-top:6px;padding-top:8px;}
.calc-row.comision{color:var(--forest-700);font-weight:700;}
.video-embed{position:relative;width:100%;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;background:#000;margin:0 auto 14px;}
.video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
/* TikTok es vertical (9:16, "estilo teléfono") — un iframe 16:9 lo deja aplastado */
.video-embed.tiktok{width:100%;max-width:300px;height:auto;padding-bottom:0;aspect-ratio:9/16;}
.pill-tabs{display:flex;gap:6px;background:var(--color-surface-alt);padding:4px;border-radius:999px;width:fit-content;margin-bottom:16px;}
.pill-tab{padding:7px 16px;border-radius:999px;border:none;background:none;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--color-text-muted);}
.pill-tab.active{background:var(--color-surface);color:var(--color-text);box-shadow:var(--shadow);}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:140px;}
.bar-chart .bar{flex:1;background:var(--color-accent);border-radius:4px 4px 0 0;min-height:2px;position:relative;}
.bar-chart .bar:hover{background:var(--color-accent-dark);}
.bar-chart-labels{display:flex;gap:6px;margin-top:6px;}
.bar-chart-labels span{flex:1;text-align:center;font-size:9.5px;color:var(--color-text-faint);}

/* ---------- exportar a PDF (impresión nativa, solo los datos del reporte) ---------- */
.print-only{display:none;}
@media print{
  body *{visibility:hidden;}
  #reportePrintArea, #reportePrintArea *{visibility:visible;}
  #reportePrintArea{display:block;position:absolute;top:0;left:0;width:100%;padding:0;color:#1a1310;font-family:var(--font-body);}
  .print-header{margin-bottom:18px;}
  .print-header h1{font-size:19px;margin-bottom:3px;}
  .print-sub{font-size:11px;color:#6b5a4d;}
  .print-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px;}
  .print-kpis div{border:1px solid #ddd;border-radius:8px;padding:8px 10px;}
  .print-kpis span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:#8a7a6d;margin-bottom:3px;}
  .print-kpis strong{font-size:14px;}
  #reportePrintArea h2{font-size:13px;margin:18px 0 8px;}
  .print-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:6px;}
  .print-table th,.print-table td{border:1px solid #ddd;padding:5px 8px;text-align:left;}
  .print-table th{background:#f4ede4;}
  @page{margin:16mm;}
}
.public-page{max-width:520px;margin:0 auto;padding:30px 18px 60px;}
.public-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-lg);}
.public-gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;}
.public-gallery img{width:100%;flex-shrink:0;scroll-snap-align:start;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in;}
/* ---------- lightbox (zoom de fotos) ---------- */
.lightbox-overlay{position:fixed;inset:0;background:rgba(15,10,8,.92);z-index:3000;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 200ms var(--ease-out);}
.lightbox-overlay.open{opacity:1;}
.lightbox-img{max-width:90vw;max-height:88vh;object-fit:contain;border-radius:8px;transform:scale(.96);transition:transform 200ms var(--ease-out);}
.lightbox-overlay.open .lightbox-img{transform:scale(1);}
.lightbox-close{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 150ms var(--ease-out);}
.lightbox-close:hover{background:rgba(255,255,255,.24);}
.lightbox-close svg{width:18px;height:18px;stroke:currentColor;}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:none;cursor:pointer;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background 150ms var(--ease-out);}
.lightbox-nav:hover{background:rgba(255,255,255,.24);}
.lightbox-nav.prev{left:18px;}
.lightbox-nav.next{right:18px;}
.lightbox-count{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.78);font-size:12.5px;}
.public-body{padding:20px;}
.qr-box{text-align:center;}
.theme-swatch-grid{display:flex;gap:12px;flex-wrap:wrap;}
.theme-swatch{--swatch:#BE8A8A;width:38px;height:38px;border-radius:50%;border:3px solid transparent;background:var(--swatch);
  cursor:pointer;position:relative;transition:transform 150ms var(--ease-out),border-color 150ms var(--ease-out);}
.theme-swatch:hover{transform:translateY(-2px) scale(1.06);}
.theme-swatch:active{transform:scale(.93);}
.theme-swatch.active{border-color:var(--color-text);}
.theme-swatch.active::after{content:'';position:absolute;inset:-6px;border:1.5px solid var(--color-border);border-radius:50%;}
.qr-box canvas,.qr-box img{margin:0 auto;}
.text-muted{color:var(--color-text-muted);}
.text-faint{color:var(--color-text-faint);}
.text-center{text-align:center;}
.mt-8{margin-top:8px;}.mt-16{margin-top:16px;}.mb-0{margin-bottom:0;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}

/* ---------- Celular (Android): barra inferior, botones grandes ---------- */
.bottom-nav{display:none;}
@media (max-width:980px){
  button.menu-toggle{display:none;}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:250;background:var(--color-surface);
    border-top:1px solid var(--color-border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));align-items:flex-end;
    box-shadow:0 -4px 18px rgba(42,29,21,.08);}

    color:var(--color-text-muted);font-size:11px;font-weight:600;min-height:54px;border-radius:14px;cursor:pointer;
    transition:color 150ms var(--ease-out),transform 120ms var(--ease-out);}

.product-card{display:flex;flex-direction:column;}

.product-card .pct{display:block;margin-top:1px;}
.product-card .body{padding:0 10px 10px;}
.product-card .actions{display:flex;gap:6px;border-top:none;padding-top:6px;}
.product-card .actions:empty{display:none;}
.product-card .actions .btn{flex:1;justify-content:center;padding-left:8px;padding-right:8px;white-space:nowrap;}
.pc-more{display:none;position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.93);border:none;
  box-shadow:0 1px 6px rgba(0,0,0,.25);align-items:center;justify-content:center;color:#3b2a20;cursor:pointer;padding:0;}
.pc-more:active{transform:scale(.92);}
.pc-more svg{width:20px;height:20px;stroke:currentColor;fill:currentColor;}
.product-card .icon-actions-row{margin-top:2px;}
@media (max-width:980px){
  .card-grid,.kanban-cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .kanban-cards{padding:0 10px 12px;}
  .product-card .pc-photo{aspect-ratio:1/1;}
  .product-card .icon-actions-row{display:none;}
  .pc-more{display:flex;}
  .product-card .actions .btn svg{display:none;}
  .product-card .actions .btn{padding-left:4px;padding-right:4px;}
  .toolbar .buscador{flex:1 1 100%;}
  .toolbar .btn{flex:1 1 auto;}
  .toolbar #btnCompartirCatalogo{flex:1 1 calc(100% - 60px);}
  .toolbar #btnNuevoCliente{flex:1 1 100%;}
  .toolbar #btnInvMas{flex:0 0 48px;padding-left:0;padding-right:0;justify-content:center;}
  .toolbar #btnInvMas svg{fill:currentColor;}
}

/* Búsqueda global */
.res-grupo{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-faint);margin:14px 2px 6px;}
.res-grupo:first-child{margin-top:0;}
.res-item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;cursor:pointer;width:100%;background:none;border:none;text-align:left;color:inherit;font:inherit;}
.res-item:hover{background:var(--color-surface-alt);}
.res-item:active{background:var(--coffee-100);}
.res-thumb{width:46px;height:46px;border-radius:10px;overflow:hidden;background:var(--coffee-100);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--color-text-faint);font-weight:800;}
.res-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.res-thumb svg{width:22px;height:22px;stroke:currentColor;fill:none;}
.res-thumb.debe{background:var(--red-100,#fde8e8);color:var(--red-700);}
.res-main{flex:1;min-width:0;}
.res-nombre{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.res-sub{font-size:12px;color:var(--color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.res-right{text-align:right;flex-shrink:0;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
a.mas-item{text-decoration:none;color:inherit;}
.estado-tabs{margin-bottom:2px;}
.estado-tab{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);
  border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;transition:transform 120ms var(--ease-out);}
.estado-tab:active{transform:scale(.97);}
.estado-tab .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.estado-tab .n{background:var(--color-surface-alt);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--color-text-muted);}
.estado-tab.active{background:var(--color-text);border-color:var(--color-text);color:var(--color-surface);}
.estado-tab.active .n{background:rgba(255,255,255,.22);color:inherit;}
.estado-nota{font-size:12.5px;color:var(--color-text-muted);margin:2px 2px 12px;}
.chips-scroll.cats .chip{padding:5px 12px;min-height:32px;font-size:12px;}
.solo-celular{display:none;}
@media (max-width:980px){ .solo-escritorio{display:none !important;} .solo-celular{display:inline-flex;} }
.res-mas{font-size:12px;color:var(--color-text-faint);text-align:center;padding:8px 0 0;}

/* Clientes */
.cliente-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px;}
.cliente-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;}
.cl-top{display:flex;align-items:center;gap:12px;cursor:pointer;}
.cl-avatar{width:44px;height:44px;border-radius:50%;background:var(--coffee-100);color:var(--color-accent-dark);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cl-avatar.debe{background:var(--red-100,#fde8e8);color:var(--red-700);}
.cl-main{flex:1;min-width:0;}
.cl-nombre{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cl-sub{font-size:12px;color:var(--color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cl-deuda{text-align:right;flex-shrink:0;}
.cl-deuda-n{font-weight:800;font-size:15px;color:var(--red-700);}
.cl-deuda small{display:block;font-size:10.5px;color:var(--color-text-muted);}
.cl-actions{display:flex;gap:8px;align-items:center;border-top:1px solid var(--color-border);padding-top:10px;}
.cl-actions .spacer{flex:1;}
.cobro-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px;}
.cobro-card{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--color-border);border-radius:14px;background:var(--color-surface);}
.cobro-main{flex:1;min-width:0;}
.cobro-prod{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cobro-sub{font-size:12px;color:var(--color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cobro-monto{font-weight:800;font-size:15px;color:var(--red-700);text-align:right;}
.cobro-der{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}

/* Inicio */
.home-hello{margin:0 2px 14px;}
.home-hello h2{font-size:22px;margin:0;}
.home-hello p{margin:2px 0 0;color:var(--color-text-muted);font-size:13px;}
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.qa-grid.qa-6{grid-template-columns:repeat(3,1fr);}
@media (min-width:981px){ .qa-grid.qa-6{grid-template-columns:repeat(6,1fr);} }
.qa-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:12px 4px;border:1px solid var(--color-border);background:var(--color-surface);
  border-radius:16px;font-size:12px;font-weight:600;color:var(--color-text);cursor:pointer;min-height:84px;transition:transform 120ms var(--ease-out);}
.qa-tile:active{transform:scale(.96);}
.qa-tile .qa-ic{width:38px;height:38px;border-radius:12px;background:var(--coffee-100);display:flex;align-items:center;justify-content:center;}
.qa-tile svg{width:20px;height:20px;stroke:var(--color-accent-dark);fill:none;}
.hero-card{background:var(--color-accent);color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:16px;}
.hero-label{font-size:11.5px;opacity:.88;text-transform:uppercase;letter-spacing:.07em;font-weight:700;}
.hero-num{font-size:32px;font-weight:800;margin:4px 0 6px;line-height:1.1;}
.hero-delta{display:inline-block;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.28);}
.hero-stats b{display:block;font-size:16px;}
.hero-stats span{font-size:11px;opacity:.88;}
.venta-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--color-border);}
.venta-item:last-child{border-bottom:none;}
.vi-main{min-width:0;flex:1;}
.vi-nombre{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vi-sub{font-size:12px;color:var(--color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vi-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.vi-monto{font-weight:700;font-size:14px;}
.vi-btns{display:flex;gap:6px;flex-shrink:0;}
details.panel-plegable>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;}
details.panel-plegable>summary::-webkit-details-marker{display:none;}
details.panel-plegable>summary .chev{transition:transform 160ms var(--ease-out);}
details.panel-plegable[open]>summary .chev{transform:rotate(180deg);}
details.panel-plegable>summary .chev svg{width:18px;height:18px;stroke:var(--color-text-muted);fill:none;}
@media (max-width:420px){ .hero-num{font-size:28px;} .qa-tile{font-size:11.5px;} }

/* Catálogo público: buscador + orden */
.cat-tools{display:flex;gap:8px;margin-bottom:4px;}
.cat-tools input{flex:1;min-width:0;}
.cat-tools select{width:auto;flex-shrink:0;max-width:44%;}

/* ---------- Vitrina: catálogo público y ficha (lo que ve la clienta) ---------- */
.public-page.wide{max-width:1100px;padding:0 0 96px;}
.sf-hero{position:relative;overflow:hidden;text-align:center;color:#fff;padding:34px 20px 40px;border-radius:0 0 34px 34px;
  background:linear-gradient(155deg,var(--color-accent) 0%,var(--coffee-800,#5a3d30) 100%);}
.sf-hero::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08);top:-90px;right:-70px;}
.sf-hero::after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-80px;left:-50px;}
.sf-hero>*{position:relative;z-index:1;}
.sf-logo{width:76px;height:76px;border-radius:22px;display:block;margin:0 auto 12px;object-fit:cover;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.28);}
.sf-hero h1{font-size:30px;color:#fff;margin:0;letter-spacing:-.01em;}
.sf-hero p{margin:6px auto 0;opacity:.92;font-size:14px;max-width:340px;line-height:1.4;}
.sf-contact{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:11px 20px;border-radius:999px;background:#fff;color:var(--color-accent-dark);
  font-weight:800;font-size:14px;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.22);transition:transform 120ms var(--ease-out);}
.sf-contact:active{transform:scale(.97);}
.sf-contact svg{width:18px;height:18px;stroke:currentColor;fill:none;}
.sf-bar{position:sticky;top:0;z-index:30;background:var(--color-bg);padding:12px 16px 2px;box-shadow:0 6px 14px -10px rgba(42,29,21,.35);}
.sf-tools{display:flex;gap:8px;}
.sf-search{position:relative;flex:1;min-width:0;}
.sf-search>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--color-text-faint);fill:none;pointer-events:none;}
.sf-search input{width:100%;padding-left:42px;border-radius:14px;min-height:46px;}
.sf-tools select{width:auto;flex-shrink:0;max-width:42%;border-radius:14px;min-height:46px;}
.sf-chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.sf-chips::-webkit-scrollbar{display:none;}
.sf-chip{flex-shrink:0;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-muted);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;min-height:38px;transition:transform 120ms var(--ease-out);}
.sf-chip:active{transform:scale(.96);}
.sf-chip.active{background:var(--color-accent);border-color:var(--color-accent);color:#fff;}
.sf-conteo{padding:14px 18px 4px;font-size:13px;color:var(--color-text-muted);font-weight:600;}
.sf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:8px 16px 0;}
@media (min-width:640px){.sf-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:8px 24px 0;}}
@media (min-width:960px){.sf-grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
.sf-card{display:flex;flex-direction:column;background:var(--color-surface);border:1px solid var(--color-border);border-radius:20px;overflow:hidden;cursor:pointer;
  box-shadow:0 3px 12px rgba(42,29,21,.07);animation:sfIn 480ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 45ms);transition:transform 160ms var(--ease-out),box-shadow 200ms var(--ease-out);}
.sf-card:active{transform:scale(.98);}
@media (hover:hover) and (pointer:fine){.sf-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(42,29,21,.14);}.sf-card:hover .sf-foto img{transform:scale(1.05);}}
.sf-foto{position:relative;aspect-ratio:4/5;background:var(--coffee-100);overflow:hidden;}
.sf-foto img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 450ms var(--ease-out);}
.sf-sinfoto{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--color-text-faint);font-size:12px;}
.sf-sinfoto svg{width:34px;height:34px;stroke:currentColor;fill:none;}
.sf-nuevo{position:absolute;top:10px;left:10px;background:var(--color-accent);color:#fff;font-size:11px;font-weight:800;padding:4px 11px;border-radius:999px;letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.sf-fotos{position:absolute;bottom:10px;right:10px;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
.sf-fotos svg{width:12px;height:12px;stroke:currentColor;fill:none;}
.sf-info{display:flex;flex-direction:column;gap:3px;padding:12px 13px 14px;flex:1;}
.sf-cat{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sf-nombre{font-weight:700;font-size:14.5px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.56em;}
.sf-precio{font-size:20px;font-weight:800;color:var(--color-accent-dark);margin-top:2px;}
.sf-btn{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 8px;border-radius:13px;background:var(--color-accent);color:#fff;font-weight:700;font-size:13.5px;
  border:none;text-decoration:none;cursor:pointer;}
.sf-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;}
.sf-btn.sec{background:var(--color-surface-alt);color:var(--color-text);}
.sf-vacio{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--color-text-muted);}
.sf-vacio svg{width:44px;height:44px;stroke:var(--color-text-faint);fill:none;margin-bottom:10px;}
.sf-vacio b{display:block;font-size:16px;color:var(--color-text);margin-bottom:4px;}
.sf-skel{border-radius:20px;overflow:hidden;background:var(--color-surface);border:1px solid var(--color-border);}
.sf-skel .a{aspect-ratio:4/5;} .sf-skel .b{height:14px;margin:14px 13px 8px;border-radius:7px;} .sf-skel .c{height:18px;width:50%;margin:0 13px 18px;border-radius:7px;}
.sf-skel .a,.sf-skel .b,.sf-skel .c{background:linear-gradient(90deg,var(--color-surface-alt) 25%,var(--color-bg) 50%,var(--color-surface-alt) 75%);background-size:200% 100%;animation:sfShimmer 1.4s linear infinite;}
.sf-pie{text-align:center;padding:30px 24px 0;color:var(--color-text-faint);font-size:12.5px;line-height:1.5;}
.sf-pie img{width:34px;height:34px;border-radius:10px;display:block;margin:0 auto 8px;opacity:.9;}
.sf-fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;width:58px;height:58px;border-radius:50%;background:#1FA855;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(31,168,85,.45);transition:transform 120ms var(--ease-out);}
.sf-fab:active{transform:scale(.93);}
.sf-fab svg{width:28px;height:28px;stroke:#fff;fill:none;}
@keyframes sfIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes sfShimmer{to{background-position:-200% 0;}}
@media (prefers-reduced-motion:reduce){.sf-card{animation:none;}.sf-skel .a,.sf-skel .b,.sf-skel .c{animation:none;}}
/* detalle (hoja inferior) */
.sf-gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:18px;margin-bottom:6px;scrollbar-width:none;}
.sf-gal::-webkit-scrollbar{display:none;}
.sf-gal img{width:100%;flex-shrink:0;scroll-snap-align:center;aspect-ratio:1/1;object-fit:cover;cursor:zoom-in;background:var(--coffee-100);}
.sf-dots{display:flex;justify-content:center;gap:6px;margin:8px 0 4px;}
.sf-dots i{width:7px;height:7px;border-radius:50%;background:var(--color-border);transition:background 150ms,transform 150ms;}
.sf-dots i.on{background:var(--color-accent);transform:scale(1.25);}
.sf-d-cat{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--color-accent-dark);background:var(--coffee-100);padding:4px 11px;border-radius:999px;}
.sf-d-nombre{font-size:21px;font-weight:800;line-height:1.2;margin:10px 0 4px;}
.sf-d-precio{font-size:28px;font-weight:800;color:var(--color-accent-dark);margin:2px 0 10px;}
.sf-d-desc{color:var(--color-text-muted);font-size:14.5px;line-height:1.55;white-space:pre-line;}
.sf-cta-bar{position:sticky;bottom:0;background:var(--color-surface);padding:10px 0 calc(6px + env(safe-area-inset-bottom));margin-top:14px;}
.sf-cta-bar .sf-cta{margin-top:0;}
.sf-cta-bar .sf-cta.sec{margin-top:8px;}
.sf-cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:18px;padding:15px 12px;border-radius:16px;background:#1FA855;color:#fff;font-weight:800;font-size:15px;text-decoration:none;border:none;cursor:pointer;box-shadow:0 8px 20px rgba(31,168,85,.3);}
.sf-cta svg{width:22px;height:22px;stroke:currentColor;fill:none;}
.sf-cta.sec{background:var(--color-surface-alt);color:var(--color-text);box-shadow:none;margin-top:10px;font-size:14px;padding:12px;}
/* ficha individual (QR) */
.sf-ficha-top{display:flex;align-items:center;gap:10px;padding:16px 18px;}
.sf-ficha-top img{width:40px;height:40px;border-radius:12px;}
.sf-ficha-top b{font-size:16px;flex:1;}
.sf-ficha-top a{font-size:13px;font-weight:700;color:var(--color-accent-dark);text-decoration:none;}
.avisos-box{background:var(--color-surface-alt);border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:13.5px;}
.avisos-btns{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- Extras, cajas de entrega, bodega ---------- */
.extra-row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:14px;margin-bottom:8px;cursor:pointer;}
.extra-row:active{background:var(--color-surface-alt);}
.extra-row .res-sub svg{width:12px;height:12px;stroke:currentColor;fill:none;vertical-align:-1px;}
.grupo-head{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 8px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-muted);}
.grupo-head b{background:var(--color-surface);border:1px solid var(--color-border);border-radius:999px;padding:1px 10px;font-size:11.5px;}
.seg{display:flex;gap:4px;background:var(--color-surface-alt);padding:4px;border-radius:12px;}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:9px 6px;font-size:13px;font-weight:700;color:var(--color-text-muted);cursor:pointer;min-height:40px;transition:background 120ms var(--ease-out),color 120ms var(--ease-out);}
.seg button.on{background:var(--color-surface);color:var(--color-text);box-shadow:0 1px 4px rgba(42,29,21,.16);}
.seg button.on.verde{background:#2F7D4F;color:#fff;}
.seg-grande button{font-size:15px;min-height:46px;}
.resumen-caja{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.resumen-caja div{background:var(--color-surface-alt);border-radius:14px;padding:12px 6px;text-align:center;}
.resumen-caja b{display:block;font-size:17px;}
.resumen-caja span{font-size:11.5px;color:var(--color-text-muted);font-weight:600;}
.resumen-caja .debe{background:#FBE3E0;} .resumen-caja .debe b{color:#B3261E;}
.resumen-caja .ok{background:#E3F1E8;} .resumen-caja .ok b{color:#2F7D4F;}
.caja-item{padding:12px 0;border-bottom:1px solid var(--color-border);}
.caja-item:last-child{border-bottom:none;}
.ci-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;}
.ci-nom{font-weight:700;font-size:14.5px;min-width:0;}
.ci-nom small{display:block;font-weight:500;color:var(--color-text-faint);font-size:11.5px;}
.ci-precio{font-weight:800;white-space:nowrap;}
.caja-foot{flex-wrap:wrap;gap:8px;justify-content:flex-end;}
.caja-foot .btn{flex:1 1 auto;justify-content:center;}
.caja-acciones{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.cn-lista{max-height:46vh;overflow-y:auto;border:1px solid var(--color-border);border-radius:14px;}
.cn-fila{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--color-border);cursor:pointer;}
.cn-fila:last-child{border-bottom:none;}
.cn-fila[hidden]{display:none;}
.cn-chk{width:22px;height:22px;flex-shrink:0;}
.cn-nom{flex:1;min-width:0;font-weight:600;font-size:14px;}
.cn-nom small{display:block;font-weight:500;color:var(--color-text-faint);font-size:11.5px;}
.cn-precio{width:96px;flex-shrink:0;padding:8px 10px;text-align:right;}
.cn-resumen{margin-right:auto;font-weight:700;font-size:14px;}
.ubi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.ubi-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:16px;overflow:hidden;cursor:pointer;}
.ubi-card:active{transform:scale(.98);}
.ubi-foto{aspect-ratio:4/3;background:var(--coffee-100);}
.ubi-foto img{width:100%;height:100%;object-fit:cover;display:block;}
.ubi-info{padding:10px 12px 12px;}
.ubi-nombre{font-weight:800;font-size:15px;}
.ubi-desc{font-size:12px;color:var(--color-text-muted);margin-top:2px;}
.ubi-n{font-size:12px;color:var(--color-text-faint);margin-top:6px;font-weight:600;}
@media (min-width:981px){ #btnNuevaExterna,#btnNuevaCajaExt,#btnNuevaUbicacion{flex:0 0 auto !important;} }
.ext-fila{display:flex;align-items:center;gap:12px;width:100%;padding:10px 2px;background:none;border:none;border-bottom:1px solid var(--color-border);text-align:left;cursor:pointer;color:inherit;font:inherit;}
.ext-fila:active{background:var(--color-surface-alt);}
.ext-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.ext-nombre{font-weight:700;font-size:14.5px;}
.ext-sub{font-size:12px;color:var(--color-text-muted);}
.ext-deuda{font-weight:800;color:var(--red-700);}
.ext-botones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
.ext-botones .btn:first-child{grid-column:1/-1;}
.ubi-foto-grande{width:100%;border-radius:14px;max-height:300px;object-fit:cover;cursor:zoom-in;}

/* ---------- Vista con/sin fotos, entrega, lugar ---------- */
.vista-barra{display:flex;justify-content:flex-end;margin:0 2px 8px;}
.sw-fotos{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--color-text-muted);cursor:pointer;}
.sw{position:relative;width:46px;height:26px;display:inline-block;}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%;}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--color-border);transition:background 160ms var(--ease-out);pointer-events:none;}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform 160ms var(--ease-out);}
.sw input:checked + i{background:var(--color-accent);}
.sw input:checked + i::after{transform:translateX(20px);}
.product-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:14px;margin-bottom:8px;}
.pr-main{flex:1;min-width:0;cursor:pointer;}
.pr-name{font-weight:700;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pr-sub{font-size:12px;color:var(--color-text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pr-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.pr-price{font-weight:800;font-size:14px;}
.pr-more{width:40px;height:40px;flex-shrink:0;border-radius:12px;border:1px solid var(--color-border);background:var(--color-surface-alt);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text);padding:0;}
.pr-more svg{width:20px;height:20px;stroke:currentColor;fill:currentColor;}
.pr-oculto{display:none !important;}
.pc-ubi{font-size:11.5px;color:var(--color-text-muted);margin-top:4px;}
.pc-ubi svg{width:12px;height:12px;stroke:currentColor;fill:none;vertical-align:-1px;}
.qh-n.rojo{background:#FBE3E0;color:#B3261E;}
.badge.entrega-ok{background:#DCEFE3;color:#1B6B3E;}
.badge.entrega-no{background:#FBE3E0;color:#B3261E;}
.chip-nueva{border-style:dashed;color:var(--color-accent-dark);}
</style>
</head>

   puede hacer un rol específico).
===================================================================== */
const SUPABASE_URL = 'https://nacfhxkjwktohffktoxi.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hY2ZoeGtqd2t0b2hmZmt0b3hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MTIxMTksImV4cCI6MjEwNzQ4ODExOX0.CsPjpvYQm75UWwoRa2vQ9n3aR_CnYv9HqVSAjUgm4E4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Cambia con cada entrega del index.html: sirve para saber si el celular tiene la versión nueva.
const VERSION_PANEL = '16-oct-2026 · v6';
const money = (n) => ((DB.state && DB.state.configuracion && DB.state.configuracion.moneda_simbolo) || 'Q') + ' ' + (Number(n)||0).toFixed(2);

// configuracion llega como filas clave/valor/tipo; el resto del panel espera un objeto plano ya tipado
function configRowsToObject(rows){
  const c = {};
  (rows||[]).forEach(r=>{
    let v = r.valor;
    if(r.tipo==='number') v = Number(v);
    else if(r.tipo==='boolean') v = v==='true';
    c[r.clave] = v;
  });
  return c;
}

  authUserId: null,

  // Carga TODO lo que la sesión actual puede ver (RLS decide qué filas llegan)

    const [usuariosRes, usuariosPubRes, configRes, cajasRes, productosRes, fotosRes,

           pagosRes, devolucionesRes, bitacoraRes, notifRes, clientesRes, abonosRes] = await Promise.all([
      sb.from('usuarios').select('*'),
      sb.from('usuarios_publico').select('*'),
      sb.from('configuracion').select('*'),
      sb.from('cajas').select('*').order('fecha_apertura', { ascending:false }),

  fotosDe(productoId, fase){

  // Procesa cada foto en el navegador y la sube (3 a la vez) al bucket público
  // "productos-fotos"; solo se guarda la URL pública en fotos_producto.
  // Devuelve cuántas se subieron bien; onProgreso(hechas, total) es opcional.
  async subirFotos(productoId, fase, archivos, onProgreso){
    const existentes = this.fotosDe(productoId, fase).length;
    const fmt = formatoFoto();
    let hechas = 0, buenas = 0;
    const subir = async (archivo, i)=>{
      try{
        const { grande, mini } = await procesarFoto(archivo);
        const base = productoId + '/' + fase + '-' + (existentes+i+1) + '-' + Date.now();
        const opts = { contentType: fmt.mime, cacheControl: '31536000' };
        const [up] = await Promise.all([
          sb.storage.from('productos-fotos').upload(base + '.' + fmt.ext, grande, opts),
          sb.storage.from('productos-fotos').upload(base + '-t.' + fmt.ext, mini, opts)
        ]);
        if(up.error){ toast('No se pudo subir una foto: '+up.error.message,'danger'); return; }
        const { data:pub } = sb.storage.from('productos-fotos').getPublicUrl(base + '.' + fmt.ext);
        await sb.from('fotos_producto').insert({ producto_id:productoId, url_foto:pub.publicUrl, fase, orden: existentes+i+1, uploaded_by_id:this.currentUser().id });
        buenas++;
      }catch(e){ toast('No se pudo procesar una foto','danger'); }
      finally{ hechas++; if(onProgreso) onProgreso(hechas, archivos.length); }
    };
    const cola = archivos.map((a,i)=>[a,i]);
    await Promise.all(Array.from({ length: Math.min(3, cola.length) }, async ()=>{
      while(cola.length){ const [a,i] = cola.shift(); await subir(a,i); }
    }));
    return buenas;
  },
  // Borra la fila Y los archivos reales en Storage (si no, quedan huérfanos ocupando espacio).
  async eliminarFoto(fotoId){
    const foto = this.state.fotos.find(f=>f.id===fotoId); if(!foto) return { ok:false, error:'NO_ENCONTRADA' };
    const marcador = '/productos-fotos/';
    const idx = foto.url_foto.indexOf(marcador);
    if(idx !== -1){
      const path = decodeURIComponent(foto.url_foto.slice(idx + marcador.length));
      await sb.storage.from('productos-fotos').remove([path, urlMiniatura(path)]);
    }
    const { error } = await sb.from('fotos_producto').delete().eq('id', fotoId);
    if(error) return { ok:false, error: error.message };
    return { ok:true };
  },

  // "Archivar Vendidos": el servidor decide (misma regla que antes) — solo
  // elimina fotos de productos vendidos hace N días y los marca archivado=true.
  async archivarVendidos(){
    // El SQL (fn_archivar_vendidos) solo borra las filas de fotos: no puede
    // tocar Storage. Por eso, antes, el admin borra desde aquí los archivos
    // reales de los productos que están por archivarse. Si algo falla, se
    // cancela esta vuelta (los productos siguen sin archivar y se reintenta),
    // para no dejar archivos huérfanos ocupando espacio.
    if(this.isAdmin()){
      const d = Number(this.state && this.state.configuracion.dias_archivo_productos_vendidos);
      const dias = Number.isNaN(d) ? 2 : d;
      const limite = new Date(Date.now() - dias * 86400000).toISOString();
      const { data: cand, error: errCand } = await sb.from('productos').select('id')
        .eq('estado','vendido').eq('archivado', false).lt('vendido_en', limite);
      if(errCand) return 0;
      for(const p of (cand||[])){
        const { data: archivos, error: errList } = await sb.storage.from('productos-fotos').list(p.id);
        if(errList) return 0;
        if(archivos && archivos.length){
          const { error: errRem } = await sb.storage.from('productos-fotos').remove(archivos.map(a=>p.id+'/'+a.name));
          if(errRem) return 0;
        }
      }
    }
    const { data, error } = await sb.rpc('fn_archivar_vendidos');
    return error ? 0 : data;
  },
  diasParaEliminar(p){
    if(!p.archivado || !p.archivado_en) return null;
    const dias = Number(this.state.configuracion.dias_eliminacion_productos_archivados)||30;
    const transcurridos = (Date.now() - new Date(p.archivado_en).getTime()) / 86400000;
    return Math.max(0, Math.ceil(dias - transcurridos));
  },

  extraFotoCompartida(url, exceptoId){ return !!url && this.state.extras.some(x=>x.id!==exceptoId && x.foto_url===url); },
  async crearExtras(d, cantidad, archivo){
    const n = Math.max(1, Math.min(200, parseInt(cantidad,10) || 1));
    let foto_url = null, aviso = null;
    if(archivo){
      try{ foto_url = await this.subirFotoSuelta('extras/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now()), archivo); }
      catch(e){ aviso = 'La foto no se pudo subir'; }
    }
    const fila = {
      nombre:d.nombre.trim(), descripcion:(d.descripcion||'').trim() || null, categoria:d.categoria || null,
      costo:Number(d.costo)||0, precio_venta:Number(d.precio_venta)||0, precio_externa:Number(d.precio_externa)||0,
      ubicacion_id:d.ubicacion_id || null, foto_url
    };
    const { data, error } = await sb.from('extras_productos').insert(Array.from({ length:n }, ()=>({ ...fila }))).select();
    if(error) return { ok:false, error:error.message };
    await this.bitacora('crear', 'extras_productos', data[0].id, n + ' producto(s) extra: ' + fila.nombre);
    return { ok:true, data, aviso };
  },
  async editarExtra(id, d, archivo){
    const previo = this.state.extras.find(x=>x.id===id);
    const datos = {
      nombre:d.nombre.trim(), descripcion:(d.descripcion||'').trim() || null, categoria:d.categoria || null,
      costo:Number(d.costo)||0, precio_venta:Number(d.precio_venta)||0, precio_externa:Number(d.precio_externa)||0,
      ubicacion_id:d.ubicacion_id || null
    };
    let aviso = null;
    if(archivo){
      try{
        datos.foto_url = await this.subirFotoSuelta('extras/' + id, archivo);
      }catch(e){ aviso = 'La foto no se pudo subir'; }
    }
    const { data:row, error } = await sb.from('extras_productos').update(datos).eq('id', id).select().single();
    if(error) return { ok:false, error:error.message };
    if(datos.foto_url && previo && previo.foto_url && !this.extraFotoCompartida(previo.foto_url, id)) await this.borrarFotoSuelta(previo.foto_url);
    await this.bitacora('editar', 'extras_productos', id, 'Producto extra editado: ' + row.nombre);
    return { ok:true, data:row, aviso };
  },
  async eliminarExtra(id){
    const e = this.state.extras.find(x=>x.id===id); if(!e) return { ok:false, error:'NO_ENCONTRADO' };
    if(e.estado !== 'disponible') return { ok:false, error:'EN_CAJA' };
    const { error } = await sb.from('extras_productos').delete().eq('id', id);
    if(error) return { ok:false, error:error.message };
    if(e.foto_url && !this.extraFotoCompartida(e.foto_url, id)) await this.borrarFotoSuelta(e.foto_url);
    await this.bitacora('eliminar', 'extras_productos', id, 'Producto extra eliminado: ' + e.nombre);
    return { ok:true };
  },
  // Pasa un extra al inventario general: exige fotos, crea el producto y quita el extra.
  async pasarExtraAInventario(extra, archivos, ubicacionId){
    if(!archivos || !archivos.length) return { ok:false, error:'SIN_FOTOS' };
    const r = await this.crearProducto({
      nombre:extra.nombre, descripcion:extra.descripcion || '', categoria:extra.categoria,
      costo:extra.costo, precio_venta:extra.precio_venta
    }, []);
    if(!r.ok) return r;
    const buenas = await this.subirFotos(r.data.id, 'inventario', archivos);
    if(!buenas){ await this.eliminarProducto(r.data.id); return { ok:false, error:'SIN_FOTOS' }; }
    if(ubicacionId) await sb.from('productos').update({ ubicacion_id:ubicacionId }).eq('id', r.data.id);
    const { error } = await sb.from('extras_productos').delete().eq('id', extra.id);
    if(error) return { ok:false, error:error.message };
    if(extra.foto_url && !this.extraFotoCompartida(extra.foto_url, extra.id)) await this.borrarFotoSuelta(extra.foto_url);
    await this.bitacora('editar', 'extras_productos', extra.id, 'Extra pasó al inventario: ' + extra.nombre);
    return { ok:true, data:r.data };
  },

  // --- Cajas de entrega
  itemsDeCaja(cajaId){ return this.state.extras_items.filter(i=>i.caja_id===cajaId); },
  pagosDeCaja(cajaId){ return this.state.extras_pagos.filter(p=>p.caja_id===cajaId).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)); },
  resumenCaja(cajaId){
    const items = this.itemsDeCaja(cajaId), pagos = this.pagosDeCaja(cajaId);
    const suma = f=>items.filter(f).reduce((s,i)=>s+Number(i.precio_externa),0);
    const vendido = suma(i=>i.estado==='vendido'), pagado = pagos.reduce((s,p)=>s+Number(p.monto),0);
    return {
      items, pagos, vendido, pagado,
      saldo: Math.round((vendido - pagado) * 100) / 100,
      total: suma(()=>true),
      tiene: items.filter(i=>i.estado==='entregado').length,
      vendidos: items.filter(i=>i.estado==='vendido').length,
      devueltos: items.filter(i=>i.estado==='devuelto').length
    };
  },
  deudaDeExterna(externaId){
    return this.state.cajas_ext.filter(c=>c.externa_id===externaId && c.estado==='abierta').reduce((s,c)=>s+Math.max(0, this.resumenCaja(c.id).saldo), 0);
  },
  async _rpcExtras(nombre, args){
    const { data, error } = await sb.rpc(nombre, args);
    return error ? { ok:false, error:error.message } : { ok:true, data };
  },
  crearCajaExterna(externaId, notas, items){ return this._rpcExtras('fn_extras_crear_caja', { p_externa:externaId, p_notas:notas||null, p_items:items }); },
  agregarItemsCaja(cajaId, items){ return this._rpcExtras('fn_extras_agregar_items', { p_caja:cajaId, p_items:items }); },
  cambiarItemCaja(itemId, estado){ return this._rpcExtras('fn_extras_cambiar_item', { p_item:itemId, p_estado:estado }); },
  pagarCaja(cajaId, monto, nota){ return this._rpcExtras('fn_extras_pagar', { p_caja:cajaId, p_monto:monto, p_nota:nota||null }); },
  pagarTodoCaja(cajaId){ return this._rpcExtras('fn_extras_pagar_todo', { p_caja:cajaId }); },
  async cerrarCajaExterna(cajaId){
    // Lo vendido se elimina de Extras; sus fotos (si tenían) se borran de Storage.
    const idsVendidos = this.itemsDeCaja(cajaId).filter(i=>i.estado==='vendido' && i.producto_id).map(i=>i.producto_id);
    const fotos = this.state.extras.filter(e=>idsVendidos.includes(e.id) && e.foto_url).map(e=>e.foto_url);
    const r = await this._rpcExtras('fn_extras_cerrar_caja', { p_caja:cajaId });
    if(!r.ok) return r;
    for(const url of new Set(fotos)){
      if(!this.state.extras.some(e=>!idsVendidos.includes(e.id) && e.foto_url===url)) await this.borrarFotoSuelta(url);
    }
    return r;
  },

  async guardarConfiguracion(data){
    for(const [clave, valor] of Object.entries(data)){
      // No hay política de INSERT en "configuracion" a propósito (solo UPDATE):
      // si la clave no existe todavía (falta correr una migración), el UPDATE
      // "funciona" pero no toca ninguna fila — con .select() lo detectamos y
      // avisamos, en vez de decir "guardado" cuando en realidad no se guardó nada.
      const { data:filas, error } = await sb.from('configuracion').update({ valor:String(valor) }).eq('clave', clave).select();
      if(error) return { ok:false, error: error.message };
      if(!filas || !filas.length) return { ok:false, error:'La clave "'+clave+'" todavía no existe en la base de datos — falta correr la migración que la agrega.' };
    }
    // Se vuelve a leer de la base: si el servidor no dejó el valor que se mandó, se avisa.
    const { data:chk } = await sb.from('configuracion').select('clave,valor').in('clave', Object.keys(data));
    const mal = (chk||[]).find(r=>String(data[r.clave])!==String(r.valor));
    if(mal) return { ok:false, error:'el servidor dejó "'+mal.clave+'" en '+mal.valor+' en lugar de '+data[mal.clave] };
    Object.assign(this.state.configuracion, data);
    await sb.rpc('fn_registrar_bitacora', { p_tipo:'editar', p_tabla:'configuracion', p_registro_id:null, p_descripcion:'Configuración actualizada' });
    return { ok:true };
  },
};

/* =====================================================================
   UTILIDADES
===================================================================== */
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = msg;
  document.getElementById('toastStack').appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('open')));
  const dismiss = ()=>{ el.classList.remove('open'); setTimeout(()=>el.remove(), 200); };
  setTimeout(dismiss, 3800);
}
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('es-GT',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit'}); }
// Etiquetas libres: el usuario las escribe separadas por coma en un solo campo de texto.
function parseEtiquetas(v){
  if(Array.isArray(v)) return v.map(t=>String(t).trim()).filter(Boolean);
  return String(v||'').split(',').map(t=>t.trim()).filter(Boolean);
}
// Parser de CSV minimalista (sin librería): soporta comas dentro de campos entre comillas.
function parseCSV(text){
  const filas = [];
  let fila = [], campo = '', enComillas = false;
  for(let i=0; i<text.length; i++){
    const c = text[i], next = text[i+1];
    if(enComillas){
      if(c==='"' && next==='"'){ campo+='"'; i++; }
      else if(c==='"'){ enComillas=false; }
      else campo += c;
    } else {
      if(c==='"') enComillas = true;
      else if(c===','){ fila.push(campo); campo=''; }
      else if(c==='\n' || c==='\r'){
        if(c==='\r' && next==='\n') i++;
        fila.push(campo); campo='';
        if(fila.some(v=>v.trim()!=='')) filas.push(fila);
        fila = [];
      } else campo += c;
    }
  }
  if(campo!=='' || fila.length){ fila.push(campo); if(fila.some(v=>v.trim()!=='')) filas.push(fila); }
  return filas;
}
// Convierte el CSV crudo en filas {nombre,categoria,...} + errores de validación por fila.
function parseCSVProductos(text){
  const filas = parseCSV(text);
  if(!filas.length) return { columnas:[], productos:[], errores:['El archivo está vacío'] };
  const encabezado = filas[0].map(h=>h.trim().toLowerCase());
  const idx = campo => encabezado.indexOf(campo);
  const productos = [], errores = [];
  for(let i=1; i<filas.length; i++){
    const f = filas[i];
    const get = campo => { const j = idx(campo); return j===-1 ? '' : (f[j]||'').trim(); };
    const nombre = get('nombre'), costo = get('costo'), precio_venta = get('precio_venta');
    if(!nombre || !costo || !precio_venta){
      errores.push('Fila '+(i+1)+': falta nombre, costo o precio_venta'); continue;
    }
    productos.push({
      nombre, categoria: get('categoria'), descripcion: get('descripcion'),
      costo, precio_venta, porcentaje_ganancia: get('porcentaje_ganancia'),
      url_video: get('url_video'), etiquetas: get('etiquetas')
    });
  }
  return { columnas:encabezado, productos, errores };
}
function fmtDateShort(iso){ if(!iso) return '—'; return new Date(iso).toLocaleDateString('es-GT',{day:'2-digit',month:'short'}); }
function timeAgo(iso){
  const s = Math.floor((Date.now()-new Date(iso).getTime())/1000);
  if(s<60) return 'hace un momento';
  if(s<3600) return 'hace '+Math.floor(s/60)+' min';
  if(s<86400) return 'hace '+Math.floor(s/3600)+' h';
  return 'hace '+Math.floor(s/86400)+' d';
}
// maxDim/quality bajos a propósito: con ~150 productos x hasta 5 fotos, este mock local
// (localStorage) se llena rápido. En producción con Supabase Storage esto no aplica —
// ahí se sube el archivo original y solo se guarda su URL en la fila de fotos_producto.
// Fotos livianas: máx. 1080 px, WebP (JPEG si el navegador no lo soporta) y
// una miniatura de 480 px para listas — ocupan ~5 veces menos que la foto
// original del celular, así el almacenamiento gratis rinde mucho más.
let formatoFotoCache = null;
function formatoFoto(){
  if(!formatoFotoCache){
    const c = document.createElement('canvas'); c.width = c.height = 1;
    formatoFotoCache = c.toDataURL('image/webp').startsWith('data:image/webp') ? { mime:'image/webp', ext:'webp' } : { mime:'image/jpeg', ext:'jpg' };
  }
  return formatoFotoCache;
}
// from-image respeta la orientación EXIF: sin esto, algunas fotos de Android/iPhone salen giradas.
async function cargarBitmapFoto(file){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file, { imageOrientation:'from-image' }); }catch(e){}
  }
  return await new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = reject; img.src = url;
  });
}
function redimensionarABlob(src, maxDim, calidad){
  const escala = Math.min(1, maxDim/Math.max(src.width, src.height));
  const w = Math.round(src.width*escala), h = Math.round(src.height*escala);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(src, 0, 0, w, h);
  return new Promise(res=>c.toBlob(b=>res(b), formatoFoto().mime, calidad));
}
async function procesarFoto(file){
  const bmp = await cargarBitmapFoto(file);
  const [grande, mini] = await Promise.all([redimensionarABlob(bmp, 1080, 0.72), redimensionarABlob(bmp, 480, 0.7)]);
  if(bmp.close) bmp.close();
  return { grande, mini };
}
// La miniatura vive junto a la foto: "xxx.webp" -> "xxx-t.webp". Las fotos
// viejas no la tienen, por eso el onerror cae a la foto completa.
function urlMiniatura(url){ return url.replace(/(\.[a-z0-9]+)$/i, '-t$1'); }
function imgMini(url, alt){
  return `<img src="${urlMiniatura(url)}" alt="${alt||''}" loading="lazy" onerror="this.onerror=null;this.src='${url}'">`;
}
